      const move = Math.min(spare, (soldiers[i] - soldiers[poor]) * 0.022 * movePace * stepRate(i, poor));
      next[i] -= move;
      next[poor] += move;
    }
  }
  soldiers.set(next);
}

function balanceCivilians() {
  const next = new Float32Array(civilians);
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const i = y * SW + x;
      const spare = civilians[i] - TILE_CIVIL_MIN;
      if (!owner[i] || spare < 0.04) continue;
      let poor = -1;
      let poorV = civilians[i] - 0.45;
      for (const nb of neighborsOf(x, y)) {
        if (owner[nb[2]] !== owner[i]) continue;
        if (civilians[nb[2]] < poorV) { poorV = civilians[nb[2]]; poor = nb[2]; }
      }
      if (poor < 0) continue;
      const move = Math.min(spare, (civilians[i] - civilians[poor]) * 0.0175 * movePace * stepRate(i, poor));
      next[i] -= move;
      next[poor] += move;
    }
  }
  civilians.set(next);
}

function autoConquer() {
  const takes = [];
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const i = y * SW + x;
      if (!owner[i]) continue;
      const spare = soldiers[i] - TILE_SOLDIER_MIN;
      if (spare < 0.35) continue;
      for (const nb of neighborsOf(x, y)) {
        if (!simLand[nb[2]] || owner[nb[2]]) continue;
        const thresh = 0.5 * Math.sqrt(simCost[nb[2]]) * (simRiver[nb[2]] ? 2.4 : 1);
        if (spare < thresh) continue;
        takes.push({ from: i, to: nb[2], realm: owner[i], surplus: spare - thresh });
      }
    }
  }
  takes.sort((a, b) => b.surplus - a.surplus);
  const usedFrom = new Uint8Array(SW * SH);
  const usedTo = new Uint8Array(SW * SH);
  const budget = new Uint8Array(realms.length + 1);
  for (const t of takes) {
    const home = realms[t.realm - 1];
    const cap = home && home.ai ? 4 : 3;
    if (budget[t.realm] >= cap || usedFrom[t.from] || usedTo[t.to]) continue;
    if (owner[t.from] !== t.realm || owner[t.to]) continue;
    const spare = soldiers[t.from] - TILE_SOLDIER_MIN;
    if (spare < 0.35) continue;
    const move = Math.min(spare, Math.max(0.55, spare * 0.45) * movePace);
    soldiers[t.from] -= move;
    soldiers[t.to] = move + 0.2;
    owner[t.to] = t.realm;
    usedFrom[t.from] = 1;
    usedTo[t.to] = 1;
    budget[t.realm]++;
  }
}

function cityOn(i) {
  for (let r = 0; r < realms.length; r++) {
    const cities = realms[r].cities;
    for (let c = 0; c < cities.length; c++) {
      if (cityCell(cities[c]) === i) return cities[c];
    }
  }
  return null;
}

function extraCover(from, to, landing) {
  let cover = 0;
  if (simRiver[to] || (from >= 0 && simRiver[from])) cover += 6.5;
  if (landing) cover += 7;
  const city = cityOn(to);
  if (city) cover += city.capital ? 13 : 8;
  return cover;
}

function captureCity(tile, newId) {
  for (let r = 0; r < realms.length; r++) {
    const realm = realms[r];
    for (let c = realm.cities.length - 1; c >= 0; c--) {
      const city = realm.cities[c];
      if (cityCell(city) !== tile) continue;
      realm.cities.splice(c, 1);
      if (city.capital || realm.capital === city) {
        city.capital = false;
        let next = null;
        for (let k = 0; k < realm.cities.length; k++) {
          if (!next || realm.cities[k].pop > next.pop) next = realm.cities[k];
        }
        realm.capital = next;
        if (next) next.capital = true;
      }
      const taker = realms[newId - 1];
      if (!taker) return;
      city.capital = !taker.capital;
      taker.cities.push(city);
      if (city.capital) taker.capital = city;
      if (realm.id !== newId && realm.lostCities && taker.tookFrom) {
        realm.lostCities[newId] += 1;
        taker.recentTakes += 1;
        taker.tookFrom[realm.id] += 1;
      }
      return;
    }
  }
}

function cityHeads(city) {
  return city.pop + (city.militia || 0);
}

function militiaOn(tile) {
  const city = cityOn(tile);
  return city && city.militia > 0 ? city.militia : 0;
}

function woundMilitia(tile, bodies) {
  if (!(bodies > 0)) return;
  const city = cityOn(tile);
  if (!city || !(city.militia > 0)) return;
  city.militia = Math.max(0, city.militia - bodies);
}

function attackResist(from, to, landing) {
  const cover = extraCover(from, to, landing);
  const men = soldiers[to] + militiaOn(to) * 0.5;
  const resist = simCost[to] + men * 1.7 + (owner[to] ? 1.4 : 0) + cover;
  return { resist, cover, need: resist * 0.55 };
}

function claimLand() {
  const claims = [];
  for (const realm of realms) {
    if (!realm.soldierOrders.length) continue;
    for (const order of realm.soldierOrders) {
      const tx = order.sx;
      const ty = order.sy;
      const reach = pullReach(order.strength) + 3;
      const cell = orderCell(order);
      const occ = owner[cell[2]];
      const open = warOpen(realm);
      const invade = !!(occ && occ !== realm.id && open[occ]);
      const hold = occ === realm.id && enemyNearPoint(realm, cell[0], cell[1], HOME_CLOSE * HOME_CLOSE);
      const foe = invade ? occ : 0;
      const war = invade ? Math.max(reach, WAR_REACH) : hold ? Math.max(reach, HOME_CLOSE) : reach;
      const reach2 = reach * reach;
      const war2 = war * war;
      const close2 = HOME_CLOSE * HOME_CLOSE;
    for (let y = 0; y < SH; y++) {
      for (let x = 0; x < SW; x++) {
        const i = y * SW + x;
        if (owner[i] !== realm.id || soldiers[i] < 0.25) continue;
        const here = dist2Sim(x, y, tx, ty);
        if (here > war2) continue;
        const outside = here > reach2;
        for (const nb of neighborsOf(x, y)) {
          if (!simLand[nb[2]] || !owner[nb[2]] || owner[nb[2]] === realm.id) continue;
          const neighborFoe = owner[nb[2]];
          if (!open[neighborFoe]) continue;
          const forced = (foe && neighborFoe === foe)
            || (hold && neighborFoe && neighborFoe !== realm.id && !(realm.ai && isAlly(realm, neighborFoe)) && dist2Sim(nb[0], nb[1], tx, ty) <= close2);
          if (outside && !forced) continue;
          const progress = here - dist2Sim(nb[0], nb[1], tx, ty);
          const resist = attackResist(i, nb[2], false).resist;
          const along = dist2Sim(nb[0], nb[1], tx, ty);
          const aimBonus = Math.max(along <= 0.1 ? 48 : along <= 2 ? 20 : 0, vectorAim(order, nb[0], nb[1]));
          claims.push({
            realm: realm.id,
            from: i,
            to: nb[2],
            fx: x,
            fy: y,
            tx: nb[0],
            ty: nb[1],
            forced,
            score: forced ? 8000 - here + aimBonus : (progress + 12 + aimBonus) / resist,
            resist,
          });
        }
      }
    }
    }
  }
  claims.sort((a, b) => b.score - a.score);
  const usedFrom = new Uint8Array(SW * SH);
  const usedTo = new Uint8Array(SW * SH);
  const budget = new Uint8Array(realms.length + 1);
  const forcedSpent = new Uint8Array(realms.length + 1);
  for (const c of claims) {
    const atkRealm = realms[c.realm - 1];
    const normalCap = atkRealm && atkRealm.ai ? 4 : 2;
    if (c.forced) {
      if (forcedSpent[c.realm] >= 8) continue;
    } else if (budget[c.realm] >= normalCap) continue;
    if (usedFrom[c.from] || usedTo[c.to]) continue;
    if (owner[c.from] !== c.realm || owner[c.to] === c.realm) continue;
    if (atkRealm && atkRealm.ai && isAlly(atkRealm, owner[c.to])) continue;
    const atk = soldiers[c.from];
    if (atk < 0.25) continue;
    const donors = [];
    let flank = 0;
    for (const nb of neighborsOf(c.fx, c.fy)) {
      if (flank >= 2.4 || usedFrom[nb[2]] || owner[nb[2]] !== c.realm) continue;
      const spareN = soldiers[nb[2]] - TILE_SOLDIER_MIN;
      if (spareN < 0.15) continue;
      let face = false;
      for (const n2 of neighborsOf(nb[0], nb[1])) {
        if (simLand[n2[2]] && owner[n2[2]] && owner[n2[2]] !== c.realm) { face = true; break; }
      }
      if (!face && spareN < 0.35) continue;
      const give = Math.min(0.5, spareN * 0.4, 2.4 - flank);
      flank += give;
      donors.push({ i: nb[2], give });
    }
    const milFrom = militiaOn(c.from);
    const milTo = militiaOn(c.to);
    const atkEff = atk + milFrom * 0.5 + flank;
    const defSoldiers = soldiers[c.to];
    const def = defSoldiers + milTo * 0.5;
    const hit = attackResist(c.from, c.to, false);
    const need = hit.need;
    const defender = owner[c.to];
    let loss = 0;
    if (def > 0.2) {
      const atkLoss = Math.min(atkEff, (def * 0.09 + hit.cover * 0.01) * fightPace);
      const defLoss = Math.min(def, atkEff * 0.075 * fightPace);
      loss = atkLoss + defLoss;
      const share = atkEff > 0 ? atkLoss / atkEff : 0;
      const soldierAtkLoss = (atk + flank) * share;
      const soldierDefLoss = defLoss * (defSoldiers / def);
      if (c.realm === 1) playerDeaths += soldierAtkLoss;
      if (defender === 1) playerDeaths += soldierDefLoss;
      noteTroopLoss(c.realm, defender, soldierAtkLoss);
      noteTroopLoss(defender, c.realm, soldierDefLoss);
      soldiers[c.from] = Math.max(0, atk - atk * share);
      if (milFrom > 0) woundMilitia(c.from, milFrom * share);
      for (let d = 0; d < donors.length; d++) {
        const donor = donors[d];
        soldiers[donor.i] = Math.max(0, soldiers[donor.i] - donor.give * share);
        usedFrom[donor.i] = 1;
      }
      soldiers[c.to] = Math.max(0, defSoldiers - soldierDefLoss);
      if (milTo > 0) woundMilitia(c.to, defLoss * milTo / def);
    }
    if (def > 0.2 || owner[c.to]) {
      aggro[c.to] += 3.2;
      aggro[c.from] += 1.4;
      markBattle(c.to, loss);
    }
    let stepper = c.from;
    if (soldiers[stepper] - TILE_SOLDIER_MIN <= 0.2) {
      for (let d = 0; d < donors.length; d++) {
        if (soldiers[donors[d].i] > soldiers[stepper]) stepper = donors[d].i;
      }
    }
    const spare = soldiers[stepper] - TILE_SOLDIER_MIN;
    const left = atkEff - Math.min(atkEff, def > 0.2 ? (def * 0.09 + hit.cover * 0.01) * fightPace : 0);
    const broken = soldiers[c.to] + militiaOn(c.to) * 0.5 <= 0.3;
    const gate = broken ? (simCost[c.to] + hit.cover) * 0.55 : need;
    if (spare > 0.2 && left > gate && broken) {
      const move = Math.min(spare, soldiers[stepper] * 0.22 * movePace, 1.1 * movePace);
      soldiers[stepper] -= move;
      soldiers[c.to] = move + 0.3;
      owner[c.to] = c.realm;
      captureCity(c.to, c.realm);
      realmDirty = true;
      usedTo[c.to] = 1;
    }
    usedFrom[c.from] = 1;
    if (c.forced) forcedSpent[c.realm]++;
    else budget[c.realm]++;
    if ((loss > 0.05 || owner[c.to] === c.realm) && fights.length < 16) {
      const [wx, wy] = cellWorld(c.tx, c.ty);
      let blue = atkEff;
      let red = Math.max(def, 0.5);
      if (defender === 1) { blue = def; red = atkEff; }
      else if (c.realm !== 1 && defender !== 1) { blue = atkEff; red = Math.max(def, simCost[c.to]); }
      fights.push({ x: wx, y: wy, blue: Math.max(1, Math.round(blue * 10) / 10), red: Math.max(1, Math.round(red * 10) / 10), life: 1.6, player: c.realm === 1 || defender === 1 });
    }
  }
}

function refreshBoatGoal(b) {
  const realm = realms[b.realmId - 1];
  if (!realm) return false;
  let best = null;
  let bestS = Infinity;
  for (let i = 0; i < realm.soldierOrders.length; i++) {
    const order = realm.soldierOrders[i];
    const dLaunch = dist2Sim(order.sx, order.sy, b.tx, b.ty);
    const sailing = order.kind === "sail" || order.aim === "sea";
    if (!sailing && dLaunch > 36) continue;
    let score = seaCloseness(b.x, b.y, order.sx, order.sy);
    if (sailing) score -= 8;
    if (dLaunch <= 16) score -= 4;
    if (score < bestS) { bestS = score; best = order; }
  }
  if (!best) return false;
  b.tx = best.sx;
  b.ty = best.sy;
  return true;
}

function coastToward(realmId, x, y, order) {
  const here = dist2Sim(x, y, order.sx, order.sy);
  const goal = orderCell(order);
  const targetSea = !simLand[goal[2]];
  let landP = 0;
  let seaNb = null;
  let seaP = 0;
  for (const nb of neighborsOf(x, y)) {
    const progress = here - dist2Sim(nb[0], nb[1], order.sx, order.sy);
    if (simLand[nb[2]]) {
      if (owner[nb[2]] === realmId && progress > landP) landP = progress;
    } else {
      const gain = progress * ((seaLane && seaLane[nb[2]]) ? SEA_LANE_SPEED : 1);
      if (gain > seaP) { seaP = gain; seaNb = nb; }
    }
  }
  if (!seaNb) return null;
  if (!targetSea && seaP <= landP + 0.2) return null;
  if (targetSea && seaP <= 0) return null;
  return seaNb;
}

function orderOverseas(fromI, order) {
  if (!landComp) return false;
  const cell = orderCell(order);
  if (!simLand[cell[2]] || !simLand[fromI]) return false;
  return landComp[cell[2]] !== landComp[fromI];
}

function formBoats() {
  if (!beachWork) return;
  const charging = new Uint8Array(SW * SH);
  for (const realm of realms) {
    if (!realm.soldierOrders.length) continue;
    for (let y = 0; y < SH; y++) {
      for (let x = 0; x < SW; x++) {
        const i = y * SW + x;
        if (owner[i] !== realm.id || !simLand[i] || soldiers[i] < TILE_SOLDIER_MIN + 0.5) continue;
        let bestO = null;
        let bestS = 0;
        let sailO = null;
        let sailS = 0;
        for (let k = 0; k < realm.soldierOrders.length; k++) {
          const order = realm.soldierOrders[k];
          const d2 = dist2Sim(x, y, order.sx, order.sy);
          if (orderOverseas(i, order)) {
            const time = seaCloseness(x, y, order.sx, order.sy);
            const s = order.strength / (time + 8);
            if (s > sailS) { sailS = s; sailO = order; }
          } else {
            const reach = pullReach(order.strength);
            if (d2 > reach * reach) continue;
            const s = order.strength / (d2 + 8);
            if (s > bestS) { bestS = s; bestO = order; }
          }
        }
        let focus = null;
        let seaNb = null;
        if (sailO) {
          seaNb = coastToward(realm.id, x, y, sailO);
          if (seaNb) focus = sailO;
        }
        if (!focus && bestO) {
          seaNb = coastToward(realm.id, x, y, bestO);
          if (seaNb) focus = bestO;
        }
        if (!focus || !seaNb) continue;
        charging[i] = 1;
        beachWork[i] += soldiers[i] * 0.05;
        if (beachWork[i] < 1.6) continue;
        const spare = soldiers[i] - TILE_SOLDIER_MIN;
        const embark = Math.min(spare, Math.max(0.6, spare * 0.7));
        if (embark < 0.45) continue;
        soldiers[i] -= embark;
        beachWork[i] = 0;
        boats.push({
          x: seaNb[0],
          y: seaNb[1],
          tx: focus.sx,
          ty: focus.sy,
          soldiers: embark,
          realmId: realm.id,
        });
      }
    }
  }
  for (let i = 0; i < beachWork.length; i++) {
    if (!charging[i] && beachWork[i] > 0) beachWork[i] *= 0.86;
  }
}

function shoreGate(tile, cover) {
  if (cityOn(tile) || simRiver[tile]) return (simCost[tile] + cover) * 0.55;
  return 0.25;
}

function boatCanTake(men, shore, cover, gate) {
  const pace = Math.max(fightPace, 0.05);
  const kill = Math.max(0.02, men * 0.075 * pace);
  const loss = (shore * 0.09 + cover * 0.01) * pace;
  return men - (shore / kill) * loss > gate;
}

function disembark(boat, tile) {
  const atk = boat.soldiers;
  if (atk < 0.2) return "landed";
  const occ = owner[tile];
  const home = realms[boat.realmId - 1];
  if (occ && occ !== boat.realmId && (!home || !atWar(home, realms[occ - 1]))) return "skip";
  if (!occ || occ === boat.realmId) {
    if (!occ) owner[tile] = boat.realmId;
    soldiers[tile] += atk;
    realmDirty = true;
    return "landed";
  }
  const hit = attackResist(-1, tile, true);
  const milTo = militiaOn(tile);
  const defSoldiers = soldiers[tile];
  const def = defSoldiers + milTo * 0.5;
  let clash = 0;
  if (def > 0.2) {
    const atkLoss = Math.min(atk, (def * 0.09 + hit.cover * 0.01) * fightPace);
    const defLoss = Math.min(def, atk * 0.075 * fightPace);
    clash = atkLoss + defLoss;
    const soldierDefLoss = defLoss * (defSoldiers / def);
    if (boat.realmId === 1) playerDeaths += atkLoss;
    if (occ === 1) playerDeaths += soldierDefLoss;
    noteTroopLoss(boat.realmId, occ, atkLoss);
    noteTroopLoss(occ, boat.realmId, soldierDefLoss);
    boat.soldiers = Math.max(0, atk - atkLoss);
    soldiers[tile] = Math.max(0, defSoldiers - soldierDefLoss);
    if (milTo > 0) woundMilitia(tile, defLoss * milTo / def);
  }
  aggro[tile] += 3.4;
  markBattle(tile, clash);
  if (fights.length < 16) {
    const [wx, wy] = cellWorld(tile % SW, (tile / SW) | 0);
    const blue = boat.realmId === 1 ? boat.soldiers : def;
    const red = boat.realmId === 1 ? def : boat.soldiers;
    fights.push({
      x: wx, y: wy,
      blue: Math.max(1, Math.round(blue * 10) / 10),
      red: Math.max(1, Math.round(Math.max(red, 0.5) * 10) / 10),
      life: 1.6,
      player: boat.realmId === 1 || occ === 1,
    });
  }
  const shore = soldiers[tile] + militiaOn(tile) * 0.5;
  const broken = shore <= 0.3;
  const gate = shoreGate(tile, hit.cover);
  if (broken && boat.soldiers > gate) {
    soldiers[tile] = boat.soldiers * 0.75 + 0.2;
    owner[tile] = boat.realmId;
    captureCity(tile, boat.realmId);
    realmDirty = true;
    return "landed";
  }
  if (boat.soldiers < 0.25) return "landed";
  if (shore > 0.2 && boatCanTake(boat.soldiers, shore, hit.cover, gate)) return "fight";
  return "skip";
}

function mergeWaitingBoats() {
  for (let i = 0; i < boats.length; i++) {
    const a = boats[i];
    if (!a.landing) continue;
    for (let j = boats.length - 1; j > i; j--) {
      const b = boats[j];
      if (!b.landing || b.realmId !== a.realmId) continue;
      if (dist2Sim(a.x, a.y, b.x, b.y) > 16) continue;
      if (b.soldiers > a.soldiers) {
        b.soldiers += a.soldiers;
        boats.splice(i, 1);
        i--;
        break;
      }
      a.soldiers += b.soldiers;
      boats.splice(j, 1);
    }
  }
}

function seaCloseness(x, y, tx, ty) {
  const dx = wrapDxSim(x, tx);
  const dy = ty - y;
  const dist = Math.hypot(dx, dy);
  if (dist < 0.001) return 0;
  const steps = Math.max(1, Math.ceil(dist));
  const slice = dist / steps;
  let time = 0;
  for (let s = 1; s <= steps; s++) {
    const t = s / steps;
    let xx = Math.round(x + dx * t);
    let yy = Math.round(y + dy * t);
    xx = ((xx % SW) + SW) % SW;
    if (yy < 0 || yy >= SH) { time += slice; continue; }
    const i = yy * SW + xx;
    time += slice * (simLand[i] ? 1 : shipSeaTime(i));
  }
  return time;
}

let seaG = null;
let seaF = null;
let seaPrev = null;
let seaSeen = null;
let seaPop = null;
let seaStamp = 1;

function ensureSeaArrays() {
  const n = SW * SH;
  if (seaG && seaG.length === n) return;
  seaG = new Float64Array(n);
  seaF = new Float64Array(n);
  seaPrev = new Int32Array(n);
  seaSeen = new Uint32Array(n);
  seaPop = new Uint32Array(n);
  seaStamp = 1;
}

function seaReaches(i, goal) {
  if (i === goal) return true;
  const x = i % SW;
  const y = (i / SW) | 0;
  const nbs = neighborsOf(x, y);
  for (let n = 0; n < nbs.length; n++) if (nbs[n][2] === goal) return true;
  return false;
}

function seaFirstStep(start, found) {
  if (found < 0 || found === start) return -1;
  let c = found;
  let guard = 0;
  while (seaPrev[c] !== start && seaPrev[c] >= 0 && guard++ < SW * SH) c = seaPrev[c];
  if (seaPrev[c] !== start) return -1;
  return c;
}

function searchSeaStep(sx, sy, gx, gy) {
  const start = sy * SW + sx;
  const goal = gy * SW + gx;
  if (simLand[start] || start === goal || seaReaches(start, goal)) return -1;
  ensureSeaArrays();
  seaStamp++;
  if (seaStamp >= 0xfffffffe) {
    seaSeen.fill(0);
    seaPop.fill(0);
    seaStamp = 1;
  }
  const stamp = seaStamp;
  const timeUnit = 1 / SEA_LANE_SPEED;
  seaSeen[start] = stamp;
  seaG[start] = 0;
  seaPrev[start] = -1;
  seaF[start] = Math.hypot(wrapDxSim(sx, gx), gy - sy) * timeUnit;
  const heap = [start];
  let found = -1;
  let steps = 0;
  while (heap.length && steps < 4000) {
    const i = heapPop(heap, seaF);
    if (seaPop[i] === stamp) continue;
    seaPop[i] = stamp;
    steps++;
    if (seaReaches(i, goal)) { found = i; break; }
    const x = i % SW;
    const y = (i / SW) | 0;
    for (let dy = -1; dy <= 1; dy++) {
      const yy = y + dy;
      if (yy < 0 || yy >= SH) continue;
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        let xx = x + dx;
        if (xx < 0) xx += SW;
        else if (xx >= SW) xx -= SW;
        const j = yy * SW + xx;
        if (simLand[j] || seaPop[j] === stamp) continue;
        const step = Math.hypot(dx, dy) * shipSeaTime(j);
        const ng = seaG[i] + step;
        if (seaSeen[j] === stamp && ng >= seaG[j]) continue;
        seaSeen[j] = stamp;
        seaG[j] = ng;
        seaPrev[j] = i;
        seaF[j] = ng + Math.hypot(wrapDxSim(xx, gx), yy - gy) * timeUnit;
        heapPush(heap, seaF, j);
      }
    }
  }
  if (found >= 0) return seaFirstStep(start, found);
  return -1;
}

function moveBoats() {
  mergeWaitingBoats();
  for (let i = boats.length - 1; i >= 0; i--) {
    const b = boats[i];
    if (!realms[b.realmId - 1] || b.soldiers < 0.2) { boats.splice(i, 1); continue; }
    if (!refreshBoatGoal(b)) {
      const hx = (Math.round(b.x) % SW + SW) % SW;
      const hy = Math.max(0, Math.min(SH - 1, Math.round(b.y)));
      const home = nearestOwn(b.realmId, hx, hy);
      if (!home) { boats.splice(i, 1); continue; }
      b.tx = home[0];
      b.ty = home[1];
    }
    const x = (Math.round(b.x) % SW + SW) % SW;
    const y = Math.max(0, Math.min(SH - 1, Math.round(b.y)));
    const key = y * SW + x;
    if (b.cell === key) b.wait = (b.wait || 0) + 1;
    else { b.cell = key; b.wait = 0; }
    const hereD = dist2Sim(x, y, b.tx, b.ty);
    const goal = Math.max(0, Math.min(SH - 1, b.ty | 0)) * SW + ((Math.round(b.tx) % SW) + SW) % SW;
    const goalX = goal % SW;
    const goalY = (goal / SW) | 0;
    const targetLand = simLand[goal];
    let aim = -1;
    if (!simLand[key]) {
      if (!(b.seaFrom === key && b.seaTx === goalX && b.seaTy === goalY && b.seaAt != null && simTime - b.seaAt < 0.56)) {
        b.seaNext = searchSeaStep(x, y, goalX, goalY);
        b.seaFrom = key;
        b.seaTx = goalX;
        b.seaTy = goalY;
        b.seaAt = simTime;
      }
      aim = b.seaNext == null ? -1 : b.seaNext;
    }
    let step = null;
    let stepD = hereD;
    let land = null;
    let landD = Infinity;
    let landHold = Infinity;
    let touch = null;
    let touchD = Infinity;
    let touchHold = Infinity;
    let slide = null;
    let slideD = Infinity;
    const home = realms[b.realmId - 1];
    for (const nb of neighborsOf(x, y)) {
      const d = dist2Sim(nb[0], nb[1], b.tx, b.ty);
      if (simLand[nb[2]]) {
        const shore = owner[nb[2]];
        if (shore && home && home.ai && isAlly(home, shore)) continue;
        if (nb[2] === b.avoid && b.avoidUntil > simTime) continue;
        const hold = !shore || shore === b.realmId ? 0 : (soldiers[nb[2]] + militiaOn(nb[2]) * 0.5);
        if (!touch || hold < touchHold - 0.05 || (hold <= touchHold + 0.05 && d < touchD)) {
          touch = nb;
          touchD = d;
          touchHold = hold;
        }
        if (nb[2] === goal || d + 0.15 < hereD) {
          if (!land || hold < landHold - 0.05 || (hold <= landHold + 0.05 && d < landD)) {
            land = nb;
            landD = d;
            landHold = hold;
          }
        }
      } else {
        if (aim >= 0) {
          if (nb[2] === aim) { step = nb; stepD = d; }
        } else if (d < stepD) { stepD = d; step = nb; }
        if (nb[2] !== b.prev && d < slideD) { slideD = d; slide = nb; }
      }
    }
    const arrived = !targetLand && hereD < 2 && touch;
    const blocked = touch && !step;
    const restless = touch && b.wait >= 24;
    const followSea = aim >= 0 && step;
    const beach = followSea ? null : (land || ((arrived || blocked || restless) ? touch : null));
    let shove = false;
    if (beach) {
      const result = disembark(b, beach[2]);
      if (result === "landed") { boats.splice(i, 1); continue; }
      if (result === "fight") {
        const shoreNow = soldiers[beach[2]] + militiaOn(beach[2]) * 0.5;
        if (b.duel !== beach[2]) {
          b.duel = beach[2];
          b.duelAt = simTime;
          b.duelShore = shoreNow;
          b.landing = true;
          continue;
        }
        if (shoreNow < b.duelShore - 0.2) {
          b.duelAt = simTime;
          b.duelShore = shoreNow;
          b.landing = true;
          continue;
        }
        if (simTime - b.duelAt < 3.5) { b.landing = true; continue; }
        shove = true;
      }
      b.avoid = beach[2];
      b.avoidUntil = simTime + 8;
      b.duel = 0;
    }
    let moveTo = step || ((blocked || restless || shove) ? slide : null);
    if (!moveTo && (blocked || restless || shove)) {
      for (const nb of neighborsOf(x, y)) {
        if (!simLand[nb[2]]) { moveTo = nb; break; }
      }
    }
    if (!moveTo) { b.landing = true; continue; }
    b.landing = false;
    b.prev = key;
    const boost = (seaLane && (seaLane[key] || seaLane[moveTo[2]])) ? SEA_LANE_SPEED : 1;
    const raw = 0.31 * movePace * boost;
    const hop = raw > 1 ? 1 : raw;
    b.x += wrapDxSim(b.x, moveTo[0]) * hop;
    b.y += (moveTo[1] - b.y) * hop;
    if (b.x < 0) b.x += SW;
    if (b.x >= SW) b.x -= SW;
  }
}

let foundCool = 0;

function driftToCities() {
  const next = new Float32Array(civilians);
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const i = y * SW + x;
      const id = owner[i];
      const spare = civilians[i] - TILE_CIVIL_MIN;
      if (!id || spare < 0.05) continue;
      const realm = realms[id - 1];
      if (!realm || (realm.civilOrders && realm.civilOrders.length)) continue;
      let best = null;
      let bestD = Infinity;
      for (const city of realm.cities) {
        const d = dist2Sim(x, y, city.sx, city.sy);
        if (d < bestD) { bestD = d; best = city; }
      }
      if (!best || bestD < 1.5) continue;
      let step = -1;
      let stepP = 0;
      for (const nb of neighborsOf(x, y)) {
        if (owner[nb[2]] !== id) continue;
        const progress = bestD - dist2Sim(nb[0], nb[1], best.sx, best.sy);
        if (progress > stepP) { stepP = progress; step = nb[2]; }
      }
      if (step < 0) continue;
      const move = Math.min(spare, 0.03 * movePace * stepRate(i, step));
      next[i] -= move;
      next[step] += move;
    }
  }
  civilians.set(next);
  for (const realm of realms) {
    if (realm.civilOrders && realm.civilOrders.length) continue;
    for (const city of realm.cities) {
      const i = city.sy * SW + ((city.sx % SW) + SW) % SW;
      const spare = civilians[i] - TILE_CIVIL_MIN;
      if (owner[i] !== realm.id || spare < 0.05) continue;
      const give = Math.min(spare, 0.28);
      civilians[i] -= give;
      city.pop += give;
    }
  }
}

function cityRadius(pop) {
  return CITY_BASE_RAD * Math.sqrt(Math.max(pop, 1) / CITY_BASE_POP);
}

function pullFood() {
  for (let i = 0; i < SW * SH; i++) {
    if (!simLand[i]) continue;
    food[i] = Math.min(fertility[i] * 6, food[i] + fertility[i] * 0.055);
  }
  const next = new Float32Array(food);
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const i = y * SW + x;
      const id = owner[i];
      if (!id || food[i] < 0.002) continue;
      const realm = realms[id - 1];
      if (!realm || !realm.cities.length) continue;
      let best = null;
      let bestS = 0;
      for (const city of realm.cities) {
        const s = cityHeads(city) / (dist2Sim(x, y, city.sx, city.sy) + 8);
        if (s > bestS) { bestS = s; best = city; }
      }
      if (!best) continue;
      let sitting = null;
      for (const city of realm.cities) {
        const home = city.sy * SW + ((city.sx % SW) + SW) % SW;
        if (home === i) sitting = city;
      }
      if (sitting) {
        sitting.food = (sitting.food || 0) + food[i];
        next[i] -= food[i];
        continue;
      }
      const here = dist2Sim(x, y, best.sx, best.sy);
      let step = -1;
      let stepP = 0;
      for (const nb of neighborsOf(x, y)) {
        if (owner[nb[2]] !== id) continue;
        const progress = here - dist2Sim(nb[0], nb[1], best.sx, best.sy);
        if (progress > stepP) { stepP = progress; step = nb[2]; }
      }
      if (step < 0) continue;
      const heads = cityHeads(best);
      const pull = heads / (heads + CITY_BASE_POP);
      const move = food[i] * 0.2 * pull * stepRate(i, step);
      next[i] -= move;
      next[step] += move;
    }
  }
  food.set(next);
}

const MILITIA_NEAR = 25;

function enemyNearCity(realm, city) {
  const x = city.sx | 0;
  const y = city.sy | 0;
  for (let dy = -5; dy <= 5; dy++) {
    const yy = y + dy;
    if (yy < 0 || yy >= SH) continue;
    for (let dx = -5; dx <= 5; dx++) {
      if (dx * dx + dy * dy > MILITIA_NEAR) continue;
      let xx = x + dx;
      if (xx < 0) xx += SW;
      else if (xx >= SW) xx -= SW;
      const i = yy * SW + xx;
      if (!simLand[i]) continue;
      const occ = owner[i];
      if (occ && occ !== realm.id && !isAlly(realm, occ)) return true;
    }
  }
  if (boats) {
    for (let b = 0; b < boats.length; b++) {
      const boat = boats[b];
      if (boat.realmId === realm.id || isAlly(realm, boat.realmId)) continue;
      if (dist2Sim(boat.x, boat.y, city.sx, city.sy) <= MILITIA_NEAR) return true;
    }
  }
  return false;
}

function musterMilitia(realm, city) {
  const mil = city.militia || 0;
  const total = city.pop + mil;
  if (total < 0.4) {
    city.pop += mil;
    city.militia = 0;
    return;
  }
  const cap = total * 0.1;
  const near = enemyNearCity(realm, city);
  const step = Math.max(0.02, cap) * (SIM_DT / 40) * militiaPace;
  if (near && mil < cap && city.pop > 0.3) {
    const move = Math.min(step, cap - mil, city.pop - 0.15);
    if (move > 0) {
      city.pop -= move;
      city.militia = mil + move;
    }
  } else if (mil > (near ? cap : 0)) {
    const move = Math.min(mil - (near ? cap : 0), step);
    city.militia = mil - move;
    city.pop += move;
  }
}

function growRealms() {
  pullFood();
  for (const realm of realms) {
    for (const city of realm.cities) {
      const heads = cityHeads(city);
      const need = Math.max(0.04, heads * 0.018);
      const supply = Math.min(1, (city.food || 0) / need);
      city.supply = supply;
      const cell = cityCell(city);
      if (cell >= 0 && (battle[cell] || 0) < 0.3 && (city.destruction || 0) > 0.001 && city.pop > 1) {
        const before = city.destruction;
        const mend = Math.min(before, 0.0017 * Math.min(1.6, city.pop / CITY_BASE_POP));
        city.destruction = before - mend;
        city.pop *= 1 - 0.2 * mend;
      }
      const intact = 1 - Math.min(1, city.destruction || 0);
      city.pop += (0.05 + city.pop * 0.001) * supply * intact;
      city.food = Math.max(0, Math.min(need * 4, (city.food || 0) - need * supply));
      musterMilitia(realm, city);
    }
  }
  for (let i = 0; i < SW * SH; i++) {
    if (!owner[i] || civilians[i] <= 0) continue;
    const need = Math.max(0.02, civilians[i] * 0.02);
    const supply = Math.min(1, food[i] / need);
    civilians[i] += 0.01 * supply;
    food[i] = Math.max(0, food[i] - Math.min(food[i], need * supply));
  }
  for (const realm of realms) {
    let people = 0;
    let army = 0;
    let tiles = 0;
    let taxed = 0;
    for (const city of realm.cities) {
      const heads = cityHeads(city);
      people += heads;
      taxed += heads * (1 - Math.min(1, city.destruction || 0));
    }
    for (let i = 0; i < SW * SH; i++) {
      if (owner[i] !== realm.id) continue;
      tiles++;
      people += civilians[i];
      taxed += civilians[i];
      army += Math.max(0, soldiers[i] - TILE_SOLDIER_MIN);
    }
    if (boats) {
      for (let b = 0; b < boats.length; b++) if (boats[b].realmId === realm.id) army += boats[b].soldiers;
    }
    realm.tiles = tiles;
    realm.army = army;
    realm.people = people;
    const cap = 0.1 * (people + army);
    if (army < cap) {
      const lead = realm.soldierOrders[0];
      const spot = lead && lead.ox != null
        ? nearestOwn(realm.id, lead.ox, lead.oy)
        : (realm.capital ? [realm.capital.sx, realm.capital.sy] : null);
      if (spot) soldiers[spot[1] * SW + spot[0]] += Math.min(realm.ai ? 0.85 : 0.55, cap - army);
    }
    realm.gold += taxed * 0.012;
  }
  foundCool -= 1;
  if (foundCool > 0) return;
  foundCool = 18;
  for (const realm of realms) tryFoundCity(realm);
}

function tryFoundCity(realm) {
  let bestI = -1;
  let bestSum = 0;
  let bestX = 0;
  let bestY = 0;
  for (let y = 1; y < SH - 1; y += 2) {
    for (let x = 0; x < SW; x += 2) {
      const i = y * SW + x;
      if (owner[i] !== realm.id) continue;
      if (nearestAnyCity(x, y, CITY_GAP)) continue;
      let sum = 0;
      for (let dy = -2; dy <= 2; dy++) {
        const yy = y + dy;
        if (yy < 0 || yy >= SH) continue;
        for (let dx = -2; dx <= 2; dx++) {
          if (dx * dx + dy * dy > 6) continue;
          const xx = (x + dx + SW) % SW;
          const k = yy * SW + xx;
          if (owner[k] === realm.id) sum += civilians[k];
        }
      }
      if (sum > bestSum) { bestSum = sum; bestI = i; bestX = x; bestY = y; }
    }
  }
  if (bestI < 0 || bestSum < 18) return;
  let gathered = 0;
  for (let dy = -2; dy <= 2; dy++) {
    const yy = bestY + dy;
    if (yy < 0 || yy >= SH) continue;
    for (let dx = -2; dx <= 2; dx++) {
      if (dx * dx + dy * dy > 6) continue;
      const xx = (bestX + dx + SW) % SW;
      const k = yy * SW + xx;
      if (owner[k] !== realm.id) continue;
      const spare = civilians[k] - TILE_CIVIL_MIN;
      if (spare <= 0) continue;
      const take = spare * 0.45;
      civilians[k] -= take;
      gathered += take;
    }
  }
  realm.cities.push({ sx: bestX, sy: bestY, pop: Math.max(16, gathered), capital: false, gold: 0, food: 0.3, destruction: 0 });
}

function flowCivilians() {
  const next = new Float32Array(civilians);
  for (const realm of realms) {
    if (!realm.civilOrders.length) continue;
    for (let y = 0; y < SH; y++) {
      for (let x = 0; x < SW; x++) {
        const i = y * SW + x;
        const spare = civilians[i] - TILE_CIVIL_MIN;
        if (owner[i] !== realm.id || spare < 0.04) continue;
        let bestO = null;
        let bestS = 0;
        for (const order of realm.civilOrders) {
          const d2 = dist2Sim(x, y, order.sx, order.sy);
          const reach = pullReach(order.strength);
          if (d2 > reach * reach) continue;
          const s = order.strength / (d2 + 5);
          if (s > bestS) { bestS = s; bestO = order; }
        }
        if (!bestO) continue;
        if (Math.round(x) === bestO.sx && Math.round(y) === bestO.sy) continue;
        const here = dist2Sim(x, y, bestO.sx, bestO.sy);
        let best = -1;
        let bestP = 0;
        for (const nb of neighborsOf(x, y)) {
          if (owner[nb[2]] !== realm.id) continue;
          const progress = here - dist2Sim(nb[0], nb[1], bestO.sx, bestO.sy);
          if (progress > bestP) { bestP = progress; best = nb[2]; }
        }
        if (best < 0) continue;
        const move = Math.min(spare, 0.035 * movePace * bestO.strength * stepRate(i, best));
        next[i] -= move;
        next[best] += move;
      }
    }
  }
  civilians.set(next);
  for (const realm of realms) {
    for (const order of realm.civilOrders) {
      const dest = order.sy * SW + ((order.sx % SW) + SW) % SW;
      if (owner[dest] !== realm.id) continue;
      let city = nearestCity(realm.id, order.sx, order.sy, CITY_GAP);
      const spare = civilians[dest] - TILE_CIVIL_MIN;
      if (city) {
        const give = Math.min(Math.max(0, spare), 0.12 * order.strength);
        if (give > 0.02) {
          civilians[dest] -= give;
          city.pop += give;
        }
      } else if (spare >= 22 && !nearestAnyCity(order.sx, order.sy, CITY_GAP)) {
        realm.cities.push({
          sx: order.sx, sy: order.sy, pop: spare, capital: false, gold: 0, food: 0.4, destruction: 0,
        });
        civilians[dest] = TILE_CIVIL_MIN;
      }
    }
  }
}

function closestCity(realm, sx, sy) {
  let best = realm.capital;
  let bestD = Infinity;
  for (const city of realm.cities) {
    const d = dist2Sim(sx, sy, city.sx, city.sy);
    if (d < bestD) { bestD = d; best = city; }
  }
  return best;
}

function payForPull(realm, sx, sy, points) {
  const cost = 28 * points;
  if (realm.gold < cost) {
    note.textContent = "Not enough gold for that pull.";
    return false;
  }
  realm.gold -= cost;
  const city = closestCity(realm, sx, sy);
  if (city) {
    shipments.push({
      x: sx, y: sy, tx: city.sx, ty: city.sy,
      gold: cost, city, capital: !!city.capital, realmId: realm.id,
    });
  }
  return true;
}

function moveGold() {
  for (let i = shipments.length - 1; i >= 0; i--) {
    const s = shipments[i];
    if (dist2Sim(s.x, s.y, s.tx, s.ty) < 1.1) {
      s.city.gold = (s.city.gold || 0) + s.gold;
      if (s.capital) {
        const realm = realms[s.realmId - 1];
        if (realm) realm.gold += s.gold;
      }
      shipments.splice(i, 1);
      continue;
    }
    const x = Math.max(0, Math.min(SW - 1, Math.round(s.x)));
    const y = Math.max(0, Math.min(SH - 1, Math.round(s.y)));
    let best = null;
    let bestD = dist2Sim(s.x, s.y, s.tx, s.ty);
    for (const nb of neighborsOf(x, y)) {
      if (!simLand[nb[2]]) continue;
      const d = dist2Sim(nb[0], nb[1], s.tx, s.ty);
      if (d < bestD) { bestD = d; best = nb; }
    }
    if (!best) { shipments.splice(i, 1); continue; }
    const rate = Math.max(0.2, stepRate(y * SW + x, best[2]));
    s.x += (best[0] - s.x) * Math.min(1, 0.55 * rate);
    s.y += (best[1] - s.y) * Math.min(1, 0.55 * rate);
    if (s.x < 0) s.x += SW;
    if (s.x >= SW) s.x -= SW;
  }
}

function roadId(a, b) {
  const ka = a.sy * SW + ((a.sx % SW) + SW) % SW;
  const kb = b.sy * SW + ((b.sx % SW) + SW) % SW;
  return ka < kb ? ka + ":" + kb : kb + ":" + ka;
}

function roadWander(x, y) {
  return vnoise(x * 0.23 + 1.7, y * 0.19, 4.2) * 2 - 1;
}

function traceRoad(x0, y0, x1, y1, realmId) {
  const cells = [];
  const seen = new Uint8Array(SW * SH);
  let x = x0;
  let y = y0;
  for (let s = 0; s < 140; s++) {
    const i = y * SW + x;
    cells.push(i);
    seen[i] = 1;
    if (dist2Sim(x, y, x1, y1) < 2) return cells;
    const gdx = wrapDxSim(x, x1);
    const gdy = y1 - y;
    const glen = Math.hypot(gdx, gdy) || 1;
    let best = null;
    let bestS = Infinity;
    for (const nb of neighborsOf(x, y)) {
      if (seen[nb[2]] || !simLand[nb[2]]) continue;
      const who = owner[nb[2]];
      if (who && who !== realmId) continue;
      const sx = wrapDxSim(x, nb[0]);
      const sy = nb[1] - y;
      const cross = (-gdy * sx + gdx * sy) / glen;
      const remain = Math.sqrt(dist2Sim(nb[0], nb[1], x1, y1));
      const ease = moveBase[nb[2]];
      const bend = Math.abs(cross - roadWander(nb[0], nb[1]) * 1.35);
      const score = remain * (1.35 - ease * 0.7) + bend * 5.5 + (aggro[nb[2]] > 0.35 ? 500 : 0);
      if (score < bestS) { bestS = score; best = nb; }
    }
    if (!best) return cells.length > 4 ? cells : null;
    x = best[0];
    y = best[1];
  }
  return cells.length > 4 ? cells : null;
}

function cityTouchesRoad(city) {
  const i = city.sy * SW + ((city.sx % SW) + SW) % SW;
  if (roadLevel[i] > 0.04) return true;
  for (const nb of neighborsOf(city.sx, city.sy)) {
    if (roadLevel[nb[2]] > 0.04) return true;
  }
  return false;
}

function pathPeaceful(cells) {
  for (const i of cells) if (aggro[i] > 0.35) return false;
  return true;
}

let roadCool = 0;
function maintainRoadsOld() {
  roadCool -= 1;
  if (roadCool <= 0) {
    roadCool = 10;
    for (const realm of realms) linkCities(realm);
  }
  for (const road of roads) {
    if (!pathPeaceful(road.cells)) continue;
    const realm = realms[road.realmId - 1];
    if (!realm) continue;
    const cost = 0.07 * (1 + road.level * 4);
    if (realm.gold < cost) continue;
    realm.gold -= cost;
    road.level = Math.min(1, road.level + 0.005 / (1 + road.level * 5));
    for (const i of road.cells) writeRoadLevel(i, road.level);
  }
  refreshRoadTiles();
}

function linkCities(realm) {
  const cities = realm.cities;
  if (cities.length < 2) return;
  let isolated = null;
  for (const city of cities) {
    if (!cityTouchesRoad(city)) { isolated = city; break; }
  }
  if (!isolated) return;
  let nearest = null;
  let bestD = Infinity;
  for (const city of cities) {
    if (city === isolated) continue;
    const d = dist2Sim(isolated.sx, isolated.sy, city.sx, city.sy);
    if (d < bestD) { bestD = d; nearest = city; }
  }
  if (!nearest || bestD > 1400) return;
  const key = roadId(isolated, nearest);
  if (roadKeys.has(key)) return;
  const cells = traceRoad(isolated.sx, isolated.sy, nearest.sx, nearest.sy, realm.id);
  if (!cells || cells.length < 2) return;
  roadKeys.add(key);
  roads.push({ cells, level: 0.04, realmId: realm.id });
}

const ROAD_LINKS = 5;
const ROAD_CLOSE2 = 40 * 40;
const ROAD_WATER_SPEED = 0.04;
const ROAD_BLOCK_DEG = 60;
const SEA_LANE_SPAN = 4;
const SEA_LANE_SPEED = 5;
const ROAD_CURVE_AMP = 1.8;
const ROAD_CURVE = 1.7;
const ROAD_REUSE = 7;

function shipSeaTime(i) {
  return (seaLane && seaLane[i]) ? 1 / SEA_LANE_SPEED : 1;
}

function roadTileSpeed(i) {
  if (!simLand[i]) {
    if (seaLane && seaLane[i]) return ROAD_WATER_SPEED * SEA_LANE_SPEED;
    if (simRiver[i]) return ROAD_WATER_SPEED;
    return ROAD_WATER_SPEED * (1 + (roadLevel[i] || 0) * ROAD_MOVE_BONUS);
  }
  let base;
  if (simRiver[i]) base = ROAD_WATER_SPEED;
  else if (simCost[i] <= 1.2) base = 1;
  else if (simCost[i] <= 2.5) base = 0.58;
  else base = 0.32;
  return base * (1 + (roadLevel[i] || 0) * ROAD_MOVE_BONUS);
}

function refreshRoadTiles() {
  const n = SW * SH;
  if (!roadTile || roadTile.length !== n) {
    roadTile = new Uint8Array(n);
    seaLane = new Uint8Array(n);
  } else {
    roadTile.fill(0);
    seaLane.fill(0);
  }
  for (let r = 0; r < roads.length; r++) {
    const road = roads[r];
    const built = road.cells;
    if (built) {
      for (let k = 0; k < built.length; k++) roadTile[built[k]] = 1;
      let k = 0;
      while (k < built.length) {
        if (simLand[built[k]]) { k++; continue; }
        let j = k;
        while (j < built.length && !simLand[built[j]]) j++;
        if (j - k >= SEA_LANE_SPAN) {
          for (let t = k; t < j; t++) seaLane[built[t]] = 1;
        }
        k = j;
      }
    }
    const planned = road.planned;
    if (planned) {
      for (let k = 0; k < planned.length; k++) roadTile[planned[k]] = 1;
    }
  }
}

function cityCell(city) {
  const x = ((Math.round(city.sx) % SW) + SW) % SW;
  const y = Math.max(0, Math.min(SH - 1, Math.round(city.sy)));
  return y * SW + x;
}

function linkedCities(city) {
  const out = [];
  const add = (other) => {
    if (!other || other === city || out.indexOf(other) >= 0) return;
    out.push(other);
  };
  if (roadSearch) {
    if (roadSearch.cityA === city) add(roadSearch.cityB);
    else if (roadSearch.cityB === city) add(roadSearch.cityA);
  }
  for (let i = 0; i < roads.length; i++) {
    const road = roads[i];
    if (road.cityA === city) add(road.cityB);
    else if (road.cityB === city) add(road.cityA);
  }
  return out;
}

function pairBlocked(a, b) {
  const until = roadBlock.get(roadId(a, b));
  return until != null && until > roadTick;
}

function roadTargetScore(city, other, linked) {
  let damp = 1;
  for (let k = 0; k < linked.length; k++) {
    const known = linked[k];
    const near = Math.max(1, dist2Sim(known.sx, known.sy, other.sx, other.sy));
    damp += (known.pop * known.pop) / near;
  }
  const d2 = Math.max(1, dist2Sim(city.sx, city.sy, other.sx, other.sy));
  return (other.pop * other.pop) / d2 / damp;
}

function bestRoadScore(city, pool, linked) {
  let best = null;
  let bestW = -1;
  for (let i = 0; i < pool.length; i++) {
    const w = roadTargetScore(city, pool[i], linked);
    if (w > bestW) { bestW = w; best = pool[i]; }
  }
  return best;
}

function angleBlocked(city, other, linked) {
  if (!linked.length) return false;
  const limit = ROAD_BLOCK_DEG * Math.PI / 180;
  const angT = Math.atan2(other.sy - city.sy, wrapDxSim(city.sx, other.sx));
  const d2T = dist2Sim(city.sx, city.sy, other.sx, other.sy);
  for (let k = 0; k < linked.length; k++) {
    const known = linked[k];
    if (d2T < dist2Sim(city.sx, city.sy, known.sx, known.sy)) continue;
    const angL = Math.atan2(known.sy - city.sy, wrapDxSim(city.sx, known.sx));
    let diff = Math.abs(angT - angL);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;
    if (diff <= limit) return true;
  }
  return false;
}

function chooseRoadTarget(city, realm) {
  const linked = linkedCities(city);
  if (linked.length >= ROAD_LINKS) return null;
  const origin = cityCell(city);
  const pool = [];
  const closePool = [];
  for (let i = 0; i < realm.cities.length; i++) {
    const other = realm.cities[i];
    if (other === city || cityCell(other) === origin) continue;
    if (pairBlocked(city, other) || roadKeys.has(roadId(city, other))) continue;
    let direct = false;
    for (let k = 0; k < linked.length; k++) {
      if (linked[k] === other) { direct = true; break; }
    }
    if (direct) continue;
    if (angleBlocked(city, other, linked)) continue;
    pool.push(other);
    if (dist2Sim(city.sx, city.sy, other.sx, other.sy) <= ROAD_CLOSE2) closePool.push(other);
  }
  if (!pool.length) return null;
  if (linked.length === 0 && closePool.length) return bestRoadScore(city, closePool, linked);
  if (!city.capital && realm.capital && pool.indexOf(realm.capital) >= 0) return realm.capital;
  return bestRoadScore(city, pool, linked);
}

function cityBuilding(city) {
  if (roadSearch && roadSearch.cityA === city) return true;
  for (let i = 0; i < roads.length; i++) {
    const road = roads[i];
    if (road.cityA === city && road.planned && road.built < road.planned.length) return true;
  }
  return false;
}

function nextRoadJob() {
  const list = [];
  for (let r = 0; r < realms.length; r++) {
    const realm = realms[r];
    for (let c = 0; c < realm.cities.length; c++) list.push({ realm, city: realm.cities[c] });
  }
  if (!list.length) return null;
  for (let n = 0; n < list.length; n++) {
    const item = list[(roadTurn + n) % list.length];
    if (cityBuilding(item.city)) continue;
    if (linkedCities(item.city).length >= ROAD_LINKS) continue;
    const target = chooseRoadTarget(item.city, item.realm);
    if (!target) continue;
    roadTurn = (roadTurn + n + 1) % list.length;
    return { realm: item.realm, city: item.city, target };
  }
  return null;
}

function heapPush(heap, fscore, i) {
  heap.push(i);
  let k = heap.length - 1;
  while (k > 0) {
    const p = (k - 1) >> 1;
    if (fscore[heap[p]] <= fscore[heap[k]]) break;
    const tmp = heap[p];
    heap[p] = heap[k];
    heap[k] = tmp;
    k = p;
  }
}

function heapPop(heap, fscore) {
  const top = heap[0];
  const last = heap.pop();
  if (!heap.length) return top;
  heap[0] = last;
  let k = 0;
  for (;;) {
    const l = k * 2 + 1;
    const r = l + 1;
    let s = k;
    if (l < heap.length && fscore[heap[l]] < fscore[heap[s]]) s = l;
    if (r < heap.length && fscore[heap[r]] < fscore[heap[s]]) s = r;
    if (s === k) break;
    const tmp = heap[s];
    heap[s] = heap[k];
    heap[k] = tmp;
    k = s;
  }
  return top;
}

function beginRoadSearch(realm, city, target) {
  const start = cityCell(city);
  const goal = cityCell(target);
  const n = SW * SH;
  const g = new Float64Array(n);
  const fscore = new Float64Array(n);
  const prev = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    g[i] = Infinity;
    fscore[i] = Infinity;
    prev[i] = -1;
  }
  const gx = goal % SW;
  const gy = (goal / SW) | 0;
  const sx = start % SW;
  const sy = (start / SW) | 0;
  const abx = wrapDxSim(sx, gx);
  const aby = gy - sy;
  const ab2 = abx * abx + aby * aby || 1;
  const ablen = Math.sqrt(ab2);
  g[start] = 0;
  fscore[start] = ablen / ROAD_MAX_SPEED;
  roadSearch = {
    realmId: realm.id,
    cityA: city,
    cityB: target,
    start,
    goal,
    gx,
    gy,
    sx,
    sy,
    abx,
    aby,
    ab2,
    ablen,
    curveAmp: Math.min(ROAD_CURVE_AMP, Math.max(1, ablen * 0.11)),
    curveSide: vnoise(gx * 0.07 + 1.2, gy * 0.07, sx * 0.04 + 2.4) < 0.5 ? -1 : 1,
    g,
    fscore,
    prev,
    heap: [start],
    closed: new Uint8Array(n),
    goalCity: goal,
  };
}

function markRoadsReaching(goal, realmId) {
  const mark = new Uint8Array(SW * SH);
  if (!roadTile || !roadTile[goal]) return mark;
  const stack = [goal];
  mark[goal] = 1;
  while (stack.length) {
    const i = stack.pop();
    const x = i % SW;
    const y = (i / SW) | 0;
    for (let dy = -1; dy <= 1; dy++) {
      const yy = y + dy;
      if (yy < 0 || yy >= SH) continue;
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        let xx = x + dx;
        if (xx < 0) xx += SW;
        else if (xx >= SW) xx -= SW;
        const j = yy * SW + xx;
        if (!roadTile[j] || mark[j]) continue;
        const who = owner[j];
        if (j !== goal && who && who !== realmId) continue;
        mark[j] = 1;
        stack.push(j);
      }
    }
  }
  return mark;
}

function trimSharedRoad(cells) {
  if (!cells || cells.length < 2 || !roadTile) return cells;
  let a = 0;
  while (a < cells.length - 1 && roadTile[cells[a]] && roadTile[cells[a + 1]]) a++;
  let b = cells.length - 1;
  while (b > a && roadTile[cells[b]] && roadTile[cells[b - 1]]) b--;
  if (a === 0 && b === cells.length - 1) return cells;
  return cells.slice(a, b + 1);
}

function rememberRoadJoin(realmId, cityA, cityB) {
  const key = roadId(cityA, cityB);
  if (roadKeys.has(key)) return;
  roadKeys.add(key);
  roads.push({
    cells: [],
    level: 1,
    size: 0,
    realmId,
    cityA,
    cityB,
    joined: true,
  });
}

function roadBeside(j) {
  if (!roadTile || roadTile[j]) return false;
  const x = j % SW;
  const y = (j / SW) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    const yy = y + dy;
    if (yy < 0 || yy >= SH) continue;
    for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      let xx = x + dx;
      if (xx < 0) xx += SW;
      else if (xx >= SW) xx -= SW;
      if (roadTile[yy * SW + xx]) return true;
    }
  }
  return false;
}

function roadReuseExtra(j) {
  const s = roadSearch;
  if (!s || j === s.goal || j === s.start) return 0;
  if (roadTile && roadTile[j]) return 0;
  return roadBeside(j) ? ROAD_REUSE : 0;
}

function roadCurveExtra(xx, yy, j) {
  const s = roadSearch;
  if (j === s.goal || j === s.start) return 0;
  if (simRiver[j]) return 0;
  if ((roadLevel[j] || 0) > 0.04 || (roadTile && roadTile[j])) return 0;
  const apx = wrapDxSim(s.sx, xx);
  const apy = yy - s.sy;
  const lat = (s.abx * apy - s.aby * apx) / s.ablen;
  const t = (apx * s.abx + apy * s.aby) / s.ab2;
  const u = t < 0 ? 0 : t > 1 ? 1 : t;
  const env = Math.sin(Math.max(0, Math.min(1, u)) * Math.PI);
  const want = env * env * s.curveSide * s.curveAmp;
  let ease = 1;
  if (simLand[j]) {
    if (simCost[j] > 2.5) ease = 0.32;
    else if (simCost[j] > 1.2) ease = 0.58;
  }
  return Math.abs(lat - want) * ROAD_CURVE * ease;
}

function expandRoadSearch(budget) {
  const s = roadSearch;
  const g = s.g;
  const fscore = s.fscore;
  const prev = s.prev;
  const heap = s.heap;
  const closed = s.closed;
  s.joined = markRoadsReaching(s.goalCity, s.realmId);
  if (s.joined[s.start]) {
    s.goal = s.start;
    return "found";
  }
  let steps = 0;
  while (heap.length && steps < budget) {
    const i = heapPop(heap, fscore);
    if (closed[i]) continue;
    closed[i] = 1;
    steps++;
    if (i === s.goal || s.joined[i]) {
      s.goal = i;
      return "found";
    }
    const x = i % SW;
    const y = (i / SW) | 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const yy = y + dy;
        if (yy < 0 || yy >= SH) continue;
        let xx = x + dx;
        if (xx < 0) xx += SW;
        else if (xx >= SW) xx -= SW;
        const j = yy * SW + xx;
        if (closed[j]) continue;
        const who = owner[j];
        if (j !== s.goal && who && who !== s.realmId) continue;
        const step = Math.hypot(dx, dy);
        const ng = g[i] + step / roadTileSpeed(j) + roadCurveExtra(xx, yy, j) + roadReuseExtra(j);
        if (ng >= g[j]) continue;
        g[j] = ng;
        prev[j] = i;
        const heur = s.joined[j] ? 0 : Math.hypot(wrapDxSim(xx, s.gx), yy - s.gy) / ROAD_MAX_SPEED;
        fscore[j] = ng + heur;
        heapPush(heap, fscore, j);
      }
    }
  }
  return heap.length ? "run" : "fail";
}

function takePlannedRoad() {
  const s = roadSearch;
  const cells = [];
  const seen = new Uint8Array(SW * SH);
  let c = s.goal;
  while (c >= 0 && !seen[c]) {
    seen[c] = 1;
    cells.push(c);
    if (c === s.start) {
      cells.reverse();
      return cells;
    }
    c = s.prev[c];
  }
  return null;
}

function blockRoadPair(a, b) {
  roadBlock.set(roadId(a, b), roadTick + 200);
}

function roadSizeCap(road) {
  const a = road.cityA && road.cityA.pop > 0 ? road.cityA.pop : CITY_BASE_POP;
  const b = road.cityB && road.cityB.pop > 0 ? road.cityB.pop : CITY_BASE_POP;
  return Math.max(1, Math.min(4, Math.sqrt(a * b) / CITY_BASE_POP));
}

function stepRoadBuild(road) {
  if (!road.planned) return;
  if (road.built < road.planned.length) road.cells.push(road.planned[road.built++]);
  road.pave = Math.min(1, (road.pave || 0.5) + 0.012 / (1 + (road.pave || 0.5)));
  road.size = road.pave * roadSizeCap(road);
  road.level = road.pave;
  for (let k = 0; k < road.cells.length; k++) {
    const i = road.cells[k];
    writeRoadLevel(i, road.level);
  }
}

function maintainRoadsNew() {
  roadTick++;
  for (let i = 0; i < roads.length; i++) stepRoadBuild(roads[i]);
  refreshRoadTiles();
  if (roadSearch) {
    const state = expandRoadSearch(700);
    if (state === "run") return;
    if (state === "found") {
      const raw = takePlannedRoad();
      const planned = trimSharedRoad(raw);
      if (planned && planned.length >= 2) {
        roads.push({
          cells: [],
          planned,
          built: 0,
          pave: 0.5,
          size: 0.5,
          level: 0.5,
          realmId: roadSearch.realmId,
          cityA: roadSearch.cityA,
          cityB: roadSearch.cityB,
        });
        roadKeys.add(roadId(roadSearch.cityA, roadSearch.cityB));
      } else if (raw) rememberRoadJoin(roadSearch.realmId, roadSearch.cityA, roadSearch.cityB);
      else blockRoadPair(roadSearch.cityA, roadSearch.cityB);
    } else blockRoadPair(roadSearch.cityA, roadSearch.cityB);
    roadSearch = null;
    return;
  }
  const job = nextRoadJob();
  if (job) beginRoadSearch(job.realm, job.city, job.target);
}

function maintainRoads() {
  if (useNewRoads) maintainRoadsNew();
  else maintainRoadsOld();
}

function nearestCity(id, sx, sy, maxDist) {
  const realm = realms[id - 1];
  if (!realm) return null;
  let best = null;
  let bestD = maxDist * maxDist;
  for (const city of realm.cities) {
    const d = dist2Sim(sx, sy, city.sx, city.sy);
    if (d <= bestD) { bestD = d; best = city; }
  }
  return best;
}

function nearestAnyCity(sx, sy, maxDist) {
  const max2 = maxDist * maxDist;
  for (let r = 0; r < realms.length; r++) {
    const cities = realms[r].cities;
    for (let c = 0; c < cities.length; c++) {
      if (dist2Sim(sx, sy, cities[c].sx, cities[c].sy) <= max2) return cities[c];
    }
  }
  return null;
}

function nearestOwn(id, sx, sy) {
  const i = sy * SW + sx;
  if (i >= 0 && owner[i] === id) return [sx, sy];
  let best = null;
  let bestD = Infinity;
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const k = y * SW + x;
      if (owner[k] !== id) continue;
      const d = dist2Sim(sx, sy, x, y);
      if (d < bestD) { bestD = d; best = [x, y]; }
    }
  }
  return best;
}

function isAlly(realm, id) {
  return !!(realm && realm.allies && id && realm.allies.indexOf(id) >= 0);
}

function declaresWar(order) {
  if (!order || order.auto) return false;
  if (order.kind === "spread" || order.kind === "spread2" || order.kind === "sail") return false;
  return true;
}

function orderInside(realm, otherId) {
  if (!realm || !otherId) return false;
  const orders = realm.soldierOrders;
  for (let i = 0; i < orders.length; i++) {
    const order = orders[i];
    if (!declaresWar(order)) continue;
    const cell = orderCell(order);
    if (simLand[cell[2]] && owner[cell[2]] === otherId) return true;
  }
  return false;
}

function atWar(a, b) {
  if (!a || !b || a.id === b.id) return false;
  return orderInside(a, b.id) || orderInside(b, a.id);
}

function commonStrongerFoe(a, b) {
  if (!a || !b || a.id === b.id || atWar(a, b)) return null;
  let foe = null;
  for (let n = 0; n < realms.length; n++) {
    const other = realms[n];
    if (other.id === a.id || other.id === b.id || !(other.tiles > 0)) continue;
    if (!atWar(a, other) || !atWar(b, other)) continue;
    const army = other.army || 0;
    if (army <= (a.army || 0) || army <= (b.army || 0)) continue;
    if (!foe || army > (foe.army || 0)) foe = other;
  }
  return foe;
}

function pactBroken(a, b) {
  if ((b.tookFrom[a.id] || 0) >= 0.45 || (a.tookFrom[b.id] || 0) >= 0.45) return true;
  const bloodA = a.lostSoldiers[b.id] || 0;
  const bloodB = b.lostSoldiers[a.id] || 0;
  if (bloodA >= Math.max(4, (a.army || 1) * 0.55)) return true;
  if (bloodB >= Math.max(4, (b.army || 1) * 0.55)) return true;
  return false;
}

function refreshRelations() {
  if (!realms) return;
  for (let i = 0; i < realms.length; i++) {
    for (let j = i + 1; j < realms.length; j++) {
      if (atWar(realms[i], realms[j])) dropAlly(realms[i], realms[j].id);
    }
  }
  for (let i = 0; i < realms.length; i++) {
    for (let j = i + 1; j < realms.length; j++) {
      const a = realms[i];
      const b = realms[j];
      if (pactBroken(a, b)) continue;
      const foe = commonStrongerFoe(a, b);
      if (!foe || !allyWith(a, b)) continue;
      a.allyLock = Math.max(a.allyLock || 0, 12);
      b.allyLock = Math.max(b.allyLock || 0, 12);
      if (a.id === 1) announceAlliance(b, a, foe);
      else announceAlliance(a, b, foe);
    }
  }
}

function relationsText() {
  if (!realms || realms.length < 2) return "All realms are at peace.";
  const wars = [];
  const allies = [];
  for (let i = 0; i < realms.length; i++) {
    if (!(realms[i].tiles > 0)) continue;
    for (let j = i + 1; j < realms.length; j++) {
      if (!(realms[j].tiles > 0)) continue;
      const name = crownCalled(realms[i].id) + "–" + crownCalled(realms[j].id);
      if (atWar(realms[i], realms[j])) wars.push(name);
      else if (isAlly(realms[i], realms[j].id)) allies.push(name);
    }
  }
  if (!wars.length && !allies.length) return "All realms are at peace.";
  if (!wars.length) return "Allied: " + allies.join(", ") + ". Others at peace.";
  if (!allies.length) return "War: " + wars.join(", ") + ". Others at peace.";
  return "War: " + wars.join(", ") + ". Allied: " + allies.join(", ") + ". Others at peace.";
}

function noteTroopLoss(who, against, amount) {
  if (!who || !against || who === against || !(amount > 0)) return;
  const realm = realms[who - 1];
  if (!realm || !realm.lostSoldiers) return;
  realm.lostSoldiers[against] += amount;
}

function dropAlly(a, id) {
  if (!a || !a.allies) return;
  const at = a.allies.indexOf(id);
  if (at >= 0) a.allies.splice(at, 1);
  const b = realms[id - 1];
  if (!b || !b.allies) return;
  const bt = b.allies.indexOf(a.id);
  if (bt >= 0) b.allies.splice(bt, 1);
}

function allyWith(a, b) {
  if (!a || !b || a.id === b.id) return false;
  if (atWar(a, b)) return false;
  if (isAlly(a, b.id) && isAlly(b, a.id)) return false;
  if (a.allies.length >= 3 && !isAlly(a, b.id)) return false;
  if (b.allies.length >= 3 && !isAlly(b, a.id)) return false;
  if (!isAlly(a, b.id)) a.allies.push(b.id);
  if (!isAlly(b, a.id)) b.allies.push(a.id);
  return true;
}

function crownCalled(id) {
  return COLOR_NAME[id] || ("Crown " + id);
}

function militaryRatio(realm, other) {
  return Math.max(0.35, other.army || 0) / Math.max(0.35, realm.army || 0);
}

function foeDistance(realm, other) {
  return Math.hypot(wrapDxSim(realm.cx, other.cx), other.cy - realm.cy);
}

function aggroTerms(realm, other, contactCount) {
  const dist = foeDistance(realm, other);
  const border = contactCount * 1.8 + (contactCount ? 5 : 0);
  const near = Math.max(0, 26 - dist) * 0.35;
  const ratio = militaryRatio(realm, other);
  const strong = Math.max(0, ratio - 0.8) * 8;
  const conquests = (other.recentTakes || 0) * 4.2;
  const fromThem = (other.tookFrom[realm.id] || 0) * 9;
  let fromAllies = 0;
  const allies = realm.allies || [];
  for (let i = 0; i < allies.length; i++) fromAllies += (other.tookFrom[allies[i]] || 0) * 14;
  const cities = (realm.lostCities[other.id] || 0) * 16;
  const blood = (realm.lostSoldiers[other.id] || 0) * 0.4;
  const ally = isAlly(realm, other.id);
  const cut = ally ? 0.5 : 1;
  const score = (border + near + cities + conquests + fromThem + fromAllies) * cut - blood - strong;
  return {
    dist, contactCount, ratio, ally, score,
    border: border * cut,
    near: near * cut,
    cities: cities * cut,
    conquests: conquests * cut,
    fromThem: fromThem * cut,
    fromAllies: fromAllies * cut,
    blood, strong,
  };
}

function scoreAttack(realm, other, contactCount) {
  if (!other || other.id === realm.id || !(other.tiles > 0)) return -1e9;
  return aggroTerms(realm, other, contactCount).score;
}

function signedTenths(n) {
  const v = Math.round(n * 10) / 10;
  const body = Math.abs(v).toFixed(1);
  if (v > 0) return "+" + body;
  if (v < 0) return "−" + body;
  return "0.0";
}

function aggroTipLines(realm, you, contactCount) {
  const t = aggroTerms(realm, you, contactCount);
  const lines = [
    { label: "Shared border (" + t.contactCount + ")", value: t.border },
    { label: "Crowns " + Math.round(t.dist) + " tiles apart", value: t.near },
  ];
  if (Math.abs(t.cities) >= 0.05) lines.push({ label: "Cities they lost to you", value: t.cities });
  if (Math.abs(t.conquests) >= 0.05) lines.push({ label: "Your recent conquests", value: t.conquests });
  if (Math.abs(t.fromThem) >= 0.05) lines.push({ label: "Land you took from them", value: t.fromThem });
  if (Math.abs(t.fromAllies) >= 0.05) lines.push({ label: "Land you took from their allies", value: t.fromAllies });
  if (t.blood >= 0.05) lines.push({ label: "Soldiers they lost to you", value: -t.blood });
  if (t.strong >= 0.05) lines.push({ label: "Your army is " + t.ratio.toFixed(1) + "× theirs", value: -t.strong });
  return { lines, ally: t.ally };
}

function hideAggroTip() {
  const el = document.getElementById("aggro-tip");
  if (el) el.style.display = "none";
}

function overAggroTip(node) {
  return !!(node && node.closest && node.closest("#aggro-tip"));
}

function placeAggroTip(el, line) {
  const panel = document.getElementById("near");
  if (!line || !panel) return;
  const lineBox = line.getBoundingClientRect();
  const panelBox = panel.getBoundingClientRect();
  let left = panelBox.left - el.offsetWidth + 28;
  let top = lineBox.top;
  if (left < 8) left = Math.max(8, panelBox.right - 28);
  if (top + el.offsetHeight > cssH - 8) top = Math.max(8, cssH - 8 - el.offsetHeight);
  el.style.left = left + "px";
  el.style.top = top + "px";
}

function showAggroTip(line, x, y, place) {
  const el = document.getElementById("aggro-tip");
  const row = line && line.closest(".near-row");
  if (!el || !row || !realms || !realms.length) return;
  const id = Number(row.dataset.realm);
  const realm = realms[id - 1];
  const you = realms[0];
  if (!realm || !you || !(realm.tiles > 0)) {
    el.style.display = "none";
    return;
  }
  const touch = lastTouch && lastTouch[id - 1] ? (lastTouch[id - 1][you.id] || 0) : 0;
  const tip = aggroTipLines(realm, you, touch);
  aggroHold = true;
  el.replaceChildren();
  const title = document.createElement("div");
  title.className = "aggro-tip-title";
  title.textContent = crownCalled(realm.id) + " toward you";
  el.appendChild(title);
  for (let i = 0; i < tip.lines.length; i++) {
    const item = tip.lines[i];
    const hold = document.createElement("div");
    hold.className = "aggro-tip-row";
    const name = document.createElement("span");
    name.textContent = item.label;
    const num = document.createElement("span");
    num.textContent = signedTenths(item.value);
    hold.appendChild(name);
    hold.appendChild(num);
    el.appendChild(hold);
  }
  if (tip.ally) {
    const noteEl = document.createElement("div");
    noteEl.className = "aggro-tip-note";
    noteEl.textContent = "Allied, so the gains above are halved.";
    el.appendChild(noteEl);
  }
  el.style.display = "block";
  if (place !== false) placeAggroTip(el, line);
  aggroHold = false;
  if (x != null) aggroX = x;
  if (y != null) aggroY = y;
}

function restoreAggroTip() {
  if (!aggroRealm) return;
  const hit = document.elementFromPoint(aggroX, aggroY);
  const line = hit && hit.closest ? hit.closest(".near-aggro") : null;
  if (line) {
    const id = Number(line.closest(".near-row").dataset.realm) || 0;
    if (!id) { aggroRealm = 0; hideAggroTip(); return; }
    aggroRealm = id;
    showAggroTip(line, aggroX, aggroY, true);
    return;
  }
  if (overAggroTip(hit)) {
    const stay = document.querySelector('#near-list .near-row[data-realm="' + aggroRealm + '"] .near-aggro');
    if (stay) showAggroTip(stay, aggroX, aggroY, false);
    else { aggroRealm = 0; hideAggroTip(); }
    return;
  }
  aggroRealm = 0;
  hideAggroTip();
}

function dangerScore(realm, other, contactCount) {
  if (!other || other.id === realm.id || isAlly(realm, other.id) || !(other.tiles > 0)) return -1;
  const ratio = militaryRatio(realm, other);
  let d = (other.recentTakes || 0) * 5 + (other.tookFrom[realm.id] || 0) * 10;
  for (let i = 0; i < realm.allies.length; i++) d += (other.tookFrom[realm.allies[i]] || 0) * 14;
  d += (realm.lostCities[other.id] || 0) * 8;
  if (ratio >= 1.45 && contactCount > 0) d += (ratio - 1) * 6;
  if ((other.recentTakes || 0) >= 2) d += 4;
  return d;
}

function canTake(realm, other, contactCount) {
  if (!contactCount || !other) return false;
  let ratio = militaryRatio(realm, other);
  const villain = (other.recentTakes || 0) >= 2 || (realm.lostCities[other.id] || 0) > 0 || (other.tookFrom[realm.id] || 0) >= 0.5;
  if (villain) {
    for (let i = 0; i < realm.allies.length; i++) {
      const ally = realms[realm.allies[i] - 1];
      if (ally && ally.tiles) ratio -= 0.22;
    }
  }
  return ratio <= 1.2 && (realm.army || 0) >= 3;
}

function isHugeFoe(realm, other, contactCount) {
  const ratio = militaryRatio(realm, other);
  if (ratio >= 1.7 && (contactCount > 0 || foeDistance(realm, other) < 30)) return true;
  if ((other.recentTakes || 0) >= 3 && ratio >= 1.05) return true;
  return false;
}

function isLosingTo(realm, other, contactCount) {
  const recentCities = other.tookFrom[realm.id] || 0;
  if (recentCities >= 0.45 && (contactCount > 0 || recentCities >= 1)) return true;
  const blood = realm.lostSoldiers[other.id] || 0;
  return blood >= Math.max(3, (realm.army || 1) * 0.4) && contactCount > 0;
}

function decayDiplomacy() {
  if (diplomacyHold > 0) diplomacyHold--;
  for (const realm of realms) {
    realm.recentTakes *= 0.992;
    if (realm.recentTakes < 0.08) realm.recentTakes = 0;
    for (let k = 1; k < realm.lostSoldiers.length; k++) {
      realm.tookFrom[k] *= 0.992;
      if (realm.tookFrom[k] < 0.08) realm.tookFrom[k] = 0;
      realm.lostSoldiers[k] *= 0.996;
      if (realm.lostSoldiers[k] < 0.05) realm.lostSoldiers[k] = 0;
    }
    if (realm.allyLock > 0) realm.allyLock--;
  }
}

function allyStillHot(realm, threat, contact) {
  if (!threat) return false;
  const touch = contact[threat.id] || 0;
  if ((threat.recentTakes || 0) >= 0.7) return true;
  if ((threat.tookFrom[realm.id] || 0) >= 0.45) return true;
  for (let i = 0; i < realm.allies.length; i++) {
    if ((threat.tookFrom[realm.allies[i]] || 0) >= 0.45) return true;
  }
  return isHugeFoe(realm, threat, touch) || isLosingTo(realm, threat, touch);
}

function reviewAllies(realm, threat, contact) {
  if (!realm.allies) return;
  const hot = allyStillHot(realm, threat, contact);
  for (let i = realm.allies.length - 1; i >= 0; i--) {
    const id = realm.allies[i];
    const other = realms[id - 1];
    if (!other || !other.tiles) {
      dropAlly(realm, id);
      continue;
    }
    const stoleFromUs = (other.tookFrom[realm.id] || 0) >= 0.45;
    let stoleFromAlly = false;
    for (let k = 0; k < realm.allies.length; k++) {
      const aid = realm.allies[k];
      if (aid !== id && (other.tookFrom[aid] || 0) >= 0.45) stoleFromAlly = true;
    }
    const blood = realm.lostSoldiers[id] || 0;
    if (stoleFromUs || stoleFromAlly || blood >= Math.max(4, (realm.army || 1) * 0.55)) {
      dropAlly(realm, id);
      continue;
    }
    if (commonStrongerFoe(realm, other)) continue;
    if (realm.allyLock > 0) continue;
    if (threat && id === threat.id) {
      dropAlly(realm, id);
      continue;
    }
    if (hot) continue;
    dropAlly(realm, id);
  }
}

function announceAlliance(asker, partner, foe) {
  const involvesYou = asker.id === 1 || partner.id === 1 || foe.id === 1;
  if (!involvesYou && (command || diplomacyHold > 0)) return;
  let text;
  if (partner.id === 1) text = crownCalled(asker.id) + " asks you to join against " + crownCalled(foe.id) + ".";
  else if (foe.id === 1) text = crownCalled(asker.id) + " and " + crownCalled(partner.id) + " ally against you.";
  else text = crownCalled(asker.id) + " allies with " + crownCalled(partner.id) + " against " + crownCalled(foe.id) + ".";
  note.textContent = text;
  if (involvesYou) diplomacyHold = 10;
}

function seekAlliance(realm, foe) {
  if (!foe || foe.id === realm.id || isAlly(realm, foe.id)) return;
  let best = null;
  let bestS = 0;
  for (const other of realms) {
    if (other.id === realm.id || other.id === foe.id || !other.tiles) continue;
    if (isAlly(other, foe.id) || isAlly(realm, other.id)) continue;
    if ((realm.lostCities[other.id] || 0) > 0) continue;
    let s = (other.army || 0) * 0.15 + (other.lostCities[foe.id] || 0) * 8;
    s += (foe.tookFrom[other.id] || 0) * 6 + (foe.recentTakes || 0) * 1.6;
    if (other.id === 1) s += 1.5;
    if (s > bestS) { bestS = s; best = other; }
  }
  if (!best || bestS < 0.8 || !allyWith(realm, best)) return;
  realm.allyLock = 12;
  best.allyLock = Math.max(best.allyLock || 0, 12);
  announceAlliance(realm, best, foe);
}

function frontierStep(realm, x, y, steps, intoEnemy) {
  const dx = wrapDxSim(realm.cx, x);
  const dy = y - realm.cy;
  const mag = Math.hypot(dx, dy) || 1;
  let tx = x;
  let ty = y;
  let into = 0;
  for (let s = 1; s <= steps; s++) {
    const ix = (Math.round(x + (dx / mag) * s) % SW + SW) % SW;
    const iy = Math.max(0, Math.min(SH - 1, Math.round(y + (dy / mag) * s)));
    const cell = iy * SW + ix;
    if (!simLand[cell]) break;
    const occ = owner[cell];
    if (occ === realm.id) break;
    if (occ && isAlly(realm, occ)) break;
    if (occ && occ !== realm.id) {
      if (intoEnemy <= 0) break;
      into++;
      tx = ix;
      ty = iy;
      if (into >= intoEnemy) break;
      continue;
    }
    tx = ix;
    ty = iy;
  }
  return [tx, ty];
}

function areaCool(realm, x, y) {
  const list = realm.avoid;
  if (!list) return false;
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    if (a.until <= simTime) continue;
    if (dist2Sim(a.x, a.y, x, y) <= 64) return true;
  }
  return false;
}

function watchStuckOrders() {
  for (let r = 0; r < realms.length; r++) {
    const realm = realms[r];
    if (!realm.ai) continue;
    if (realm.avoid) {
      for (let i = realm.avoid.length - 1; i >= 0; i--) {
        if (realm.avoid[i].until <= simTime) realm.avoid.splice(i, 1);
      }
    }
    for (let i = realm.soldierOrders.length - 1; i >= 0; i--) {
      const order = realm.soldierOrders[i];
      if (order.auto || order.aim === "sea") continue;
      const cell = orderCell(order);
      let afloat = false;
      if (boats) {
        for (let b = 0; b < boats.length; b++) {
          if (boats[b].realmId !== realm.id) continue;
          if (dist2Sim(boats[b].tx, boats[b].ty, order.sx, order.sy) <= 16) { afloat = true; break; }
        }
      }
      if (afloat) {
        order.stuckKey = cell[2];
        order.stuckAt = simTime;
        continue;
      }
      if (owner[cell[2]] === realm.id) {
        order.stuckKey = cell[2];
        order.stuckAt = simTime;
        continue;
      }
      if (order.stuckKey !== cell[2] || order.stuckAt == null) {
        order.stuckKey = cell[2];
        order.stuckAt = simTime;
        continue;
      }
      if (simTime - order.stuckAt < 40) continue;
      if (!realm.avoid) realm.avoid = [];
      realm.avoid.push({ x: order.sx, y: order.sy, until: simTime + 60 });
      realm.soldierOrders.splice(i, 1);
    }
  }
}

function ensureOrder(realm, kind, sx, sy, strength) {
  let order = null;
  for (let i = 0; i < realm.soldierOrders.length; i++) {
    if (realm.soldierOrders[i].kind === kind) { order = realm.soldierOrders[i]; break; }
  }
  if (order) {
    if (dist2Sim(order.sx, order.sy, sx, sy) > 9) {
      order.srcAt = null;
      order.strength = strength;
      order.life = orderLife;
      order.sx = sx;
      order.sy = sy;
      const src = closeRegion(realm.id, sx, sy);
      if (src) { order.ox = src.ox; order.oy = src.oy; order.mask = src.mask; }
      stampAim(realm, order);
    }
    return;
  }
  const src = closeRegion(realm.id, sx, sy);
  const made = {
    sx, sy, life: orderLife, strength, kind,
    ox: src ? src.ox : sx, oy: src ? src.oy : sy,
    mask: src ? src.mask : null,
  };
  stampAim(realm, made);
  realm.soldierOrders.push(made);
}

function retainOrders(realm, keep) {
  for (let i = realm.soldierOrders.length - 1; i >= 0; i--) {
    if (realm.soldierOrders[i].auto) continue;
    const kind = realm.soldierOrders[i].kind;
    if (!kind || !keep[kind]) realm.soldierOrders.splice(i, 1);
  }
}

function rememberBorder(list, item, limit) {
  for (let i = 0; i < list.length; i++) {
    if (dist2Sim(list[i].x, list[i].y, item.x, item.y) >= 4) continue;
    if (item.score > list[i].score) {
      list[i] = item;
      list.sort((a, b) => b.score - a.score);
    }
    return;
  }
  if (list.length < limit) {
    list.push(item);
    list.sort((a, b) => b.score - a.score);
    return;
  }
  if (item.score <= list[list.length - 1].score) return;
  list[list.length - 1] = item;
  list.sort((a, b) => b.score - a.score);
}

function homeComp(realm) {
  if (!landComp || !realm || !realm.capital) return mainComp;
  const x = ((realm.capital.sx % SW) + SW) % SW;
  const y = realm.capital.sy | 0;
  if (y < 0 || y >= SH) return mainComp;
  const i = y * SW + x;
  if (!simLand[i]) return mainComp;
  return landComp[i];
}

function stripSail(realm) {
  const list = realm.soldierOrders;
  for (let i = list.length - 1; i >= 0; i--) if (list[i].kind === "sail") list.splice(i, 1);
}

function sailTileGood(realm, order, home) {
  const cell = orderCell(order);
  if (!simLand[cell[2]] || owner[cell[2]]) return false;
  if (landComp[cell[2]] === home) return false;
  if (areaCool(realm, cell[0], cell[1])) return false;
  return true;
}

function nearestOverseas(realm, home) {
  const sx = realm.capital ? realm.capital.sx : realm.cx;
  const sy = realm.capital ? realm.capital.sy : realm.cy;
  let best = null;
  let bestS = Infinity;
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const i = y * SW + x;
      if (!simLand[i] || owner[i]) continue;
      const comp = landComp[i];
      if (comp < 0 || comp === home) continue;
      if (areaCool(realm, x, y)) continue;
      let sea = !simLand[y * SW + ((x + SW - 1) % SW)] || !simLand[y * SW + ((x + 1) % SW)];
      if (!sea && y > 0 && !simLand[i - SW]) sea = true;
      if (!sea && y + 1 < SH && !simLand[i + SW]) sea = true;
      if (!sea) continue;
      const dist = Math.sqrt(dist2Sim(sx, sy, x, y));
      const bonus = Math.min(compSize[comp] || 0, 500) * 0.05;
      const score = dist - bonus;
      if (score < bestS) { bestS = score; best = { x, y }; }
    }
  }
  return best;
}

function sailPlan(realm) {
  const home = homeComp(realm);
  const island = !!(landComp && home !== mainComp && (compSize[home] || 0) > 0);
  if (!island) {
    stripSail(realm);
    return null;
  }
  for (let i = 0; i < realm.soldierOrders.length; i++) {
    const order = realm.soldierOrders[i];
    if (order.kind === "sail" && sailTileGood(realm, order, home)) return "keep";
  }
  return nearestOverseas(realm, home);
}

function aiThink() {
  decayDiplomacy();
  for (const realm of realms) {
    if (!realm.ai) continue;
    const slots = realms.length + 1;
    const contact = new Uint16Array(slots);
    const touch = new Array(slots);
    const touchScore = new Float64Array(slots);
    const touchCool = new Array(slots);
    const coolScore = new Float64Array(slots);
    const emptyBest = [];
    let owned = 0;
    let frontier = 0;
    const prefer = realm.id * 1.17;
    for (let y = 0; y < SH; y++) {
      for (let x = 0; x < SW; x++) {
        const i = y * SW + x;
        if (owner[i] !== realm.id) continue;
        owned++;
        let open = false;
        for (const nb of neighborsOf(x, y)) {
          if (!simLand[nb[2]] || owner[nb[2]] === realm.id) continue;
          const occ = owner[nb[2]];
          if (!occ) {
            open = true;
            if (areaCool(realm, nb[0], nb[1])) continue;
            const ang = Math.atan2(nb[1] - realm.cy, wrapDxSim(realm.cx, nb[0]));
            const score = (7.5 - simCost[nb[2]] * 0.8 - soldiers[nb[2]] * 0.35) + Math.cos(ang - prefer) * 1.4;
            rememberBorder(emptyBest, { x: nb[0], y: nb[1], score }, 8);
          } else {
            contact[occ]++;
            let score = 5 - soldiers[nb[2]] * 0.8 - simCost[nb[2]] * 0.25;
            if (cityOn(nb[2])) score += 7;
            if (areaCool(realm, nb[0], nb[1])) {
              if (!touchCool[occ] || score > coolScore[occ]) {
                coolScore[occ] = score;
                touchCool[occ] = nb;
              }
              continue;
            }
            if (!touch[occ] || score > touchScore[occ]) {
              touchScore[occ] = score;
              touch[occ] = nb;
            }
          }
        }
        if (open) frontier++;
      }
    }
    if (!owned) {
      realm.soldierOrders.length = 0;
      continue;
    }
    let bestThreat = null;
    let bestThreatDanger = 0;
    const prey = [];
    for (let n = 0; n < realms.length; n++) {
      const other = realms[n];
      if (other.id === realm.id || !other.tiles) continue;
      const touchN = contact[other.id] || 0;
      const sc = scoreAttack(realm, other, touchN);
      const tile = touch[other.id] || touchCool[other.id];
      if (canTake(realm, other, touchN) && tile && sc > -1e8) {
        prey.push({ other, sc, tile, cool: !touch[other.id] });
      }
      const danger = dangerScore(realm, other, touchN);
      if (danger > bestThreatDanger) {
        bestThreat = other;
        bestThreatDanger = danger;
      }
    }
    prey.sort((a, b) => b.sc - a.sc);
    reviewAllies(realm, bestThreat, contact);
    const threatContact = bestThreat ? (contact[bestThreat.id] || 0) : 0;
    const huge = !!(bestThreat && isHugeFoe(realm, bestThreat, threatContact));
    const losing = !!(bestThreat && isLosingTo(realm, bestThreat, threatContact));
    const binge = !!(bestThreat && (bestThreat.recentTakes || 0) >= 2);
    const threatened = huge || losing || binge;
    if (threatened && bestThreat) seekAlliance(realm, bestThreat);
    const opening = owned < 110 && frontier >= 10;
    let attackFoe = null;
    let attackTile = null;
