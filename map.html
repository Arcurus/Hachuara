<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hachuara</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #cfc6b4;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
  }
  canvas.dragging { cursor: grabbing; }
  #bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 16px 10px;
    background: #e4dccb;
    border-top: 1px solid #1c1915;
    z-index: 3;
    box-sizing: border-box;
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    color: #1c1915;
  }
  #tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font: inherit;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: #1c1915;
    background: rgba(247, 243, 234, 0.88);
    border: 1px solid #1c1915;
    padding: 5px 12px;
    cursor: pointer;
  }
  button:hover { background: #fffaf0; }
  button.active { background: #1c1915; color: #f4efe4; }
  label.pace {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    letter-spacing: 0.06em;
  }
  select.pace {
    font: inherit;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: #1c1915;
    background: rgba(247, 243, 234, 0.88);
    border: 1px solid #1c1915;
    padding: 4px 8px;
    cursor: pointer;
  }
  #settings {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 22px;
    align-items: center;
    margin: 0;
    padding: 8px 10px;
    background: rgba(247, 243, 234, 0.94);
    border: 1px solid #1c1915;
  }
  #settings[hidden] { display: none; }
  #settings label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    letter-spacing: 0.06em;
  }
  #settings input[type="number"] {
    font: inherit;
    font-size: 14px;
    width: 4.6em;
    color: #1c1915;
    background: #fffaf0;
    border: 1px solid #1c1915;
    padding: 4px 8px;
  }
  #relations {
    font-size: 13px;
    letter-spacing: 0.03em;
    line-height: 1.35;
  }
  #status {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    min-width: 0;
  }
  #note {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    letter-spacing: 0.03em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #seed {
    flex: none;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #3a342c;
    white-space: nowrap;
  }
  #top {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 18px;
    padding: 6px 16px;
    background: rgba(247, 243, 234, 0.92);
    border: 1px solid #1c1915;
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: #1c1915;
    pointer-events: none;
    z-index: 2;
  }
  #near {
    position: fixed;
    top: 72px;
    right: 12px;
    bottom: 108px;
    width: 252px;
    box-sizing: border-box;
    overflow: auto;
    padding: 8px 12px 10px;
    background: rgba(247, 243, 234, 0.94);
    border: 1px solid #1c1915;
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    line-height: 1.35;
    color: #1c1915;
    z-index: 2;
  }
  #near .near-title {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .near-row {
    padding: 6px 0 5px;
    border-top: 1px solid rgba(28, 25, 21, 0.2);
  }
  .near-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .near-swatch {
    flex: none;
    width: 11px;
    height: 11px;
    border: 1px solid #1c1915;
  }
  .near-name { flex: 1; font-size: 15px; letter-spacing: 0.04em; }
  .near-rel { margin-left: auto; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  @media (max-width: 980px) {
    .near-rel { flex-basis: 100%; margin-left: 0; padding-left: 19px; }
  }
  .near-row { cursor: pointer; }
  .near-meta, .near-aggro {
    display: flex;
    flex-wrap: nowrap;
    gap: 2px 10px;
    padding-left: 19px;
    color: #3a342c;
    white-space: nowrap;
  }
  .near-aggro { cursor: help; }
  #aggro-tip {
    position: fixed;
    z-index: 4;
    display: none;
    padding: 6px 8px;
    background: rgba(247, 243, 234, 0.97);
    border: 1px solid #1c1915;
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: #1c1915;
    max-width: 280px;
    line-height: 1.35;
    pointer-events: auto;
  }
  .aggro-tip-title { letter-spacing: 0.04em; margin-bottom: 4px; }
  .aggro-tip-row { display: flex; justify-content: space-between; gap: 14px; }
  .aggro-tip-note { margin-top: 4px; color: #3a342c; }
  #city-hover {
    position: fixed;
    z-index: 3;
    display: none;
    pointer-events: none;
    padding: 4px 8px;
    background: rgba(247, 243, 234, 0.96);
    border: 1px solid #1c1915;
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: #1c1915;
    line-height: 1.35;
  }
  .near-empty { color: #3a342c; padding-top: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <span id="stat-pop">People 0</span>
  <span id="stat-mil">Soldiers 0</span>
  <span id="stat-gold">Gold 0</span>
  <span id="stat-dead">Lost 0</span>
</div>
<aside id="near" aria-label="Nearby nations">
  <div class="near-title">Nearby</div>
  <div id="near-list"></div>
</aside>
<div id="city-hover"></div>
<div id="aggro-tip"></div>
<div id="bar">
  <form id="settings" hidden>
    <label>Pull time
      <input id="pull-life" type="number" min="5" max="600" step="1" value="60" aria-label="Pull time in seconds">
      seconds
    </label>
    <label>Movement
      <select id="move-pace" class="pace" aria-label="Movement speed">
        <option value="0.25">¼</option>
        <option value="0.5" selected>½</option>
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </label>
    <label>Combat
      <select id="fight-pace" class="pace" aria-label="Combat speed">
        <option value="0.25">¼</option>
        <option value="0.5">½</option>
        <option value="1" selected>1</option>
        <option value="2">2</option>
      </select>
    </label>
    <label>Ships
      <select id="ship-size" class="pace" aria-label="Ship size">
        <option value="0.25">¼</option>
        <option value="0.5" selected>½</option>
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </label>
    <label>Militia
      <select id="militia-pace" class="pace" aria-label="Militia draft speed">
        <option value="0.25">¼</option>
        <option value="0.5" selected>½</option>
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </label>
    <label>City tip
      <input id="city-tip" type="checkbox" checked aria-label="City tip">
    </label>
  </form>
  <div id="tools">
    <button id="target" type="button">Target</button>
    <button id="pull" type="button">Pull civilians</button>
    <button id="layer" type="button">Show soldiers</button>
    <button id="food" type="button">Show food</button>
    <button id="borders" type="button" class="active">Borders</button>
    <button id="capital" type="button">Capital</button>
    <button id="whole" type="button">Whole world</button>
    <button id="reseed" type="button">Another world</button>
    <button id="settings-btn" type="button">Settings</button>
  </div>
  <div id="relations">All realms are at peace.</div>
  <div id="status">
    <span id="note">WASD moves the map. Target sends soldiers. Pull gathers a city.</span>
    <span id="seed"></span>
  </div>
</div>
<script>
const GW = 768;
const GH = 384;
const WORLD_W = GW;
const WORLD_H = GH;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const seedLabel = document.getElementById("seed");

let SEED = (Math.random() * 0x7fffffff) | 0;
let dpr = 1;
let cssW = 1;
let cssH = 1;
let scale = 1;
let camX = WORLD_W / 2;
let camY = WORLD_H / 2;
let fitScale = 1;
let barPx = 86;
let topPx = 64;

let tone = null;
let coasts = [];
let shores = [];
let highlands = [];
let bathys = [];
let rivers = [];
let hachures = [];
let seaMin = 0;
let seaLevel = 0;

const params = new URLSearchParams(location.search);
if (params.has("seed")) SEED = Number(params.get("seed")) | 0;

function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
function hash3(ix, iy, iz) {
  let n = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(iz, 1440662689) ^ Math.imul(SEED, 1013904223);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, z) {
  const x0 = Math.floor(x), y0 = Math.floor(y), z0 = Math.floor(z);
  const xf = x - x0, yf = y - y0, zf = z - z0;
  const u = fade(xf), v = fade(yf), w = fade(zf);
  const h = (dx, dy, dz) => hash3(x0 + dx, y0 + dy, z0 + dz);
  const x00 = lerp(h(0, 0, 0), h(1, 0, 0), u);
  const x10 = lerp(h(0, 1, 0), h(1, 1, 0), u);
  const x01 = lerp(h(0, 0, 1), h(1, 0, 1), u);
  const x11 = lerp(h(0, 1, 1), h(1, 1, 1), u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w);
}
function fbm(x, y, z, octaves) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * vnoise(x * f, y * f, z * f);
    norm += amp;
    amp *= 0.5;
    f *= 2.03;
  }
  return sum / norm;
}

function cylinder(nx, ny) {
  const ang = nx * Math.PI * 2;
  return [Math.cos(ang), Math.sin(ang), (ny - 0.5) * 2];
}

function sampleRaw(nx, ny) {
  let [px, py, pz] = cylinder(nx, ny);
  const warp = 0.55;
  px += (fbm(px * 1.3 + 2.2, py * 1.3, pz * 0.8, 3) - 0.5) * warp;
  py += (fbm(px * 1.3, py * 1.3 + 5.1, pz * 0.8, 3) - 0.5) * warp;
  pz += (fbm(px + 8.0, py + 1.7, pz * 1.2 + 4.4, 3) - 0.5) * warp * 0.45;

  const cont = fbm(px * 1.05, py * 1.05, pz * 0.72, 5);
  let ridge = 0, amp = 0.58, f = 1.7, norm = 0;
  for (let i = 0; i < 5; i++) {
    const n = 1 - Math.abs(vnoise(px * f + 12, py * f - 3, pz * f) * 2 - 1);
    ridge += amp * n * n;
    norm += amp;
    amp *= 0.48;
    f *= 2.07;
  }
  ridge /= norm;
  const mount = smoothstep(0.5, 0.7, cont);
  let e = (cont - 0.5) * 1.15 + ridge * 0.62 * mount;
  const south = smoothstep(0.72, 0.98, ny);
  const southShape = fbm(px * 1.5 + 2, py * 1.5, 1.4, 4);
  e += south * (southShape - 0.42) * 1.6;
  const north = smoothstep(0.22, 0.0, ny);
  e -= north * (0.35 + fbm(px * 1.8, py * 1.8, 5, 3)) * 0.9;
  return e;
}

function landNear(land, x, y, gap) {
  const r = gap | 0;
  const gap2 = gap * gap;
  for (let dy = -r; dy <= r; dy += 3) {
    const yy = y + dy;
    if (yy < 0 || yy >= GH) continue;
    for (let dx = -r; dx <= r; dx += 3) {
      if (dx * dx + dy * dy > gap2) continue;
      let xx = x + dx;
      if (xx < 0) xx += GW;
      else if (xx >= GW) xx -= GW;
      if (land[yy * GW + xx]) return true;
    }
  }
  return false;
}

function stampIslands(elev, land) {
  const rand = rngFrom(SEED ^ 0x51ed);
  const specs = [42, 36, 28, 24, 22, 16, 14, 12, 11];
  const placed = [];
  for (let s = 0; s < specs.length; s++) {
    const radius = specs[s];
    const aspect = 0.62 + rand() * 0.28;
    const reach = Math.ceil(radius * 1.35);
    const gap = reach + 14;
    let spot = null;
    for (let t = 0; t < 140 && !spot; t++) {
      const x = (rand() * GW) | 0;
      const yLo = reach + 2;
      const yHi = GH - reach - 3;
      if (yHi <= yLo) break;
      const y = (yLo + rand() * (yHi - yLo)) | 0;
      if (land[y * GW + x]) continue;
      if (landNear(land, x, y, gap)) continue;
      let close = false;
      for (let p = 0; p < placed.length; p++) {
        let dx = Math.abs(placed[p].x - x);
        if (dx > GW / 2) dx = GW - dx;
        const dy = placed[p].y - y;
        const need = gap + placed[p].r;
        if (dx * dx + dy * dy < need * need) { close = true; break; }
      }
      if (!close) spot = [x, y];
    }
    if (!spot) continue;
    const rot = rand() * Math.PI;
    const cos = Math.cos(rot);
    const sin = Math.sin(rot);
    const rx = radius * (0.85 + rand() * 0.35);
    const ry = Math.max(6, radius * aspect);
    const lobe = rand() * Math.PI * 2;
    for (let dy = -reach; dy <= reach; dy++) {
      const yy = spot[1] + dy;
      if (yy <= 0 || yy >= GH - 1) continue;
      for (let dx = -reach; dx <= reach; dx++) {
        let xx = spot[0] + dx;
        if (xx < 0) xx += GW;
        else if (xx >= GW) xx -= GW;
        const lx = dx * cos + dy * sin;
        const ly = -dx * sin + dy * cos;
        const ang = Math.atan2(ly, lx);
        const rad = Math.hypot(lx / rx, ly / ry);
        const coast = fbm(xx * 0.045 + s * 0.17, yy * 0.045, 1.7 + s * 0.03, 3);
        const bulge = 0.16 * Math.sin(ang * 2 + lobe) + 0.1 * Math.sin(ang * 5 + rot);
        const limit = 0.78 + (coast - 0.5) * 0.7 + bulge;
        if (rad > limit) continue;
        const i = yy * GW + xx;
        const inland = Math.max(0, 1 - rad / Math.max(0.2, limit));
        const lift = seaLevel + 0.03 + inland * (0.08 + coast * 0.16);
        if (elev[i] < lift) elev[i] = lift;
        land[i] = 1;
      }
    }
    placed.push({ x: spot[0], y: spot[1], r: radius });
  }
}

function buildWorld() {
  const elev = new Float32Array(GW * GH);
  let minE = Infinity, maxE = -Infinity;
  elevField = elev;
  for (let y = 0; y < GH; y++) {
    const ny = y / (GH - 1);
    for (let x = 0; x < GW; x++) {
      const e = sampleRaw(x / GW, ny);
      elev[y * GW + x] = e;
      if (e < minE) minE = e;
      if (e > maxE) maxE = e;
    }
  }
  const sorted = Array.from(elev).sort((a, b) => a - b);
  seaLevel = sorted[Math.floor(sorted.length * 0.60)];
  seaMin = minE;
  maxElev = maxE;

  const land = new Uint8Array(GW * GH);
  for (let i = 0; i < elev.length; i++) land[i] = elev[i] >= seaLevel ? 1 : 0;
  stampIslands(elev, land);

  tone = bakeTone(land);
  coasts = contours(elev, seaLevel);
  shores = [];
  highlands = contours(elev, seaLevel + (maxE - seaLevel) * 0.55);
  const span = seaLevel - minE;
  bathys = contours(elev, seaLevel - span * 0.18)
    .concat(contours(elev, seaLevel - span * 0.42));

  rivers = traceRivers(elev, land);
  hachures = traceHachures(elev, land);
  seedLabel.textContent = "Seed " + SEED;
}

function bakeTone(land) {
  const c = document.createElement("canvas");
  c.width = GW;
  c.height = GH;
  const g = c.getContext("2d");
  const img = g.createImageData(GW, GH);
  const d = img.data;
  for (let y = 0; y < GH; y++) {
    const ny = y / (GH - 1);
    for (let x = 0; x < GW; x++) {
      const i = y * GW + x;
      const o = i * 4;
      if (land[i]) {
        d[o] = 247; d[o + 1] = 242; d[o + 2] = 230;
      } else {
        d[o] = 214; d[o + 1] = 216; d[o + 2] = 214;
      }
      d[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

function contours(field, level) {
  const segs = [];
  const sample = (x, y) => field[y * GW + ((x % GW) + GW) % GW];
  for (let y = 0; y < GH - 1; y++) {
    for (let x = 0; x < GW; x++) {
      const x1 = (x + 1) % GW;
      const v00 = sample(x, y);
      const v10 = sample(x1, y);
      const v11 = sample(x1, y + 1);
      const v01 = sample(x, y + 1);
      const b0 = v00 >= level ? 1 : 0;
      const b1 = v10 >= level ? 1 : 0;
      const b2 = v11 >= level ? 1 : 0;
      const b3 = v01 >= level ? 1 : 0;
      const idx = b0 | (b1 << 1) | (b2 << 2) | (b3 << 3);
      if (idx === 0 || idx === 15) continue;
      const top = edgePoint(x, y, v00, v10, level, 0);
      const right = edgePoint(x, y, v10, v11, level, 1);
      const bottom = edgePoint(x, y, v01, v11, level, 2);
      const left = edgePoint(x, y, v00, v01, level, 3);
      const add = (p, q) => { if (p && q) segs.push([p, q]); };
      switch (idx) {
        case 1: add(left, top); break;
        case 2: add(top, right); break;
        case 3: add(left, right); break;
        case 4: add(right, bottom); break;
        case 5: add(left, bottom); add(top, right); break;
        case 6: add(top, bottom); break;
        case 7: add(left, bottom); break;
        case 8: add(bottom, left); break;
        case 9: add(bottom, top); break;
        case 10: add(top, left); add(right, bottom); break;
        case 11: add(right, bottom); break;
        case 12: add(right, left); break;
        case 13: add(top, right); break;
        case 14: add(left, top); break;
        default: break;
      }
    }
  }
  return smoothLoops(stitch(segs), 2);
}

function edgePoint(x, y, va, vb, level, side) {
  const t = va === vb ? 0.5 : (level - va) / (vb - va);
  const u = Math.max(0, Math.min(1, t));
  let px, py;
  if (side === 0) { px = x + u; py = y; }
  else if (side === 1) { px = x + 1; py = y + u; }
  else if (side === 2) { px = x + u; py = y + 1; }
  else { px = x; py = y + u; }
  if (px >= GW) px -= GW;
  return [px, py];
}

function keyOf(p) {
  let x = p[0];
  if (x < 0) x += GW;
  if (x >= GW) x -= GW;
  return (Math.round(x * 4) + GW * 4) % (GW * 4) + "," + Math.round(p[1] * 4);
}

function stitch(segs) {
  const bag = new Map();
  const add = (pt, seg) => {
    const k = keyOf(pt);
    if (!bag.has(k)) bag.set(k, []);
    bag.get(k).push(seg);
  };
  for (const seg of segs) {
    add(seg[0], seg);
    add(seg[1], seg);
  }
  const used = new Set();
  const loops = [];
  for (const seg of segs) {
    if (used.has(seg)) continue;
    const line = [seg[0].slice(), seg[1].slice()];
    unwrapPoint(line[0], line[1]);
    used.add(seg);
    let guard = 0;
    while (guard++ < segs.length) {
      const end = line[line.length - 1];
      const list = bag.get(keyOf(end));
      if (!list) break;
      let next = null;
      for (const cand of list) {
        if (used.has(cand)) continue;
        next = cand;
        break;
      }
      if (!next) break;
      used.add(next);
      const a = next[0], b = next[1];
      const useB = distWrap(end, a) <= distWrap(end, b);
      const np = (useB ? b : a).slice();
      unwrapPoint(end, np);
      line.push(np);
      if (distWrap(np, line[0]) < 0.8) break;
    }
    if (line.length > 6) loops.push(line);
  }
  return loops;
}

function distWrap(a, b) {
  let dx = Math.abs(a[0] - b[0]);
  if (dx > GW / 2) dx = GW - dx;
  const dy = a[1] - b[1];
  return Math.hypot(dx, dy);
}

function unwrapPoint(prev, p) {
  let dx = p[0] - prev[0];
  if (dx > GW / 2) p[0] -= GW;
  else if (dx < -GW / 2) p[0] += GW;
}

function smoothLoops(loops, passes) {
  let cur = loops;
  for (let n = 0; n < passes; n++) {
    cur = cur.map(chaikin);
  }
  return cur.filter((line) => line.length > 8);
}

function chaikin(line) {
  if (line.length < 4) return line;
  const closed = distWrap(line[0], line[line.length - 1]) < 1.2;
  const src = line.slice();
  if (closed) src.pop();
  const out = [];
  const m = src.length;
  for (let i = 0; i < m; i++) {
    const a = src[i];
    const b = src[(i + 1) % m];
    if (!closed && i === m - 1) break;
    const q = [a[0], a[1]];
    const r = [b[0], b[1]];
    unwrapPoint(q, r);
    out.push([q[0] * 0.75 + r[0] * 0.25, q[1] * 0.75 + r[1] * 0.25]);
    out.push([q[0] * 0.25 + r[0] * 0.75, q[1] * 0.25 + r[1] * 0.75]);
  }
  if (!closed && line.length) {
    out.unshift(line[0].slice());
    out.push(line[line.length - 1].slice());
  }
  return out;
}

function traceRivers(elev, land) {
  const N = GW * GH;
  const flow = new Int32Array(N);
  flow.fill(-1);
  const idx = (x, y) => y * GW + x;
  const neighbors = (x, y) => {
    const out = [];
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        const yy = y + dy;
        if (yy < 0 || yy >= GH) continue;
        let xx = x + dx;
        if (xx < 0) xx += GW;
        if (xx >= GW) xx -= GW;
        out.push(idx(xx, yy));
      }
    }
    return out;
  };

  const parent = new Int32Array(N).fill(-1);
  const reached = new Uint8Array(N);
  const heap = [];
  const push = (pri, val) => {
    heap.push({ pri, val });
    let i = heap.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (heap[p].pri <= heap[i].pri) break;
      const tmp = heap[p]; heap[p] = heap[i]; heap[i] = tmp;
      i = p;
    }
  };
  const pop = () => {
    const top = heap[0];
    const last = heap.pop();
    if (heap.length) {
      heap[0] = last;
      let i = 0;
      for (;;) {
        const l = i * 2 + 1;
        const r = l + 1;
        let s = i;
        if (l < heap.length && heap[l].pri < heap[s].pri) s = l;
        if (r < heap.length && heap[r].pri < heap[s].pri) s = r;
        if (s === i) break;
        const tmp = heap[s]; heap[s] = heap[i]; heap[i] = tmp;
        i = s;
      }
    }
    return top;
  };

  for (let i = 0; i < N; i++) if (!land[i]) reached[i] = 1;
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const i = idx(x, y);
      if (land[i]) continue;
      for (const n of neighbors(x, y)) {
        if (reached[n] || parent[n] >= 0) continue;
        parent[n] = i;
        push(elev[n], n);
      }
    }
  }
  while (heap.length) {
    const item = pop();
    const i = item.val;
    if (reached[i]) continue;
    reached[i] = 1;
    const x = i % GW;
    const y = (i / GW) | 0;
    for (const n of neighbors(x, y)) {
      if (reached[n] || parent[n] >= 0) continue;
      parent[n] = i;
      push(elev[n], n);
    }
  }
  const filled = new Float32Array(elev);
  const reachOrder = [];
  for (let i = 0; i < N; i++) if (land[i] && parent[i] >= 0) reachOrder.push(i);
  reachOrder.sort((a, b) => elev[a] - elev[b]);
  for (const i of reachOrder) {
    const p = parent[i];
    if (p >= 0 && !land[p]) filled[i] = elev[i];
    else if (p >= 0) filled[i] = Math.max(elev[i], filled[p]);
  }
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const i = idx(x, y);
      if (!land[i]) continue;
      let best = -1;
      let bestH = filled[i];
      let touchesSea = false;
      for (const n of neighbors(x, y)) {
        if (!land[n]) { touchesSea = true; continue; }
        if (filled[n] < bestH - 1e-5) { bestH = filled[n]; best = n; }
      }
      if (best >= 0) flow[i] = best;
      else if (!touchesSea && parent[i] >= 0 && land[parent[i]]) flow[i] = parent[i];
    }
  }

  const flux = new Float32Array(N);
  for (let y = 0; y < GH; y++) {
    const ny = y / (GH - 1);
    for (let x = 0; x < GW; x++) {
      const i = idx(x, y);
      if (!land[i]) continue;
      const ang = (x / GW) * Math.PI * 2;
      let moist = fbm(Math.cos(ang) * 1.4 + 4, Math.sin(ang) * 1.4, ny * 2.2, 4);
      moist *= 0.8 + 0.2 * (1 - Math.abs(ny - 0.45) * 1.4);
      flux[i] = 0.2 + moist * moist * 1.4;
    }
  }
  const ups = new Array(N);
  for (let i = 0; i < N; i++) if (flow[i] >= 0) {
    flux[flow[i]] += 0;
    if (!ups[flow[i]]) ups[flow[i]] = [];
    ups[flow[i]].push(i);
  }
  const indeg = new Int32Array(N);
  for (let i = 0; i < N; i++) if (flow[i] >= 0) indeg[flow[i]]++;
  const queue = [];
  for (let i = 0; i < N; i++) if (land[i] && indeg[i] === 0) queue.push(i);
  while (queue.length) {
    const i = queue.pop();
    const n = flow[i];
    if (n >= 0) {
      flux[n] += flux[i];
      indeg[n]--;
      if (indeg[n] === 0) queue.push(n);
    }
  }

  const mouths = [];
  for (let i = 0; i < N; i++) {
    if (!land[i] || flow[i] >= 0) continue;
    if (parent[i] < 0 || land[parent[i]]) continue;
    if (flux[i] > 18) mouths.push(i);
  }
  mouths.sort((a, b) => flux[b] - flux[a]);

  const lines = [];
  const used = new Uint8Array(N);
  const stem = (start, allowUsed) => {
    const pts = [];
    let i = start;
    let guard = 0;
    while (i >= 0 && guard++ < 3000) {
      if (used[i] && pts.length) break;
      used[i] = 1;
      pts.push([(i % GW) + 0.5, ((i / GW) | 0) + 0.5]);
      const list = ups[i];
      if (!list || !list.length) break;
      let best = -1;
      let bestF = -1;
      for (const u of list) {
        if (!allowUsed && used[u]) continue;
        if (flux[u] > bestF) { bestF = flux[u]; best = u; }
      }
      if (best < 0) break;
      i = best;
    }
    pts.reverse();
    return pts;
  };

  for (const mouth of mouths) {
    if (lines.length >= 55) break;
    const pts = stem(mouth, false);
    if (pts.length < 12) continue;
    for (let k = 1; k < pts.length; k++) unwrapPoint(pts[k - 1], pts[k]);
    let smooth = pts;
    smooth = chaikin(smooth);
    smooth = chaikin(smooth);
    lines.push({ pts: smooth, flux: flux[mouth] });
  }
  return lines;
}

function traceHachures(elev, land) {
  const marks = [];
  const slopes = [];
  function at(x, y) {
    if (y < 0 || y >= GH) return null;
    if (x < 0) x += GW;
    if (x >= GW) x -= GW;
    return elev[y * GW + x];
  }
  for (let y = 2; y < GH - 2; y += 3) {
    for (let x = 0; x < GW; x += 3) {
      const i = y * GW + x;
      if (!land[i]) continue;
      const hL = at(x - 1, y), hR = at(x + 1, y);
      const hU = at(x, y - 1), hD = at(x, y + 1);
      const dx = (hL - hR) * 0.5;
      const dy = (hU - hD) * 0.5;
      const slope = Math.hypot(dx, dy);
      if (slope < 0.012) continue;
      if (elev[i] < seaLevel + 0.05) continue;
      slopes.push(slope);
      marks.push({ x: x + 0.5, y: y + 0.5, dx, dy, slope, h: elev[i] });
    }
  }
  if (!slopes.length) return [];
  slopes.sort((a, b) => a - b);
  const cut = slopes[Math.floor(slopes.length * 0.78)];
  return marks.filter((m) => m.slope >= cut && m.h > seaLevel + 0.12);
}

function measureChrome() {
  const bar = document.getElementById("bar");
  const top = document.getElementById("top");
  const near = document.getElementById("near");
  if (bar) barPx = bar.offsetHeight;
  if (top) topPx = top.offsetTop + top.offsetHeight + 10;
  if (near && top) near.style.top = (top.offsetTop + top.offsetHeight + 12) + "px";
  if (near) near.style.width = "252px";
  if (near && bar) {
    if (cssW >= 980) {
      near.style.bottom = (bar.offsetHeight + 12) + "px";
      near.style.maxHeight = "";
    } else {
      near.style.bottom = "auto";
      near.style.maxHeight = "62vh";
    }
  }
}

function viewBox() {
  const top = topPx;
  const side = 34;
  const near = document.getElementById("near");
  const right = side + (near && cssW >= 980 ? near.offsetWidth + 16 : 0);
  const bottom = barPx + 8;
  const vw = Math.max(40, cssW - side - right);
  const vh = Math.max(40, cssH - top - bottom);
  return { top, side, bottom, vw, vh, cx: side + vw / 2, cy: top + vh / 2 };
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  measureChrome();
  const box = viewBox();
  fitScale = Math.min((box.vw - 12) / WORLD_W, (box.vh - 8) / WORLD_H);
  draw();
}

function fitWorld() {
  scale = fitScale;
  camX = WORLD_W / 2;
  camY = WORLD_H / 2;
  draw();
}

function wrapX(x) {
  const m = ((x % WORLD_W) + WORLD_W) % WORLD_W;
  return m;
}

function clampCam() {
  const box = viewBox();
  const viewH = box.vh / scale;
  if (viewH >= WORLD_H) camY = WORLD_H / 2;
  else camY = Math.max(viewH / 2, Math.min(WORLD_H - viewH / 2, camY));
  camX = wrapX(camX);
}

function strokeLoop(line, style, widthPx) {
  if (line.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(line[0][0], line[0][1]);
  for (let i = 1; i < line.length; i++) ctx.lineTo(line[i][0], line[i][1]);
  ctx.strokeStyle = style;
  ctx.lineWidth = widthPx / scale;
  ctx.stroke();
}

function drawCopy() {
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(tone, 0, 0, WORLD_W, WORLD_H);
  if (realmCanvas) ctx.drawImage(realmCanvas, 0, 0, WORLD_W, WORLD_H);

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(92, 84, 72, 0.22)";
  ctx.lineWidth = 0.7 / scale;
  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    const x = (i / 12) * WORLD_W;
    ctx.moveTo(x, 0);
    ctx.lineTo(x, WORLD_H);
  }
  for (const t of [1 / 6, 1 / 3, 0.5, 2 / 3, 5 / 6]) {
    const y = t * WORLD_H;
    ctx.moveTo(0, y);
    ctx.lineTo(WORLD_W, y);
  }
  ctx.stroke();
  ctx.strokeStyle = "rgba(70, 62, 52, 0.38)";
  ctx.lineWidth = 0.9 / scale;
  ctx.beginPath();
  ctx.moveTo(0, WORLD_H / 2);
  ctx.lineTo(WORLD_W, WORLD_H / 2);
  ctx.stroke();

  for (let row = 3; row < GH; row += 7) {
    ctx.beginPath();
    let pen = false;
    for (let x = 0; x <= GW; x++) {
      const sx = x % GW;
      const sea = tone && sampleSea(sx, row);
      const yy = row + Math.sin((x + row) * 0.18) * 0.35;
      if (sea) {
        if (!pen) { ctx.moveTo(x, yy); pen = true; }
        else ctx.lineTo(x, yy);
      } else if (pen) {
        pen = false;
      }
    }
    ctx.strokeStyle = "rgba(130, 122, 108, 0.22)";
    ctx.lineWidth = 0.55 / scale;
    ctx.stroke();
  }

  for (const line of bathys) strokeLoop(line, "rgba(96, 90, 78, 0.45)", 0.8);
  for (const line of highlands) strokeLoop(line, "rgba(55, 48, 40, 0.4)", 0.7);

  const hachureZoom = Math.max(1, Math.min(2.4, scale / fitScale));
  ctx.strokeStyle = "rgba(28, 24, 20, 0.72)";
  for (const m of hachures) {
    const len = (1.3 + m.slope * 14) * (0.65 + 0.35 * Math.min(hachureZoom, 1.6));
    const mag = Math.hypot(m.dx, m.dy) || 1;
    const ux = m.dx / mag;
    const uy = m.dy / mag;
    ctx.lineWidth = 0.9 / scale;
    ctx.beginPath();
    ctx.moveTo(m.x - ux * len * 0.2, m.y - uy * len * 0.2);
    ctx.lineTo(m.x + ux * len, m.y + uy * len);
    ctx.stroke();
  }

  for (const river of rivers) {
    const showMinor = scale > fitScale * 2.2;
    if (!showMinor && river.flux < 28) continue;
    const pts = river.pts;
    if (pts.length < 2) continue;
    const mouth = Math.min(1.65, 0.55 + Math.log2(river.flux + 1) * 0.1);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = "rgba(16, 18, 22, 0.88)";
    ctx.lineWidth = mouth / scale;
    ctx.stroke();
  }

  for (const line of shores) strokeLoop(line, "rgba(40, 34, 28, 0.35)", 0.8);
  for (const line of coasts) strokeLoop(line, "rgba(18, 16, 14, 0.92)", 1.45);
  drawPlay();
}

function rngFrom(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function simIndex(x, y) {
  let xx = x % SW;
  if (xx < 0) xx += SW;
  if (y < 0 || y >= SH) return -1;
  return y * SW + xx;
}

function wrapDxSim(from, to) {
  let d = to - from;
  if (d > SW / 2) d -= SW;
  if (d < -SW / 2) d += SW;
  return d;
}

function dist2Sim(x, y, tx, ty) {
  const dx = wrapDxSim(x, tx);
  const dy = ty - y;
  return dx * dx + dy * dy;
}

function cellWorld(sx, sy) {
  return [((sx % SW) + SW) % SW * (GW / SW) + GW / SW * 0.5, sy * (GH / SH) + GH / SH * 0.5];
}

function worldToSim(x, y) {
  let xx = ((x % GW) + GW) % GW;
  const yy = Math.max(0, Math.min(GH - 1, y));
  return [(xx / (GW / SW)) | 0, Math.max(0, Math.min(SH - 1, (yy / (GH / SH)) | 0))];
}

function setupPlay() {
  simLand = new Uint8Array(SW * SH);

  const span = Math.max(0.2, maxElev - seaLevel);
  landTotal = 0;
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const gx = Math.min(GW - 1, (x + 0.5) * (GW / SW) | 0);
      const gy = Math.min(GH - 1, (y + 0.5) * (GH / SH) | 0);
      const e = elevField[gy * GW + gx];
      const land = e >= seaLevel;
      const i = y * SW + x;
      simLand[i] = land ? 1 : 0;
      if (!land) continue;
      landTotal++;
      const h = (e - seaLevel) / span;
      simCost[i] = h > 0.42 ? 4.4 : h > 0.22 ? 2.2 : 1;

function labelLand() {
  landComp = new Int16Array(SW * SH);
  landComp.fill(-1);
  compSize = [];
  for (let i = 0; i < SW * SH; i++) {
    if (!simLand[i] || landComp[i] >= 0) continue;
    const id = compSize.length;
    const stack = [i];
    landComp[i] = id;
    let n = 0;
    while (stack.length) {
      const c = stack.pop();
      n++;
      const x = c % SW;
      const y = (c / SW) | 0;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy;
        if (yy < 0 || yy >= SH) continue;
        for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          let xx = x + dx;
          if (xx < 0) xx += SW;
          else if (xx >= SW) xx -= SW;
          const j = yy * SW + xx;
          if (!simLand[j] || landComp[j] >= 0) continue;
          landComp[j] = id;
          stack.push(j);
        }
      }
    }
    compSize.push(n);
  }
  mainComp = 0;
  for (let c = 1; c < compSize.length; c++) if (compSize[c] > compSize[mainComp]) mainComp = c;
}

function pickStarts(n, rand) {

  }
  const spots = [];
  if (!pool.length || n < 1) return spots;
  const first = pool[(rand() * pool.length) | 0];
  spots.push([first % SW, (first / SW) | 0]);
  while (spots.length < n) {
    let best = null;
    let bestD = -1;
    for (let k = 0; k < 20; k++) {
      const c = pool[(rand() * pool.length) | 0];
      const x = c % SW;
      const y = (c / SW) | 0;
      let dmin = Infinity;
      for (let s = 0; s < spots.length; s++) {
        const dx = wrapDxSim(spots[s][0], x);
        const dy = spots[s][1] - y;
        const d = dx * dx + dy * dy;
        if (d < dmin) dmin = d;
      }
      if (dmin > bestD) { bestD = dmin; best = [x, y]; }
    }
    if (!best) break;
    spots.push(best);
  }
  return spots;
}

function fillBlob(sx, sy, radius, id) {
  for (let y = sy - radius; y <= sy + radius; y++) {
    if (y < 1 || y >= SH - 1) continue;
    for (let x = sx - radius; x <= sx + radius; x++) {
      const dx = x - sx;
      const dy = y - sy;
      if (dx * dx + dy * dy > radius * radius) continue;
      const xx = (x % SW + SW) % SW;
      const i = y * SW + xx;
      if (!simLand[i] || owner[i]) continue;
      owner[i] = id;
      soldiers[i] = 1.6;
      civilians[i] = 6;
    }
  }
}

function paintRealms() {
  if (!realmImg) return;
  const d = realmImg.data;
  for (let i = 0; i < SW * SH; i++) {
    const o = i * 4;
    const id = owner[i];
    if (!id) { d[o + 3] = 0; continue; }
    const c = COLORS[id] || [80, 80, 80];
    let amount = showLayer === "soldiers" ? soldiers[i] / 3.2
      : showLayer === "food" ? food[i] / Math.max(0.05, fertility[i] * 6)
      : civilians[i] / 6.5;
    if (showLayer === "people") {
      for (const realm of realms) {
        if (realm.id !== id) continue;
        for (const city of realm.cities) {
          if (city.sy * SW + ((city.sx % SW) + SW) % SW === i) amount += city.pop / 40;
        }
      }
    }
    const t = Math.max(0, Math.min(1, amount));
    d[o] = c[0];
    d[o + 1] = c[1];
    d[o + 2] = c[2];
    const span = showLayer === "food" ? 200 : (id === 1 ? 168 : 140);
    const floor = showLayer === "food" ? 0 : 18;
    d[o + 3] = floor + Math.round(t * span);
  }
  realmCtx.putImageData(realmImg, 0, 0);
  realmDirty = false;
}

function ordinal(n) {
  const teen = n % 100;
  if (teen >= 11 && teen <= 13) return n + "th";
  const d = n % 10;
  if (d === 1) return n + "st";
  if (d === 2) return n + "nd";
  if (d === 3) return n + "rd";
  return n + "th";
}

function recount() {
  landTotal = 0;
  const landN = new Uint32Array(Math.max(1, realms.length));
  const popN = new Float64Array(Math.max(1, realms.length));
  const armyN = new Float64Array(Math.max(1, realms.length));
  for (let i = 0; i < SW * SH; i++) {
    if (!simLand[i]) continue;
    landTotal++;
    const id = owner[i];
    if (!id) continue;
    landN[id - 1]++;
    popN[id - 1] += civilians[i];
    armyN[id - 1] += Math.max(0, soldiers[i] - TILE_SOLDIER_MIN);
  }
  if (boats) {
    for (let b = 0; b < boats.length; b++) {
      const id = boats[b].realmId;
      if (id >= 1 && id <= armyN.length) armyN[id - 1] += boats[b].soldiers;
    }
  }
  const army = armyN[0] || 0;
  for (let r = 0; r < realms.length; r++) {
    for (const city of realms[r].cities) popN[r] += cityHeads(city);
  }
  let allPop = 0;
  for (let r = 0; r < realms.length; r++) allPop += popN[r];
  const order = [];
  for (let r = 0; r < realms.length; r++) order.push(r);
  order.sort((a, b) => popN[b] - popN[a] || a - b);
  let rank = 1;
  for (let k = 0; k < order.length; k++) {
    if (order[k] === 0) { rank = k + 1; break; }
  }
  playerLand = landTotal ? (landN[0] || 0) / landTotal : 0;
  const pct = Math.round(playerLand * 1000) / 10;
  const youPop = popN[0] || 0;
  const popPct = allPop ? Math.round(youPop / allPop * 1000) / 10 : 0;
  seedLabel.textContent = "Hachuara · You " + pct + "% · " + ordinal(rank) + " · People " + popPct + "% · Seed " + SEED;
  const you = realms[0];
  const people = youPop;
  const popEl = document.getElementById("stat-pop");
  const milEl = document.getElementById("stat-mil");
  const goldEl = document.getElementById("stat-gold");
  if (popEl) popEl.textContent = "People " + Math.round(people);
  if (milEl) milEl.textContent = "Soldiers " + Math.round(army);
  if (goldEl) goldEl.textContent = "Gold " + Math.floor(you ? you.gold : 0);
  const deadEl = document.getElementById("stat-dead");
  if (deadEl) deadEl.textContent = "Lost " + Math.round(playerDeaths);
  const relEl = document.getElementById("relations");
  if (relEl) relEl.textContent = relationsText();
  fillNearby(landN, popN, allPop, armyN);
}

const NEAR_SHOW = 7;
let nearStamp = "";
let lastTouch = null;
let aggroX = 0;
let aggroY = 0;
let aggroRealm = 0;
let aggroHold = false;

function borderTouch() {
  const n = realms.length;
  const touch = new Array(n);
  for (let r = 0; r < n; r++) touch[r] = new Uint32Array(n + 1);
  for (let y = 0; y < SH; y++) {
    const base = y * SW;
    for (let x = 0; x < SW; x++) {
      const id = owner[base + x];
      if (!id || id > n) continue;
      const row = touch[id - 1];
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy;
        if (yy < 0 || yy >= SH) continue;
        const nb = yy * SW;
        for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          let xx = x + dx;
          if (xx < 0) xx += SW;
          else if (xx >= SW) xx -= SW;
          if (!simLand[nb + xx]) continue;
          const occ = owner[nb + xx];
          if (occ && occ !== id) row[occ]++;
        }
      }
    }
  }
  return touch;
}

function aggroPlace(realm, you, touchRow) {
  const mine = scoreAttack(realm, you, touchRow[you.id] || 0);
  let better = 0;
  let rivals = 0;
  for (let n = 0; n < realms.length; n++) {
    const other = realms[n];
    if (other.id === realm.id || !(other.tiles > 0)) continue;
    rivals++;
    if (other.id !== you.id && scoreAttack(realm, other, touchRow[other.id] || 0) > mine) better++;
  }
  return { score: mine, rank: better + 1, rivals };
}

function relationWith(realm, you) {
  if (atWar(you, realm)) return "War";
  if (isAlly(you, realm.id) || isAlly(realm, you.id)) return "Allied";
  return "Peace";
}

function fillNearby(landN, popN, allPop, armyN) {
  const el = document.getElementById("near-list");
  const you = realms[0];
  if (!el || !you) return;
  const touch = borderTouch();
  lastTouch = touch;
  const rows = [];
  for (let r = 0; r < realms.length; r++) {
    const realm = realms[r];
    const idx = realm.id - 1;
    if (realm.id === you.id || !(landN[idx] > 0)) continue;
    const dist = foeDistance(you, realm);
    const soldiers = armyN[idx] || 0;
    const theirs = touch[idx];
    const popPct = allPop ? Math.round((popN[idx] || 0) / allPop * 1000) / 10 : 0;
    const ag = aggroPlace(realm, you, theirs);
    rows.push({
      id: realm.id,
      dist,
      power: soldiers / (1 + dist),
      soldiers: Math.round(soldiers),
      popPct,
      rel: relationWith(realm, you),
      rank: ag.rank,
      rivals: ag.rivals,
      score: ag.score,
    });
  }
  rows.sort((a, b) => b.power - a.power || b.soldiers - a.soldiers || a.dist - b.dist || a.id - b.id);
  if (rows.length > NEAR_SHOW) rows.length = NEAR_SHOW;
  let stamp = "";
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    stamp += row.id + "|" + row.soldiers + "|" + row.popPct + "|" + row.rel + "|" + row.rank + "|" + row.rivals + "|" + row.score.toFixed(1) + "|" + row.power.toFixed(2) + ";";
  }
  if (!stamp) stamp = "none";
  if (stamp === nearStamp) return;
  nearStamp = stamp;
  if (!rows.length) {
    el.textContent = "No other realm.";
    aggroRealm = 0;
    hideAggroTip();
    return;
  }
  let html = "";
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const c = COLORS[row.id] || [80, 80, 80];
    const live = row.score > -1e8;
    const rankText = live ? (ordinal(row.rank) + " of " + row.rivals) : "—";
    const aggroText = live ? row.score.toFixed(1) : "—";
    html += "<div class=\"near-row\" data-realm=\"" + row.id + "\">";
    html += "<div class=\"near-top\">";
    html += "<span class=\"near-swatch\" style=\"background:rgb(" + c[0] + "," + c[1] + "," + c[2] + ")\"></span>";
    html += "<span class=\"near-name\">" + crownCalled(row.id) + "</span>";
    html += "<span class=\"near-rel\">" + row.rel + "</span>";
    html += "</div>";
    html += "<div class=\"near-meta\"><span>" + row.soldiers + " soldiers</span><span>" + row.popPct + "% people</span></div>";
    html += "<div class=\"near-aggro\"><span>your rank</span><span>" + rankText + "</span><span>aggro " + aggroText + "</span></div>";
    html += "</div>";
  }
  el.innerHTML = html;
  restoreAggroTip();
}

function neighborsOf(x, y) {
  const out = [];
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const yy = y + dy;
      if (yy < 0 || yy >= SH) continue;
      let xx = x + dx;
      if (xx < 0) xx += SW;
      if (xx >= SW) xx -= SW;
      out.push([xx, yy, yy * SW + xx]);
    }
  }
  return out;
}

function markBattle(tile, loss) {
  if (!battle || tile < 0 || tile >= battle.length) return;
  battle[tile] = 1;
  const city = cityOn(tile);
  if (!city) return;
  const incoming = fightPace * Math.min(0.035, 0.01 + Math.max(0, loss || 0) * 0.015);
  const dmg = city.destruction || 0;
  city.destruction = Math.min(1, dmg + incoming * (1 - dmg));
}

function routTile(tile) {
  const x = tile % SW;
  const y = (tile / SW) | 0;
  const id = owner[tile];
  let dest = -1;
  let best = Infinity;
  if (id) {
    for (const nb of neighborsOf(x, y)) {
      if (!simLand[nb[2]] || owner[nb[2]] !== id) continue;
      const pressure = battle[nb[2]] + (aggro[nb[2]] || 0) * 0.02;
      if (pressure < best) { best = pressure; dest = nb[2]; }
    }
  }
  const loose = civilians[tile];
  if (loose > 0.08) {
    const flee = Math.min(loose, loose * 0.028 * fightPace);
    const live = flee * 0.9;
    civilians[tile] -= flee;
    if (dest >= 0) civilians[dest] += live;
    else civilians[tile] += live;
  }
  const city = cityOn(tile);
  if (!city || city.pop <= 0.08) return;
  const flee = Math.min(city.pop, city.pop * 0.028 * fightPace);
  const live = flee * 0.9;
  city.pop -= flee;
  if (dest >= 0) civilians[dest] += live;
  else city.pop += live;
}

function harmBattles() {
  if (!battle) return;
  for (let i = 0; i < battle.length; i++) {
    if (battle[i] <= 0) continue;
    routTile(i);
    battle[i] = Math.max(0, battle[i] - 0.16);
  }
}

function simStep() {
  simTime += SIM_DT;
  for (const realm of realms) {
    decayOrders(realm.soldierOrders);
    decayOrders(realm.civilOrders);
  }
  decayAggro();
  updateCentroids();
  marchTargets();
  refreshSources();
  flowSoldiers();
  formBoats();
  moveBoats();
  balanceSoldiers();
  autoConquer();
  keepMarks();
  refreshRelations();
  claimLand();
  advanceFinished();
  placeAutoAttacks();
  balanceCivilians();
  flowCivilians();
  driftToCities();
  harmBattles();
  growRealms();
  maintainRoads();
  moveGold();
  paintRealms();
  watchStuckOrders();
  aiCool -= 0.12;
  if (aiCool <= 0) {
    aiThink();
    aiCool = 1.2;
  }
  for (let i = fights.length - 1; i >= 0; i--) {
    fights[i].life -= 0.12;
    if (fights[i].life <= 0) fights.splice(i, 1);
  }
  recount();
}

function updateCentroids() {
  const sx = new Float64Array(realms.length);
  const sy = new Float64Array(realms.length);
  const n = new Uint32Array(realms.length);
  for (let i = 0; i < SW * SH; i++) {
    const id = owner[i];
    if (!id) continue;
    sx[id - 1] += i % SW;
    sy[id - 1] += (i / SW) | 0;
    n[id - 1]++;
  }
  for (let r = 0; r < realms.length; r++) {
    if (!n[r]) continue;
    realms[r].cx = sx[r] / n[r];
    realms[r].cy = sy[r] / n[r];
  }
}

function closeRegion(id, tx, ty) {
  let bx = -1;
  let by = -1;
  let bestD = Infinity;
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      if (owner[y * SW + x] !== id) continue;
      const d = dist2Sim(x, y, tx, ty);
      if (d < bestD) { bestD = d; bx = x; by = y; }
    }
  }
  if (bx < 0) return null;
  const mask = new Uint8Array(SW * SH);
  const q = [[bx, by]];
  mask[by * SW + bx] = 1;
  let qi = 0;
  let sox = 0;
  let soy = 0;
  let sn = 0;
  const reach = 10 * 10;
  while (qi < q.length) {
    const [x, y] = q[qi++];
    sox += wrapDxSim(bx, x);
    soy += y - by;
    sn++;
    for (const nb of neighborsOf(x, y)) {
      if (owner[nb[2]] !== id || mask[nb[2]]) continue;
      if (dist2Sim(nb[0], nb[1], bx, by) > reach) continue;
      mask[nb[2]] = 1;
      q.push([nb[0], nb[1]]);
    }
  }
  let ox = Math.round(bx + sox / sn);
  let oy = Math.round(by + soy / sn);
  ox = (ox % SW + SW) % SW;
  oy = Math.max(0, Math.min(SH - 1, oy));
  if (owner[oy * SW + ox] !== id) { ox = bx; oy = by; }
  return { ox, oy, mask };
}

function orderTileKey(order) {
  const x = (Math.round(order.sx) % SW + SW) % SW;
  const y = Math.max(0, Math.min(SH - 1, Math.round(order.sy)));
  return y * SW + x;
}

function decayOrders(list) {
  if (!list.length) return;
  const seen = new Set();
  for (let i = 0; i < list.length; i++) {
    if (list[i].auto || list[i].kind) continue;
    seen.add(orderTileKey(list[i]));
  }
  if (!seen.size) return;
  const loss = SIM_DT * seen.size;
  for (let i = list.length - 1; i >= 0; i--) {
    const order = list[i];
    if (order.auto || order.kind) continue;
    order.life -= loss;
    if (order.life > 0) continue;
    while (order.life <= 0) {
      order.strength -= 1;
      if (order.strength <= 0) break;
      order.life += orderLife;
    }
    if (order.strength <= 0) list.splice(i, 1);
  }
}

function pullReach(strength) {
  return 8 + strength * 7;
}

const WAR_REACH = 64;
const HOME_CLOSE = 12;

function enemyNearPoint(realm, x, y, rad2) {
  const r = Math.ceil(Math.sqrt(rad2));
  const x0 = x | 0;
  const y0 = y | 0;
  for (let dy = -r; dy <= r; dy++) {
    const yy = y0 + dy;
    if (yy < 0 || yy >= SH) continue;
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > rad2) continue;
      let xx = x0 + dx;
      if (xx < 0) xx += SW;
      else if (xx >= SW) xx -= SW;
      const i = yy * SW + xx;
      if (!simLand[i]) continue;
      const occ = owner[i];
      if (!occ || occ === realm.id) continue;
      if (realm.ai && isAlly(realm, occ)) continue;
      return true;
    }
  }
  return false;
}

function homeWithoutEnemy(realm, sx, sy) {
  const cell = orderCell({ sx: sx, sy: sy });
  if (!simLand[cell[2]] || owner[cell[2]] !== realm.id) return false;
  return !enemyNearPoint(realm, cell[0], cell[1], HOME_CLOSE * HOME_CLOSE);
}

function orderMarchReach(realm, order) {
  const reach = pullReach(order.strength);
  const cell = orderCell(order);
  const occ = owner[cell[2]];
  if (occ && occ !== realm.id && atWar(realm, realms[occ - 1])) return Math.max(reach, WAR_REACH);
  if (occ === realm.id) return Math.max(reach, HOME_CLOSE);
  if (landComp && simLand[cell[2]] && landComp[cell[2]] !== homeComp(realm)) return Math.max(reach, 160);
  return reach;
}

function orderOnTile(list, sx, sy) {
  for (let i = 0; i < list.length; i++) {
    if (orderTileKey(list[i]) === sy * SW + sx) return list[i];
  }
  return null;
}

const ROAD_MOVE_BONUS = 2.4;
const ROAD_MAX_SPEED = 1 + ROAD_MOVE_BONUS;

function tileMove(i) {
  const road = 1 + (roadLevel[i] || 0) * ROAD_MOVE_BONUS;
  if (!simLand[i]) return ROAD_WATER_SPEED * road;
  const terrain = terrainMove ? terrainMove[i] : (moveBase[i] || 0.25);
  return (terrain || 0.25) * road;
}

function writeRoadLevel(i, level) {
  if (!(level > (roadLevel[i] || 0))) return;
  roadLevel[i] = level;
  if (terrainMove && simLand[i]) moveBase[i] = tileMove(i);
}

function stepRate(a, b) {
  const speed = Math.min(tileMove(a), tileMove(b));
  return Math.max(0.04, Math.min(ROAD_MAX_SPEED, speed));
}

function stampRivers() {
  for (const river of rivers) {
    const pts = river.pts;
    for (let p = 1; p < pts.length; p++) {
      const x0 = pts[p - 1][0];
      const y0 = pts[p - 1][1];
      const x1 = pts[p][0];
      const y1 = pts[p][1];
      const steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        let gx = x0 + (x1 - x0) * t;
        const gy = y0 + (y1 - y0) * t;
        gx = ((gx % GW) + GW) % GW;
        if (gy < 0 || gy >= GH) continue;
        const sx = Math.max(0, Math.min(SW - 1, (gx / (GW / SW)) | 0));
        const sy = Math.max(0, Math.min(SH - 1, (gy / (GH / SH)) | 0));
        const i = sy * SW + sx;
        if (simLand[i]) simRiver[i] = 1;
      }
    }
  }
}

function gatherSources(id, tx, ty, reach, field, minStack) {
  const r2 = reach * reach;
  const found = [];
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const i = y * SW + x;
      if (owner[i] !== id) continue;
      const d2 = dist2Sim(x, y, tx, ty);
      if (d2 > r2) continue;
      const stack = field[i];
      if (stack < minStack) continue;
      const score = stack / (d2 + 18);
      let placed = false;
      for (let k = 0; k < found.length; k++) {
        if (dist2Sim(x, y, found[k].x, found[k].y) >= 36) continue;
        if (score > found[k].score) {
          found[k] = { x, y, score };
          found.sort((a, b) => b.score - a.score);
        }
        placed = true;
        break;
      }
      if (placed) continue;
      if (found.length >= 3 && score <= found[found.length - 1].score) continue;
      found.push({ x, y, score });
      found.sort((a, b) => b.score - a.score);
      if (found.length > 3) found.pop();
    }
  }
  return found;
}

function refreshPull(order, id, field, minStack) {
  if (order.srcAt != null && simTime - order.srcAt < 3) return;
  order.srcAt = simTime;
  const reach = pullReach(order.strength);
  const sources = gatherSources(id, order.sx, order.sy, reach, field, minStack);
  if (!sources.length) {
    const src = closeRegion(id, order.sx, order.sy);
    if (src) {
      order.ox = src.ox;
      order.oy = src.oy;
      order.sources = [{ x: src.ox, y: src.oy }];
    }
    return;
  }
  order.sources = sources;
  let keep = null;
  for (let i = 0; i < sources.length; i++) {
    if (sources[i].x === order.ox && sources[i].y === order.oy) keep = sources[i];
  }
  const best = sources[0];
  if (!keep || keep.score < best.score * 0.75) {
    order.ox = best.x;
    order.oy = best.y;
  }
}

function refreshSources() {
  for (const realm of realms) {
    for (const order of realm.soldierOrders) refreshPull(order, realm.id, soldiers, 0.45);
    for (const order of realm.civilOrders) refreshPull(order, realm.id, civilians, 0.8);
  }
}

function orderCell(order) {
  const x = (Math.round(order.sx) % SW + SW) % SW;
  const y = Math.max(0, Math.min(SH - 1, Math.round(order.sy)));
  return [x, y, y * SW + x];
}

function stampAim(realm, order) {
  const cell = orderCell(order);
  if (!simLand[cell[2]]) {
    order.aim = "sea";
    order.foe = 0;
    order.mark = -1;
    return;
  }
  const occ = owner[cell[2]];
  if (order.kind === "spread" || order.kind === "spread2" || order.kind === "sail") {
    order.aim = "open";
    order.foe = 0;
    order.mark = 0;
    return;
  }
  if (order.kind === "attack" && order.mark > 0 && (!occ || occ === realm.id)) {
    order.aim = "enemy";
    order.foe = order.mark;
    return;
  }
  if (occ && occ !== realm.id) {
    order.aim = "enemy";
    order.foe = occ;
    order.mark = occ;
    return;
  }
  if (!occ) {
    order.aim = "open";
    order.foe = 0;
    order.mark = 0;
    return;
  }
  order.aim = "own";
  order.foe = 0;
  order.mark = -2;
}

function refreshAim(realm, order) {
  if (order.mark == null) stampAim(realm, order);
}

function tileIsMark(realm, order, cell) {
  const land = !!(cell && simLand[cell[2]]);
  const occ = land ? owner[cell[2]] : 0;
  if (order.mark === -1) return !land;
  if (order.mark === -2) return land && occ === realm.id;
  if (order.mark > 0) return land && occ === order.mark;
  return land && !occ;
}

function marchTargets() {
  for (let r = 0; r < realms.length; r++) {
    const realm = realms[r];
    for (let k = 0; k < realm.soldierOrders.length; k++) refreshAim(realm, realm.soldierOrders[k]);
  }
}

function stepFinishedOrder(realm, order) {
  if (order.mark == null) stampAim(realm, order);
  const cell = orderCell(order);
  if (tileIsMark(realm, order, cell)) return false;
  const ox = order.ox != null ? order.ox : realm.cx;
  const oy = order.oy != null ? order.oy : realm.cy;
  let dx = wrapDxSim(ox, cell[0]);
  let dy = cell[1] - oy;
  let mag = Math.hypot(dx, dy);
  if (mag < 1) {
    dx = wrapDxSim(realm.cx, cell[0]);
    dy = cell[1] - realm.cy;
    mag = Math.hypot(dx, dy) || 1;
  }
  let best = null;
  let bestScore = -Infinity;
  const nbs = neighborsOf(cell[0], cell[1]);
  for (let n = 0; n < nbs.length; n++) {
    const nb = nbs[n];
    if (!tileIsMark(realm, order, nb)) continue;
    const align = (wrapDxSim(cell[0], nb[0]) * dx + (nb[1] - cell[1]) * dy) / mag;
    if (align > bestScore) { bestScore = align; best = nb; }
  }
  const chase = order.mark > 0;
  const open = order.mark === 0;
  if (!best && chase) {
    for (let s = 2; s <= 4 && !best; s++) {
      const ix = (Math.round(cell[0] + (dx / mag) * s) % SW + SW) % SW;
      const iy = Math.max(0, Math.min(SH - 1, Math.round(cell[1] + (dy / mag) * s)));
      const i = iy * SW + ix;
      if (!simLand[i]) break;
      const occ = owner[i];
      if (occ === order.mark) { best = [ix, iy, i]; bestScore = 1; break; }
      if (occ && occ !== realm.id) break;
    }
  }
  if (open && (!best || bestScore < -0.2)) {
    for (let s = 2; s <= 4 && (!best || bestScore < -0.2); s++) {
      const ix = (Math.round(cell[0] + (dx / mag) * s) % SW + SW) % SW;
      const iy = Math.max(0, Math.min(SH - 1, Math.round(cell[1] + (dy / mag) * s)));
      const i = iy * SW + ix;
      if (!simLand[i]) break;
      if (owner[i]) break;
      best = [ix, iy, i];
      bestScore = 1;
      break;
    }
  }
  if (!best || (open && bestScore < -0.2)) {
    const saved = rescueMark(realm, order, cell);
    if (!saved) return true;
    best = saved;
  }
  order.srcAt = null;
  order.sx = best[0];
  order.sy = best[1];
  return false;
}

function rescueMark(realm, order, cell) {
  const rad = 14;
  const rad2 = rad * rad;
  let best = null;
  let bestD = rad2 + 1;
  for (let dy = -rad; dy <= rad; dy++) {
    const yy = cell[1] + dy;
    if (yy < 0 || yy >= SH) continue;
    for (let dx = -rad; dx <= rad; dx++) {
      const d2 = dx * dx + dy * dy;
      if (!d2 || d2 > rad2 || d2 >= bestD) continue;
      let xx = cell[0] + dx;
      if (xx < 0) xx += SW;
      else if (xx >= SW) xx -= SW;
      const i = yy * SW + xx;
      const spot = [xx, yy, i];
      if (!tileIsMark(realm, order, spot)) continue;
      if (order.mark !== -1 && order.mark !== -2) {
        let touchUs = false;
        for (let sy = -1; sy <= 1 && !touchUs; sy++) {
          const y2 = yy + sy;
          if (y2 < 0 || y2 >= SH) continue;
          for (let sx = -1; sx <= 1; sx++) {
            if (!sx && !sy) continue;
            let x2 = xx + sx;
            if (x2 < 0) x2 += SW;
            else if (x2 >= SW) x2 -= SW;
            const j = y2 * SW + x2;
            if (simLand[j] && owner[j] === realm.id) { touchUs = true; break; }
          }
        }
        if (!touchUs) continue;
      }
      bestD = d2;
      best = spot;
    }
  }
  return best;
}

function keepMarks() {
  for (let r = 0; r < realms.length; r++) {
    const realm = realms[r];
    for (let k = realm.soldierOrders.length - 1; k >= 0; k--) {
      if (stepFinishedOrder(realm, realm.soldierOrders[k])) realm.soldierOrders.splice(k, 1);
    }
  }
}

function advanceFinished() {
  keepMarks();
  for (let r = 0; r < realms.length; r++) {
    const realm = realms[r];
    for (let k = realm.soldierOrders.length - 1; k >= 0; k--) {
      const order = realm.soldierOrders[k];
      if (order.kind || order.aim === "sea" || order.defend) continue;
      if (homeWithoutEnemy(realm, order.sx, order.sy)) realm.soldierOrders.splice(k, 1);
    }
  }
}

const AUTO_CAP = 5;
const AUTO_CITY_REACH = 16;
const DEFEND_CAP = 3;
const DEFEND_CLOSE = 16;

function ownNeighborCount(id, x, y) {
  let n = 0;
  for (let dy = -1; dy <= 1; dy++) {
    const yy = y + dy;
    if (yy < 0 || yy >= SH) continue;
    for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      let xx = x + dx;
      if (xx < 0) xx += SW;
      else if (xx >= SW) xx -= SW;
      const i = yy * SW + xx;
      if (simLand[i] && owner[i] === id) n++;
    }
  }
  return n;
}

function ownSurround(id, x, y) {
  let n = 0;
  for (let dy = -2; dy <= 2; dy++) {
    const yy = y + dy;
    if (yy < 0 || yy >= SH) continue;
    for (let dx = -2; dx <= 2; dx++) {
      if (!dx && !dy) continue;
      let xx = x + dx;
      if (xx < 0) xx += SW;
      else if (xx >= SW) xx -= SW;
      const i = yy * SW + xx;
      if (simLand[i] && owner[i] === id) n++;
    }
  }
  return n;
}

function cityAttackPull(x, y) {
  let best = 0;
  const reach = AUTO_CITY_REACH;
  const reach2 = reach * reach;
  for (let r = 0; r < realms.length; r++) {
    const cities = realms[r].cities;
    for (let c = 0; c < cities.length; c++) {
      const city = cities[c];
      const d2 = dist2Sim(x, y, city.sx, city.sy);
      if (d2 > reach2) continue;
      const close = 1 - Math.sqrt(d2) / reach;
      const pull = cityHeads(city) * close * close * 8;
      if (pull > best) best = pull;
    }
  }
  return best;
}

function autoSpotScore(realm, x, y) {
  const i = y * SW + x;
  const ring = ownSurround(realm.id, x, y);
  const ownN = ownNeighborCount(realm.id, x, y);
  let score = ring * ring + ownN * 6 + cityAttackPull(x, y) - simCost[i] * 0.6 - soldiers[i] * 0.5;
  if (cityOn(i)) score -= 6;
  if (owner[i]) score += 1000;
  return score;
}

function autoBorderTile(realm, x, y, open, allowEmpty) {
  const i = y * SW + x;
  if (!simLand[i]) return 0;
  const occ = owner[i];
  if (occ === realm.id) return 0;
  if (!occ) return allowEmpty ? ownNeighborCount(realm.id, x, y) : 0;
  if (!open[occ]) return 0;
  return ownNeighborCount(realm.id, x, y);
}

function placeAutoAttacks() {
  for (let r = 0; r < realms.length; r++) {
    placeRealmAutos(realms[r], realms[r].id === 1);
    placeCityDefense(realms[r]);
  }
}

function placeRealmAutos(realm, allowEmpty) {
  if (!realm) return;
  const open = new Uint8Array(realms.length + 1);
  let anyWar = false;
  for (let i = 0; i < realms.length; i++) {
    const other = realms[i];
    if (other.id === realm.id || !atWar(realm, other)) continue;
    open[other.id] = 1;
    anyWar = true;
  }
  const orders = realm.soldierOrders;
  if (!anyWar && !allowEmpty) {
    for (let k = orders.length - 1; k >= 0; k--) {
      if (orders[k].auto) orders.splice(k, 1);
    }
    return;
  }
  for (let k = orders.length - 1; k >= 0; k--) {
    const order = orders[k];
    if (!order.auto || order.defend) continue;
    const cell = orderCell(order);
    if (!autoBorderTile(realm, cell[0], cell[1], open, allowEmpty)) orders.splice(k, 1);
  }
  const cands = [];
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const ownN = autoBorderTile(realm, x, y, open, allowEmpty);
      if (!ownN) continue;
      const score = autoSpotScore(realm, x, y);
      cands.push({ x, y, score });
    }
  }
  let have = 0;
  let enemyAutos = 0;
  const taken = [];
  for (let i = 0; i < orders.length; i++) {
    if (!orders[i].auto || orders[i].defend) continue;
    have++;
    const cell = orderCell(orders[i]);
    taken.push(cell);
    const occ = owner[cell[2]];
    if (occ && occ !== realm.id) enemyAutos++;
  }
  if (anyWar && enemyAutos < AUTO_CAP) {
    for (let k = orders.length - 1; k >= 0 && have >= AUTO_CAP; k--) {
      if (!orders[k].auto || orders[k].defend) continue;
      const cell = orderCell(orders[k]);
      const occ = owner[cell[2]];
      if (occ && occ !== realm.id) continue;
      orders.splice(k, 1);
      have--;
      for (let t = taken.length - 1; t >= 0; t--) {
        if (taken[t][0] === cell[0] && taken[t][1] === cell[1]) { taken.splice(t, 1); break; }
      }
    }
  }
  if (!cands.length) return;
  cands.sort((a, b) => b.score - a.score);
  if (have > 0) {
    let worstI = -1;
    let worstScore = Infinity;
    for (let i = 0; i < orders.length; i++) {
      const order = orders[i];
      if (!order.auto || order.defend) continue;
      const cell = orderCell(order);
      const score = autoSpotScore(realm, cell[0], cell[1]);
      if (score < worstScore) { worstScore = score; worstI = i; }
    }
    if (worstI >= 0) {
      const worst = orders[worstI];
      const worstCell = orderCell(worst);
      let pick = null;
      for (let c = 0; c < cands.length; c++) {
        const spot = cands[c];
        if (spot.score < worstScore + 80) break;
        if (spot.x === worstCell[0] && spot.y === worstCell[1]) continue;
        let near = false;
        for (let t = 0; t < taken.length; t++) {
          if (taken[t][0] === worstCell[0] && taken[t][1] === worstCell[1]) continue;
          if (dist2Sim(spot.x, spot.y, taken[t][0], taken[t][1]) < 4) { near = true; break; }
        }
        if (near) continue;
        pick = spot;
        break;
      }
      if (pick) {
        worst.srcAt = null;
        worst.sx = pick.x;
        worst.sy = pick.y;
        stampAim(realm, worst);
        for (let t = 0; t < taken.length; t++) {
          if (taken[t][0] === worstCell[0] && taken[t][1] === worstCell[1]) {
            taken[t] = [pick.x, pick.y];
            break;
          }
        }
      }
    }
  }
  if (have >= AUTO_CAP) return;
  const gaps = [4];
  for (let g = 0; g < gaps.length && have < AUTO_CAP; g++) {
    const min2 = gaps[g];
    for (let c = 0; c < cands.length && have < AUTO_CAP; c++) {
      const spot = cands[c];
      let near = false;
      for (let t = 0; t < taken.length; t++) {
        if (dist2Sim(spot.x, spot.y, taken[t][0], taken[t][1]) < min2) { near = true; break; }
      }
      if (near) continue;
      let covered = false;
      for (let i = 0; i < orders.length; i++) {
        if (orders[i].auto) continue;
        const cell = orderCell(orders[i]);
        if (cell[0] === spot.x && cell[1] === spot.y) { covered = true; break; }
      }
      if (covered) continue;
      const src = closeRegion(realm.id, spot.x, spot.y);
      const made = {
        sx: spot.x, sy: spot.y, life: orderLife, strength: 3, auto: true,
        ox: src ? src.ox : realm.cx, oy: src ? src.oy : realm.cy,
        mask: src ? src.mask : null,
      };
      stampAim(realm, made);
      orders.push(made);
      taken.push([spot.x, spot.y]);
      have++;
    }
  }
}

function warCloseTo(x, y, open) {
  const r = DEFEND_CLOSE;
  const r2 = r * r;
  let best = r2 + 1;
  const x0 = x | 0;
  const y0 = y | 0;
  for (let dy = -r; dy <= r; dy++) {
    const yy = y0 + dy;
    if (yy < 0 || yy >= SH) continue;
    for (let dx = -r; dx <= r; dx++) {
      const d2 = dx * dx + dy * dy;
      if (d2 > r2 || d2 >= best) continue;
      let xx = x0 + dx;
      if (xx < 0) xx += SW;
      else if (xx >= SW) xx -= SW;
      const i = yy * SW + xx;
      if (!simLand[i] || !open[owner[i]]) continue;
      best = d2;
    }
  }
  if (boats) {
    for (let b = 0; b < boats.length; b++) {
      const boat = boats[b];
      if (!open[boat.realmId]) continue;
      const d2 = dist2Sim(boat.x, boat.y, x, y);
      if (d2 <= r2 && d2 < best) best = d2;
    }
  }
  return best <= r2 ? best : Infinity;
}

function placeCityDefense(realm) {
  if (!realm) return;
  const orders = realm.soldierOrders;
  const open = new Uint8Array(realms.length + 1);
  let anyWar = false;
  for (let i = 0; i < realms.length; i++) {
    const other = realms[i];
    if (other.id === realm.id || !atWar(realm, other)) continue;
    open[other.id] = 1;
    anyWar = true;
  }
  if (!anyWar) {
    for (let k = orders.length - 1; k >= 0; k--) {
      if (orders[k].defend) orders.splice(k, 1);
    }
    return;
  }
  const threatened = [];
  for (let c = 0; c < realm.cities.length; c++) {
    const city = realm.cities[c];
    const cell = cityCell(city);
    if (owner[cell] !== realm.id) continue;
    const near = warCloseTo(city.sx, city.sy, open);
    if (near === Infinity) continue;
    let score = DEFEND_CLOSE * DEFEND_CLOSE - near + (city.capital ? 40 : 0) + cityHeads(city) * 0.15;
    threatened.push({ city, cell, score });
  }
  threatened.sort((a, b) => b.score - a.score);
  if (threatened.length > DEFEND_CAP) threatened.length = DEFEND_CAP;
  for (let k = orders.length - 1; k >= 0; k--) {
    const order = orders[k];
    if (!order.defend) continue;
    const at = orderCell(order)[2];
    let still = false;
    for (let i = 0; i < threatened.length; i++) {
      if (threatened[i].cell === at) { still = true; break; }
    }
    if (!still) orders.splice(k, 1);
  }
  for (let i = 0; i < threatened.length; i++) {
    const city = threatened[i].city;
    const cell = threatened[i].cell;
    let have = false;
    let covered = false;
    for (let k = 0; k < orders.length; k++) {
      if (orderCell(orders[k])[2] !== cell) continue;
      if (orders[k].defend) have = true;
      else covered = true;
    }
    if (have || covered) continue;
    const x = cell % SW;
    const y = (cell / SW) | 0;
    const src = closeRegion(realm.id, x, y);
    const made = {
      sx: x, sy: y, life: orderLife, strength: 3, auto: true, defend: true,
      ox: src ? src.ox : realm.cx, oy: src ? src.oy : realm.cy,
      mask: src ? src.mask : null,
    };
    stampAim(realm, made);
    orders.push(made);
  }
}

const VECTOR_CAP = 3;

function wantsVectors(order) {
  return !!order && order.kind !== "sail";
}

function touchesRealm(id, x, y) {
  const nbs = neighborsOf(x, y);
  for (let i = 0; i < nbs.length; i++) {
    if (simLand[nbs[i][2]] && owner[nbs[i][2]] === id) return true;
  }
  return false;
}

function keepVector(list, item) {
  for (let i = 0; i < list.length; i++) {
    if (dist2Sim(list[i].x, list[i].y, item.x, item.y) >= 9) continue;
    if (item.score > list[i].score) list[i] = item;
    return;
  }
  if (list.length < VECTOR_CAP) {
    list.push(item);
    return;
  }
  let worst = 0;
  for (let i = 1; i < list.length; i++) if (list[i].score < list[worst].score) worst = i;
  if (item.score > list[worst].score) list[worst] = item;
}

function refreshVectors(realm) {
  const orders = realm.soldierOrders;
  for (let k = 0; k < orders.length; k++) {
    const order = orders[k];
    if (!wantsVectors(order)) {
      order.vectors = null;
      continue;
    }
    if (order.mark == null) stampAim(realm, order);
    if (order.mark > 0 && !atWar(realm, realms[order.mark - 1])) {
      order.vectors = null;
      continue;
    }
    const cell = orderCell(order);
    const list = [];
    const r = HOME_CLOSE;
    const r2 = r * r;
    const x0 = cell[0];
    const y0 = cell[1];
    for (let dy = -r; dy <= r; dy++) {
      const yy = y0 + dy;
      if (yy < 0 || yy >= SH) continue;
      for (let dx = -r; dx <= r; dx++) {
        const d2 = dx * dx + dy * dy;
        if (!d2 || d2 > r2) continue;
        let xx = x0 + dx;
        if (xx < 0) xx += SW;
        else if (xx >= SW) xx -= SW;
        const i = yy * SW + xx;
        const spot = [xx, yy, i];
        if (!tileIsMark(realm, order, spot)) continue;
        if (order.mark !== -1 && !touchesRealm(realm.id, xx, yy)) continue;
        let touch = 0;
        const nbs = neighborsOf(xx, yy);
        for (let n = 0; n < nbs.length; n++) if (owner[nbs[n][2]] === realm.id) touch++;
        const men = simLand[i] ? soldiers[i] : 0;
        keepVector(list, { x: xx, y: yy, score: touch * 5 + (r2 - d2) * 0.02 - men * 0.25 });
      }
    }
    order.vectors = list.length ? list : null;
  }
}

function orderGoal(order, x, y) {
  const list = order.vectors;
  if (!list || !list.length) return [order.sx, order.sy];
  let best = list[0];
  let bestD = dist2Sim(x, y, best.x, best.y);
  for (let i = 1; i < list.length; i++) {
    const d = dist2Sim(x, y, list[i].x, list[i].y);
    if (d < bestD) { bestD = d; best = list[i]; }
  }
  return [best.x, best.y];
}

function vectorAim(order, x, y) {
  const list = order.vectors;
  if (!list) return 0;
  let bonus = 0;
  for (let i = 0; i < list.length; i++) {
    const d = dist2Sim(x, y, list[i].x, list[i].y);
    if (d <= 0.1) return 48;
    if (d <= 2) bonus = 20;
  }
  return bonus;
}

const ROUTE_NONE = 65535;
let routeQueue = null;

function warOpen(realm) {
  const open = new Uint8Array(realms.length + 1);
  for (let i = 0; i < realms.length; i++) {
    const other = realms[i];
    if (other.id !== realm.id && atWar(realm, other)) open[other.id] = 1;
  }
  return open;
}

function routeSkips(realm, order) {
  if (!order || order.kind === "sail" || order.aim === "sea" || order.defend) return true;
  const cell = orderCell(order);
  if (!simLand[cell[2]]) return true;
  if (landComp && landComp[cell[2]] !== homeComp(realm)) return true;
  return false;
}

function buildRoute(realm, order, open) {
  const n = SW * SH;
  if (!order.route || order.route.length !== n) order.route = new Uint16Array(n);
  const dist = order.route;
  dist.fill(ROUTE_NONE);
  const cell = orderCell(order);
  const goal = cell[2];
  const goalOwner = owner[goal];
  if (goalOwner && goalOwner !== realm.id && !open[goalOwner]) return false;
  if (!simLand[goal]) return false;
  if (!routeQueue || routeQueue.length !== n) routeQueue = new Int32Array(n);
  const q = routeQueue;
  let qh = 0;
  let qt = 0;
  dist[goal] = 0;
  q[qt++] = goal;
  let reached = goalOwner === realm.id;
  let routePull = 0;
  const allow = orderMarchReach(realm, order);
  const allow2 = allow * allow;
  const seeds = order.vectors;
  if (seeds) {
    for (let v = 0; v < seeds.length; v++) {
      const vx = (Math.round(seeds[v].x) % SW + SW) % SW;
      const vy = Math.max(0, Math.min(SH - 1, Math.round(seeds[v].y)));
      const vi = vy * SW + vx;
      if (!simLand[vi] || dist[vi] !== ROUTE_NONE) continue;
      const occ = owner[vi];
      if (occ && occ !== realm.id && !open[occ]) continue;
      dist[vi] = 0;
      if (occ === realm.id) reached = true;
      q[qt++] = vi;
    }
  }
  while (qh < qt) {
    const i = q[qh++];
    const x = i % SW;
    const y = (i / SW) | 0;
    const base = dist[i] + 1;
    if (base >= ROUTE_NONE) continue;
    for (let dy = -1; dy <= 1; dy++) {
      const yy = y + dy;
      if (yy < 0 || yy >= SH) continue;
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        let xx = x + dx;
        if (xx < 0) xx += SW;
        else if (xx >= SW) xx -= SW;
        const j = yy * SW + xx;
        if (dist[j] !== ROUTE_NONE || !simLand[j]) continue;
        const occ = owner[j];
        if (occ && occ !== realm.id && !open[occ]) continue;
        dist[j] = base;
        if (occ === realm.id) {
          reached = true;
          if (base > routePull && dist2Sim(xx, yy, cell[0], cell[1]) <= allow2) routePull = base;
        }
        q[qt++] = j;
      }
    }
  }
  order.routeKey = goal;
  order.routeAt = simTime;
  order.routePull = routePull;
  return reached;
}

function dropBlockedOrder(realm, orders, index) {
  const order = orders[index];
  if (realm.ai && !order.auto) {
    if (!realm.avoid) realm.avoid = [];
    realm.avoid.push({ x: order.sx, y: order.sy, until: simTime + 60 });
  }
  orders.splice(index, 1);
}

function flowSoldiers() {
  const openOf = new Array(realms.length + 1);
  for (let r = 0; r < realms.length; r++) {
    const realm = realms[r];
    refreshVectors(realm);
    const open = warOpen(realm);
    openOf[realm.id] = open;
    const orders = realm.soldierOrders;
    for (let k = orders.length - 1; k >= 0; k--) {
      const order = orders[k];
      if (routeSkips(realm, order)) { order.route = null; continue; }
      const cell = orderCell(order);
      if (order.route && order.routeKey === cell[2] && simTime - order.routeAt < 0.56) continue;
      if (!buildRoute(realm, order, open)) dropBlockedOrder(realm, orders, k);
    }
  }
  const next = new Float32Array(soldiers);
  for (const realm of realms) {
    if (!realm.soldierOrders.length) continue;
    const open = openOf[realm.id];
    for (let y = 0; y < SH; y++) {
      for (let x = 0; x < SW; x++) {
        const i = y * SW + x;
        const spare = soldiers[i] - TILE_SOLDIER_MIN;
        if (owner[i] !== realm.id || spare < 0.04) continue;
        let bestO = null;
        let bestS = 0;
        for (const order of realm.soldierOrders) {
          const reach = orderMarchReach(realm, order);
          const d2 = dist2Sim(x, y, order.sx, order.sy);
          let inPull = d2 <= reach * reach;
          if (!inPull && order.route) {
            const rd = order.route[i];
            if (rd !== ROUTE_NONE && order.routePull && rd <= order.routePull) inPull = true;
          }
          if (!inPull) continue;
          const s = order.strength / (d2 + 6);
          if (s > bestS) { bestS = s; bestO = order; }
        }
        if (!bestO) continue;
        let front = false;
        for (const nb of neighborsOf(x, y)) {
          const occ = owner[nb[2]];
          if (simLand[nb[2]] && occ && occ !== realm.id && open && open[occ]) { front = true; break; }
        }
        const route = bestO.route;
        const hereR = route ? route[i] : ROUTE_NONE;
        const goal = orderGoal(bestO, x, y);
        const goalX = goal[0];
        const goalY = goal[1];
        const here = dist2Sim(x, y, goalX, goalY);
        let best = -1;
        let bestScore = -Infinity;
        for (const nb of neighborsOf(x, y)) {
          if (!simLand[nb[2]] || owner[nb[2]] !== realm.id) continue;
          let score;
          if (route) {
            if (hereR === ROUTE_NONE) continue;
            const nbR = route[nb[2]];
            if (nbR === ROUTE_NONE || nbR >= hereR) continue;
            score = (hereR - nbR) * stepRate(i, nb[2]) - soldiers[nb[2]] * (front ? 0.85 : 0.22);
          } else {
            const progress = here - dist2Sim(nb[0], nb[1], goalX, goalY);
            if (progress <= 0) continue;
            score = progress * stepRate(i, nb[2]) - soldiers[nb[2]] * (front ? 0.85 : 0.22);
          }
          if (score > bestScore) { bestScore = score; best = nb[2]; }
        }
        if (best < 0) continue;
        const pace = (front ? 0.04 : 0.08) * movePace;
        const move = Math.min(spare, soldiers[i] * pace * bestO.strength * stepRate(i, best));
        next[i] -= move;
        next[best] += move;
      }
    }
  }
  soldiers.set(next);
}

function tileNeed(i, x, y, id) {
  let n = aggro[i] * 5;
  for (const nb of neighborsOf(x, y)) {
    if (!simLand[nb[2]]) continue;
    if (!owner[nb[2]]) n += 0.9;
    else if (owner[nb[2]] !== id) n += 2.1;
  }
  return n;
}

function decayAggro() {
  const next = new Float32Array(SW * SH);
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const i = y * SW + x;
      if (!simLand[i]) continue;
      let bleed = 0;
      for (const nb of neighborsOf(x, y)) bleed += aggro[nb[2]];
      const v = aggro[i] * 0.9 + bleed * 0.012;
      next[i] = v < 0.04 ? 0 : v;
    }
  }
  aggro.set(next);
}

function tilePulled(id, x, y) {
  const realm = realms[id - 1];
  if (!realm || !realm.soldierOrders.length) return false;
  for (let k = 0; k < realm.soldierOrders.length; k++) {
    const order = realm.soldierOrders[k];
    const reach = orderMarchReach(realm, order);
    if (dist2Sim(x, y, order.sx, order.sy) <= reach * reach) return true;
  }
  return false;
}

function nearestOrderDist(id, x, y) {
  const realm = realms[id - 1];
  if (!realm || !realm.soldierOrders.length) return null;
  let best = Infinity;
  for (let k = 0; k < realm.soldierOrders.length; k++) {
    const order = realm.soldierOrders[k];
    const goal = orderGoal(order, x, y);
    const d = dist2Sim(x, y, goal[0], goal[1]);
    if (d < best) best = d;
  }
  return best;
}

function foughtTile(i) {
  return !!(battle && battle[i] > 0.25);
}

function balanceSoldiers() {
  const need = new Float32Array(SW * SH);
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const i = y * SW + x;
      if (owner[i]) need[i] = tileNeed(i, x, y, owner[i]);
    }
  }
  const next = new Float32Array(soldiers);
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const i = y * SW + x;
      const spare = soldiers[i] - TILE_SOLDIER_MIN;
      if (!owner[i] || spare < 0.04) continue;
      const onFront = need[i] >= 0.9;
      if (onFront) {
        let poor = -1;
        let poorV = soldiers[i] - 0.18;
        for (const nb of neighborsOf(x, y)) {
          if (owner[nb[2]] !== owner[i] || need[nb[2]] < 0.9 || foughtTile(nb[2])) continue;
          if (soldiers[nb[2]] < poorV) { poorV = soldiers[nb[2]]; poor = nb[2]; }
        }
        if (poor >= 0) {
          const myD = nearestOrderDist(owner[i], x, y);
          const poorD = nearestOrderDist(owner[i], poor % SW, (poor / SW) | 0);
          const towardPush = myD != null && poorD != null && poorD < myD;
          if (myD == null || towardPush) {
            const move = Math.min(spare, (soldiers[i] - soldiers[poor]) * 0.2 * movePace * stepRate(i, poor));
            next[i] -= move;
            next[poor] += move;
          }
          continue;
        }
      } else {
        let thin = -1;
        let thinV = soldiers[i] - 0.25;
        for (const nb of neighborsOf(x, y)) {
          if (owner[nb[2]] !== owner[i] || need[nb[2]] < 0.9 || foughtTile(nb[2])) continue;
          if (soldiers[nb[2]] < thinV) { thinV = soldiers[nb[2]]; thin = nb[2]; }
        }
        if (thin >= 0) {
          const move = Math.min(spare, (soldiers[i] - soldiers[thin]) * 0.1 * movePace * stepRate(i, thin));
          next[i] -= move;
          next[thin] += move;
          continue;
        }
      }
      const idle = !tilePulled(owner[i], x, y);
      let best = -1;
      let bestN = need[i];
      const margin = idle ? 0.08 : 0.2;
      for (const nb of neighborsOf(x, y)) {
        if (owner[nb[2]] !== owner[i] || foughtTile(nb[2])) continue;
        if (need[nb[2]] > bestN + margin) { bestN = need[nb[2]]; best = nb[2]; }
      }
      if (best >= 0) {
        const move = Math.min(spare, soldiers[i] * (idle ? 0.05 : 0.03) * movePace * stepRate(i, best));
        next[i] -= move;
        next[best] += move;
        continue;
      }
      if (!idle) continue;
      let poor = -1;
      let poorV = soldiers[i] - 0.55;
      for (const nb of neighborsOf(x, y)) {
        if (owner[nb[2]] !== owner[i] || foughtTile(nb[2])) continue;
        if (soldiers[nb[2]] < poorV) { poorV = soldiers[nb[2]]; poor = nb[2]; }
      }
      if (poor < 0) continue;
