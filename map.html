    let keepAttack = false;
    for (let p = 0; p < prey.length; p++) {
      const row = prey[p];
      const easy = militaryRatio(realm, row.other) <= 0.62;
      const grudged = (realm.lostCities[row.other.id] || 0) > 0 || (row.other.tookFrom[realm.id] || 0) >= 0.5;
      const pressed = (contact[row.other.id] || 0) >= 4;
      if (opening && !easy && !grudged && !threatened && !pressed) continue;
      if (row.cool) continue;
      attackFoe = row.other;
      attackTile = row.tile;
      break;
    }
    if (!attackFoe) {
      for (let i = 0; i < realm.soldierOrders.length; i++) {
        const order = realm.soldierOrders[i];
        if (order.kind !== "attack" || !(order.mark > 0)) continue;
        for (let p = 0; p < prey.length; p++) {
          if (prey[p].other.id !== order.mark) continue;
          const easy = militaryRatio(realm, prey[p].other) <= 0.62;
          const grudged = (realm.lostCities[order.mark] || 0) > 0 || (prey[p].other.tookFrom[realm.id] || 0) >= 0.5;
          const pressed = (contact[order.mark] || 0) >= 4;
          if (opening && !easy && !grudged && !threatened && !pressed) continue;
          keepAttack = true;
          break;
        }
      }
    }
    let first = null;
    let second = null;
    for (let e = 0; e < emptyBest.length; e++) {
      const b = emptyBest[e];
      if (!first) { first = b; continue; }
      if (dist2Sim(b.x, b.y, first.x, first.y) >= 64) { second = b; break; }
    }
    const two = !!(second && !attackFoe);
    const keep = {};
    if (first) keep.spread = true;
    if (two) keep.spread2 = true;
    if (attackFoe || keepAttack) keep.attack = true;
    const sail = sailPlan(realm);
    if (sail) keep.sail = true;
    retainOrders(realm, keep);
    const spreadStrength = two ? 3 : 4;
    if (first) {
      const at = frontierStep(realm, first.x, first.y, 10, 0);
      if (!areaCool(realm, at[0], at[1])) ensureOrder(realm, "spread", at[0], at[1], spreadStrength);
    }
    if (two) {
      const at = frontierStep(realm, second.x, second.y, 10, 0);
      if (!areaCool(realm, at[0], at[1])) ensureOrder(realm, "spread2", at[0], at[1], spreadStrength);
    }
    if (sail && sail !== "keep") ensureOrder(realm, "sail", sail.x, sail.y, 4);
    if (attackFoe && attackTile) {
      const tile = attackTile;
      const city = nearestCity(attackFoe.id, tile[0], tile[1], 9);
      let ax = tile[0];
      let ay = tile[1];
      if (city && !areaCool(realm, city.sx, city.sy)) {
        ax = city.sx;
        ay = city.sy;
      } else {
        const deeper = frontierStep(realm, tile[0], tile[1], 6, 5);
        ax = deeper[0];
        ay = deeper[1];
      }
      if (!areaCool(realm, ax, ay)) ensureOrder(realm, "attack", ax, ay, 4);
    }
  }
  const you = realms[0];
  if (you && !you.ai) {
    const sail = sailPlan(you);
    if (sail && sail !== "keep") ensureOrder(you, "sail", sail.x, sail.y, 4);
  }
}

function orderNear(list, sx, sy, maxDist) {
  let best = null;
  let bestD = maxDist * maxDist;
  for (let i = 0; i < list.length; i++) {
    const d = dist2Sim(sx, sy, list[i].sx, list[i].sy);
    if (d <= bestD) { bestD = d; best = list[i]; }
  }
  return best;
}

function issueTarget(wx, wy) {
  const realm = realms[0];
  if (!realm) return;
  const hit = worldToSim(wx, wy);
  const city = nearestCity(1, hit[0], hit[1], TARGET_CLOSE);
  const sx = city ? city.sx : hit[0];
  const sy = city ? city.sy : hit[1];
  const existing = orderNear(realm.soldierOrders, hit[0], hit[1], TARGET_CLOSE);
  if (existing) {
    existing.auto = false;
    existing.defend = false;
    existing.life = orderLife;
    const onIt = (existing.sx === hit[0] && existing.sy === hit[1]) || (existing.sx === sx && existing.sy === sy);
    if (onIt) {
      if (homeWithoutEnemy(realm, existing.sx, existing.sy)) {
        const at = realm.soldierOrders.indexOf(existing);
        if (at >= 0) realm.soldierOrders.splice(at, 1);
      }
      return;
    }
    existing.srcAt = null;
    existing.sx = sx;
    existing.sy = sy;
    const src = closeRegion(1, sx, sy);
    if (src) {
      existing.ox = src.ox;
      existing.oy = src.oy;
      existing.mask = src.mask;
    }
    stampAim(realm, existing);
    if (homeWithoutEnemy(realm, existing.sx, existing.sy)) {
      const at = realm.soldierOrders.indexOf(existing);
      if (at >= 0) realm.soldierOrders.splice(at, 1);
    }
    return;
  }
  if (homeWithoutEnemy(realm, sx, sy)) return;
  const src = closeRegion(1, sx, sy);
  const made = {
    sx, sy, life: orderLife, strength: 1,
    ox: src ? src.ox : realm.cx, oy: src ? src.oy : realm.cy,
    mask: src ? src.mask : null,
  };
  stampAim(realm, made);
  realm.soldierOrders.push(made);
}

function issuePull(wx, wy) {
  const realm = realms[0];
  if (!realm) return;
  const hit = worldToSim(wx, wy);
  const city = nearestCity(1, hit[0], hit[1], TARGET_CLOSE);
  const sx = city ? city.sx : hit[0];
  const sy = city ? city.sy : hit[1];
  const existing = orderNear(realm.civilOrders, sx, sy, city ? 1.25 : TARGET_CLOSE);
  if (existing) {
    existing.life = orderLife;
    if (!payForPull(realm, sx, sy, 1)) return;
    existing.strength = Math.min(8, existing.strength + 1);
    if (city) {
      existing.srcAt = null;
      existing.sx = city.sx;
      existing.sy = city.sy;
    }
    return;
  }
  if (!payForPull(realm, sx, sy, 1)) return;
  const src = closeRegion(1, sx, sy);
  realm.civilOrders.push({
    sx, sy, life: orderLife, strength: 1,
    ox: src ? src.ox : sx, oy: src ? src.oy : sy,
  });
}

function setCommand(name) {
  command = command === name ? null : name;
  document.getElementById("target").classList.toggle("active", command === "target");
  document.getElementById("pull").classList.toggle("active", command === "pull");
  note.textContent = command === "target"
    ? "Click the map. Click a target to refresh its ebb. A nearby target moves to a new spot. A target on your own land attacks a nearby enemy, and is removed if none is close. A target you place inside another country puts both realms at war: both sides attack that border, and up to five automatic targets sit on land surrounded by yours or next to it. A target keeps the empty land or the nation it was first given. When the tile under it is no longer that, it moves to a close tile that still is, and it is removed when none is close. Click one of those and it becomes yours. Hold an existing target and the pull grows while you hold. Right-click a target, or keep holding the right button, and the pull shrinks until it is canceled. Strength ebbs on its own. Click the sea and the soldiers build boats."
    : command === "pull"
      ? "Click the map. A pull costs gold, which walks to the nearest city. Hold an existing pull and it grows while you hold. Right-click, or keep holding the right button, shrinks it until it is canceled. Strength ebbs on its own."
      : "WASD moves the map. Target sends soldiers. Pull gathers civilians.";
}

function drawBorders() {
  if (!showBorders || !owner || !simLand || !realms.length) return;
  const m = ctx.getTransform();
  if (!(m.a > 0) || !(m.d > 0)) return;
  const cw = GW / SW;
  const ch = GH / SH;
  const px = Math.max(2, Math.round(2 * (m.a / scale)));
  const ext = px + 2;
  const pad = 0.6;
  const rects = [];
  for (let id = 0; id <= realms.length; id++) rects.push([]);
  const invA = 1 / m.a;
  const invD = 1 / m.d;
  const push = (id, xA, yA, xB, yB) => {
    if (!id || xB <= xA || yB <= yA) return;
    rects[id].push((xA - m.e) * invA, (yA - m.f) * invD, (xB - xA) * invA, (yB - yA) * invD);
  };
  // side < 0 paints the low side of the edge. pad keeps the two colors overlapping by a device pixel.
  const addV = (id, edgeX, y0, y1, side) => {
    const col = Math.round(m.a * edgeX + m.e);
    const yA = Math.floor(m.d * y0 + m.f) - ext;
    const yB = Math.ceil(m.d * y1 + m.f) + ext;
    if (side < 0) push(id, col - px, yA, col + 1 + pad, yB);
    else push(id, col - pad, yA, col + px, yB);
  };
  const addH = (id, edgeY, x0, x1, side) => {
    const row = Math.round(m.d * edgeY + m.f);
    const xA = Math.floor(m.a * x0 + m.e) - ext;
    const xB = Math.ceil(m.a * x1 + m.e) + ext;
    if (side < 0) push(id, xA, row - px, xB, row + 1 + pad);
    else push(id, xA, row - pad, xB, row + px);
  };
  for (let y = 0; y < SH; y++) {
    const y0 = y * ch;
    const y1 = y0 + ch;
    for (let x = 0; x < SW; x++) {
      const i = y * SW + x;
      if (!simLand[i]) continue;
      const id = owner[i];
      if (!id) continue;
      const x0 = x * cw;
      const x1 = x0 + cw;
      const west = y * SW + (x + SW - 1) % SW;
      if (simLand[west] && owner[west] === 0) {
        addV(id, x0, y0, y1, 1);
        if (x0 <= 0) addV(id, WORLD_W, y0, y1, 1);
      }
      const east = y * SW + (x + 1) % SW;
      if (simLand[east] && owner[east] !== id) {
        const nid = owner[east];
        addV(id, x1, y0, y1, -1);
        if (nid) addV(nid, x1, y0, y1, 1);
        if (x1 >= WORLD_W) {
          addV(id, 0, y0, y1, -1);
          if (nid) addV(nid, 0, y0, y1, 1);
        }
      }
      if (y > 0) {
        const north = i - SW;
        if (simLand[north] && owner[north] === 0) addH(id, y0, x0, x1, 1);
      }
      if (y + 1 >= SH) continue;
      const south = i + SW;
      if (!simLand[south] || owner[south] === id) continue;
      const nid = owner[south];
      addH(id, y1, x0, x1, -1);
      if (nid) addH(nid, y1, x0, x1, 1);
    }
  }
  ctx.save();
  ctx.globalAlpha = 1;
  for (let id = 1; id < rects.length; id++) {
    const r = rects[id];
    if (!r.length) continue;
    const c = COLORS[id] || [70, 70, 70];
    ctx.beginPath();
    for (let k = 0; k < r.length; k += 4) ctx.rect(r[k], r[k + 1], r[k + 2], r[k + 3]);
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.fill();
  }
  ctx.restore();
}

function roadDrawRuns(cells, claimed) {
  const n = cells.length;
  const own = new Uint8Array(n);
  for (let k = 0; k < n; k++) {
    const i = cells[k];
    if (!claimed[i]) {
      own[k] = 1;
      claimed[i] = 1;
    }
  }
  const runs = [];
  let k = 0;
  while (k < n) {
    if (!own[k]) { k++; continue; }
    let b = k;
    while (b + 1 < n && own[b + 1]) b++;
    const a = k > 0 ? k - 1 : k;
    const c = b + 1 < n ? b + 1 : b;
    if (c > a) runs.push(cells.slice(a, c + 1));
    k = b + 1;
  }
  return runs;
}

function strokeRoadCells(cells, width) {
  if (!cells || cells.length < 2) return;
  const pts = [];
  for (let k = 0; k < cells.length; k++) {
    const i = cells[k];
    let [x, y] = cellWorld(i % SW, (i / SW) | 0);
    if (k > 0) {
      const dx = x - pts[k - 1][0];
      if (dx > WORLD_W / 2) x -= WORLD_W;
      else if (dx < -WORLD_W / 2) x += WORLD_W;
    }
    pts.push([x, y]);
  }
  const wet = [];
  for (let k = 0; k < cells.length; k++) {
    const i = cells[k];
    wet.push(!!simRiver[i] || !simLand[i]);
  }
  const lane = new Uint8Array(cells.length);
  for (let k = 0; k < cells.length;) {
    if (simLand[cells[k]]) { k++; continue; }
    let j = k;
    while (j < cells.length && !simLand[cells[j]]) j++;
    if (j - k >= SEA_LANE_SPAN) {
      for (let t = k; t < j; t++) lane[t] = 1;
    }
    k = j;
  }
  const anchor = [0];
  for (let k = 1; k < pts.length - 1; k++) {
    const shore = wet[k] !== wet[k - 1] || wet[k] !== wet[k + 1];
    const ax = pts[k][0] - pts[k - 1][0];
    const ay = pts[k][1] - pts[k - 1][1];
    const bx = pts[k + 1][0] - pts[k][0];
    const by = pts[k + 1][1] - pts[k][1];
    const bend = Math.abs(ax * by - ay * bx) > 0.2;
    if (shore || (bend && (!wet[k] || lane[k]))) anchor.push(k);
  }
  anchor.push(pts.length - 1);
  ctx.strokeStyle = "rgba(32, 26, 18, 0.88)";
  ctx.lineWidth = width / scale;
  for (let a = 0; a < anchor.length - 1; a++) {
    const i0 = anchor[a];
    const i1 = anchor[a + 1];
    const mid = cells[(i0 + i1) >> 1];
    const laneHere = lane[(i0 + i1) >> 1];
    const waterSpan = !laneHere && (simRiver[mid] || !simLand[mid]);
    ctx.beginPath();
    ctx.moveTo(pts[i0][0], pts[i0][1]);
    if (waterSpan) {
      ctx.setLineDash([]);
      ctx.lineCap = "round";
      ctx.lineTo(pts[i1][0], pts[i1][1]);
    } else {
      ctx.setLineDash(laneHere ? [3.8 / scale, 2.8 / scale] : []);
      ctx.lineCap = laneHere ? "butt" : "round";
      const p0 = pts[anchor[Math.max(0, a - 1)]];
      const p1 = pts[i0];
      const p2 = pts[i1];
      const p3 = pts[anchor[Math.min(anchor.length - 1, a + 2)]];
      for (let s = 1; s <= 6; s++) {
        const t = s / 6;
        const t2 = t * t;
        const t3 = t2 * t;
        const x = 0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
        const y = 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
        ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.lineCap = "round";
}

function drawPlay() {
  drawBorders();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  const claimed = new Uint8Array(SW * SH);
  for (const road of roads) {
    if (road.level < 0.02 || road.cells.length < 2) continue;
    const size = road.size != null ? road.size : Math.max(0.04, road.level);
    const width = road.size != null ? 2.4 * Math.sqrt(Math.max(size, 0.04)) : (1.15 + road.level * 3.6);
    const runs = roadDrawRuns(road.cells, claimed);
    for (let r = 0; r < runs.length; r++) strokeRoadCells(runs[r], width);
  }
  for (const s of shipments) {
    const [x, y] = cellWorld(s.x, s.y);
    ctx.fillStyle = "#8a6a22";
    ctx.fillRect(x - 0.45, y - 0.45, 0.9, 0.9);
  }
  for (const b of boats) {
    const [x, y] = cellWorld(b.x, b.y);
    const len = 1.2 * shipScale * Math.sqrt(Math.max(b.soldiers, 0.4));
    const ang = Math.atan2(b.ty - b.y, wrapDxSim(b.x, b.tx));
    const col = COLORS[b.realmId] || [20, 20, 20];
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len * 0.72);
    ctx.lineTo(x + Math.cos(ang + 2.5) * len * 0.55, y + Math.sin(ang + 2.5) * len * 0.38);
    ctx.lineTo(x + Math.cos(ang - 2.5) * len * 0.55, y + Math.sin(ang - 2.5) * len * 0.38);
    ctx.closePath();
    ctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
    ctx.fill();
    ctx.strokeStyle = "#1c1915";
    ctx.lineWidth = 0.55 / scale;
    ctx.stroke();
  }
  for (const realm of realms) {
    const col = COLORS[realm.id] || [20, 20, 20];
    for (const city of realm.cities) {
      const [x, y] = cellWorld(city.sx, city.sy);
      const rad = cityRadius(cityHeads(city));
      ctx.beginPath();
      ctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
      ctx.strokeStyle = "#1c1915";
      ctx.lineWidth = 0.7 / scale;
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      const dmg = city.destruction || 0;
      if (dmg > 0.03) {
        ctx.beginPath();
        ctx.strokeStyle = "rgba(28, 25, 21, 0.9)";
        ctx.lineWidth = (1.1 + dmg * 2.4) / scale;
        ctx.arc(x, y, rad * 0.72, -Math.PI / 2, -Math.PI / 2 + dmg * Math.PI * 2);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.strokeStyle = "#f4efe4";
      ctx.lineWidth = 0.8 / scale;
      ctx.moveTo(x - rad * 0.55, y);
      ctx.lineTo(x + rad * 0.55, y);
      ctx.moveTo(x, y - rad * 0.55);
      ctx.lineTo(x, y + rad * 0.55);
      ctx.stroke();
      if ((city.militia || 0) > 0.35) {
        ctx.beginPath();
        ctx.strokeStyle = "#1c1915";
        ctx.lineWidth = 0.7 / scale;
        ctx.arc(x, y, rad * 0.78, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (city.capital) {
        ctx.strokeStyle = "#1c1915";
        ctx.lineWidth = 1.1 / scale;
        ctx.strokeRect(x - rad - 0.55, y - rad - 0.55, (rad + 0.55) * 2, (rad + 0.55) * 2);
      }
      if (scale > fitScale * 1.4) {
        ctx.font = `${11 / scale}px Palatino Linotype, Palatino, Georgia, serif`;
        ctx.fillStyle = "#1c1915";
        ctx.textAlign = "center";
        ctx.fillText(String(Math.round(city.pop)), x, y - rad - 0.4);
      }
    }
    for (const order of realm.soldierOrders) drawArrow(realm, order, col, false);
    for (const order of realm.civilOrders) drawArrow(realm, order, col, true);
  }
  ctx.font = `${12 / scale}px Palatino Linotype, Palatino, Georgia, serif`;
  ctx.textAlign = "center";
  for (const f of fights) {
    if (!f.player && scale < fitScale * 1.6) continue;
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    ctx.fillStyle = "#1d4e89";
    ctx.fillText(String(f.blue), f.x, f.y - 1.2);
    ctx.fillStyle = "#9c2b2b";
    ctx.fillText(String(f.red), f.x, f.y + 1.6);
    ctx.globalAlpha = 1;
  }
}
function drawArrow(realm, order, col, civil) {
  const tails = order.sources && order.sources.length
    ? order.sources
    : [{ x: order.ox != null ? order.ox : realm.cx, y: order.oy != null ? order.oy : realm.cy }];
  for (let t = 0; t < tails.length; t++) drawArrowFrom(realm, order, col, civil, tails[t].x, tails[t].y, t === 0);
  if (!civil && order.vectors && order.vectors.length) drawVectors(realm, order, col);
}

function drawVectors(realm, order, col) {
  const rgb = realm.id === 1 ? "29, 78, 137" : col.join(", ");
  const base = order.auto ? 0.1 : 0.5;
  ctx.globalAlpha = base * 0.72;
  ctx.strokeStyle = "rgb(" + rgb + ")";
  ctx.lineWidth = (0.4 + order.strength * 0.28) / scale;
  ctx.setLineDash([1.6 / scale, 1.1 / scale]);
  const [x0, y0] = cellWorld(order.sx, order.sy);
  for (let v = 0; v < order.vectors.length; v++) {
    const vec = order.vectors[v];
    let x1 = vec.x * (GW / SW) + GW / SW * 0.5;
    const y1 = vec.y * (GH / SH) + GH / SH * 0.5;
    const dx = x1 - x0;
    if (dx > WORLD_W / 2) x1 -= WORLD_W;
    if (dx < -WORLD_W / 2) x1 += WORLD_W;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    const ang = Math.atan2(y1 - y0, x1 - x0);
    const ah = 1.15;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - Math.cos(ang - 0.5) * ah, y1 - Math.sin(ang - 0.5) * ah);
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - Math.cos(ang + 0.5) * ah, y1 - Math.sin(ang + 0.5) * ah);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawArrowFrom(realm, order, col, civil, ox, oy, primary) {
  const [x0, y0] = cellWorld(ox, oy);
  let x1 = order.sx * (GW / SW) + GW / SW * 0.5;
  const y1 = order.sy * (GH / SH) + GH / SH * 0.5;
  const dx = x1 - x0;
  if (dx > WORLD_W / 2) x1 -= WORLD_W;
  if (dx < -WORLD_W / 2) x1 += WORLD_W;
  let alpha = primary ? 1 : 0.72;
  if (!civil) {
    const base = order.auto ? 0.1 : 0.5;
    alpha = primary ? base : base * 0.72;
  }
  const rgb = civil ? "28, 25, 21" : (realm.id === 1 ? "29, 78, 137" : col.join(", "));
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = "rgb(" + rgb + ")";
  ctx.lineWidth = ((primary ? 0.7 : 0.45) + order.strength * 0.72) / scale;
  ctx.setLineDash(civil ? [] : [2.4 / scale, 1.4 / scale]);
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
  ctx.setLineDash([]);
  if (!primary) {
    ctx.globalAlpha = 1;
    return;
  }
  const ang = Math.atan2(y1 - y0, x1 - x0);
  const ah = 1.6 + order.strength * 0.35;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - Math.cos(ang - 0.45) * ah, y1 - Math.sin(ang - 0.45) * ah);
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - Math.cos(ang + 0.45) * ah, y1 - Math.sin(ang + 0.45) * ah);
  ctx.stroke();
  if (civil) {
    ctx.beginPath();
    ctx.arc(x1, y1, 0.8 + order.strength * 0.28, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function sampleSea(x, y) {
  if (!seaCache) return false;
  const xx = ((x % GW) + GW) % GW;
  const yy = Math.max(0, Math.min(GH - 1, y));
  return seaCache[yy * GW + xx] === 0;
}

function draw() {
  clampCam();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#e4dccb";
  ctx.fillRect(0, 0, cssW, cssH);

  const box = viewBox();
  for (const ox of [-WORLD_W, 0, WORLD_W]) {
    ctx.save();
    ctx.translate(box.cx + (ox - camX) * scale, box.cy + (0 - camY) * scale);
    ctx.scale(scale, scale);
    drawCopy();
    ctx.restore();
  }

  const vignette = ctx.createRadialGradient(
    box.cx, box.cy, Math.min(box.vw, box.vh) * 0.2,
    box.cx, box.cy, Math.max(box.vw, box.vh) * 0.62
  );
  vignette.addColorStop(0, "rgba(0,0,0,0)");
  vignette.addColorStop(1, "rgba(70, 58, 40, 0.18)");
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, cssW, Math.max(0, cssH - barPx));

  const zoomedOut = scale < fitScale * 1.15;
  if (zoomedOut) {
    ctx.save();
    ctx.strokeStyle = "#1c1915";
    ctx.lineWidth = 1.25;
    ctx.strokeRect(box.side - 7, box.top - 7, box.vw + 14, box.vh + 14);
    ctx.lineWidth = 0.6;
    ctx.strokeRect(box.side - 3, box.top - 3, box.vw + 6, box.vh + 6);
    ctx.font = "18px Palatino Linotype, Palatino, Georgia, serif";
    ctx.fillStyle = "#1c1915";
    ctx.textAlign = "center";
    ctx.fillText("HACHUARA", box.cx, 18);
    ctx.restore();
  }
  refreshCityTip();
}

let pointer = null;

function screenToWorld(cx, cy) {
  const box = viewBox();
  return {
    x: (cx - box.cx) / scale + camX,
    y: (cy - box.cy) / scale + camY,
  };
}

let tipX = 0;
let tipY = 0;
let tipOn = false;

function cityUnderCursor(wx, wy) {
  if (!realms || realms.length < 2) return null;
  const you = realms[0];
  let best = null;
  let bestD = Infinity;
  for (let r = 0; r < realms.length; r++) {
    const realm = realms[r];
    if (!realm || realm.id === you.id) continue;
    const cities = realm.cities;
    if (!cities) continue;
    for (let c = 0; c < cities.length; c++) {
      const city = cities[c];
      const at = cellWorld(city.sx, city.sy);
      let dx = wx - at[0];
      if (dx > WORLD_W / 2) dx -= WORLD_W;
      else if (dx < -WORLD_W / 2) dx += WORLD_W;
      const dy = wy - at[1];
      const d = Math.hypot(dx, dy);
      const rad = Math.max(cityRadius(cityHeads(city)), 12 / Math.max(scale, 0.05));
      if (d <= rad && d < bestD) { bestD = d; best = { city, realm }; }
    }
  }
  return best;
}

function refreshCityTip() {
  const el = document.getElementById("city-hover");
  if (!el) return;
  if (!cityTip || !tipOn || !realms || !realms.length) {
    el.style.display = "none";
    return;
  }
  const w = screenToWorld(tipX, tipY);
  const hit = cityUnderCursor(w.x, w.y);
  if (!hit) {
    el.style.display = "none";
    return;
  }
  const who = document.createElement("div");
  who.textContent = crownCalled(hit.realm.id) + " · " + Math.round(hit.realm.army || 0) + " soldiers · " + relationWith(hit.realm, realms[0]);
  const size = document.createElement("div");
  size.textContent = "City size " + Math.round(hit.city.pop);
  el.replaceChildren(who, size);
  el.style.display = "block";
  let left = tipX + 14;
  let top = tipY + 16;
  const tw = el.offsetWidth;
  const th = el.offsetHeight;
  if (left + tw > cssW - 8) left = Math.max(8, tipX - tw - 12);
  if (top + th > cssH - 8) top = Math.max(8, tipY - th - 12);
  el.style.left = left + "px";
  el.style.top = top + "px";
}

function orderUnderCursor(wx, wy, kind) {
  const realm = realms[0];
  if (!realm) return null;
  const hit = worldToSim(wx, wy);
  const city = nearestCity(1, hit[0], hit[1], TARGET_CLOSE);
  const sx = city ? city.sx : hit[0];
  const sy = city ? city.sy : hit[1];
  const list = kind === "pull" ? realm.civilOrders : realm.soldierOrders;
  const order = orderNear(list, sx, sy, city ? 1.25 : TARGET_CLOSE);
  return order ? { order, city, kind } : null;
}

function orderUnderRightClick(wx, wy) {
  const hit = worldToSim(wx, wy);
  const soldier = orderUnderCursor(wx, wy, "target");
  const civil = orderUnderCursor(wx, wy, "pull");
  if (soldier && civil) {
    const ds = dist2Sim(hit[0], hit[1], soldier.order.sx, soldier.order.sy);
    const dc = dist2Sim(hit[0], hit[1], civil.order.sx, civil.order.sy);
    return ds <= dc ? soldier : civil;
  }
  return soldier || civil;
}

function cutOrder(order, kind) {
  const realm = realms[0];
  if (!realm || !order) return false;
  const list = kind === "pull" ? realm.civilOrders : realm.soldierOrders;
  const at = list.indexOf(order);
  if (at < 0) return false;
  if (kind !== "pull") {
    order.auto = false;
    order.defend = false;
  }
  order.strength -= 1;
  order.life = orderLife;
  if (order.strength <= 0) {
    list.splice(at, 1);
    return false;
  }
  return true;
}

function growHeldOrder() {
  if (!pointer || !pointer.charge || pointer.drag) return false;
  if (command !== "target" && command !== "pull") return false;
  const now = performance.now();
  if (now - pointer.chargeT < 240) return false;
  const steps = Math.min(4, Math.floor((now - pointer.chargeT) / 240));
  pointer.chargeT += steps * 240;
  const realm = realms[0];
  if (!realm) {
    pointer.charge = null;
    return false;
  }
  const order = pointer.charge.order;
  const list = command === "pull" ? realm.civilOrders : realm.soldierOrders;
  if (list.indexOf(order) < 0) {
    pointer.charge = null;
    return false;
  }
  if (command === "target") {
    order.auto = false;
    order.defend = false;
  }
  let grew = false;
  for (let n = 0; n < steps; n++) {
    if (order.strength >= 8) break;
    if (command === "pull" && !payForPull(realm, order.sx, order.sy, 1)) break;
    order.strength = Math.min(8, order.strength + 1);
    if (pointer.charge.city) {
      order.srcAt = null;
      order.sx = pointer.charge.city.sx;
      order.sy = pointer.charge.city.sy;
    }
    pointer.charged = true;
    grew = true;
  }
  return grew;
}

function shrinkHeldOrder() {
  if (!pointer || !pointer.shrink || pointer.drag) return false;
  const now = performance.now();
  if (now - pointer.chargeT < 240) return false;
  const steps = Math.min(4, Math.floor((now - pointer.chargeT) / 240));
  pointer.chargeT += steps * 240;
  const pack = pointer.shrink;
  let changed = false;
  for (let n = 0; n < steps; n++) {
    if (!cutOrder(pack.order, pack.kind)) {
      pointer.shrink = null;
      pointer.charged = true;
      changed = true;
      break;
    }
    pointer.charged = true;
    changed = true;
  }
  return changed;
}

canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("pointerdown", (e) => {
  pointer = { id: e.pointerId, x: e.clientX, y: e.clientY, ox: e.clientX, oy: e.clientY, drag: false, charge: null, chargeT: 0, charged: false, button: e.button, shrink: null };
  const w = screenToWorld(e.clientX, e.clientY);
  if (e.button === 2) {
    e.preventDefault();
    const hit = orderUnderRightClick(w.x, w.y);
    if (hit) {
      pointer.shrink = hit;
      pointer.chargeT = performance.now();
    }
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  if (e.button === 0 && (command === "target" || command === "pull")) {
    const hit = orderUnderCursor(w.x, w.y, command);
    if (hit) {
      pointer.charge = hit;
      pointer.chargeT = performance.now();
      hit.order.life = orderLife;
    }
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointerup", (e) => {
  if (!pointer || e.pointerId !== pointer.id) return;
  const wasDrag = pointer.drag;
  const held = pointer.charged;
  const shrink = pointer.shrink;
  const button = pointer.button;
  pointer = null;
  canvas.classList.remove("dragging");
  if (button === 2) {
    if (shrink && !wasDrag && !held) {
      cutOrder(shrink.order, shrink.kind);
      draw();
    } else if (held) draw();
    return;
  }
  if (button !== 0) return;
  if (!wasDrag && !held) {
    const w = screenToWorld(e.clientX, e.clientY);
    if (command === "target") issueTarget(w.x, w.y);
    else if (command === "pull") issuePull(w.x, w.y);
    draw();
  } else if (held) draw();
});
canvas.addEventListener("pointerleave", () => {
  pointer = null;
  tipOn = false;
  canvas.classList.remove("dragging");
  refreshCityTip();
});
canvas.addEventListener("pointermove", (e) => {
  tipX = e.clientX;
  tipY = e.clientY;
  tipOn = true;
  if (!pointer || e.pointerId !== pointer.id) {
    refreshCityTip();
    return;
  }
  if (pointer.shrink) return;
  if (!pointer.drag && Math.hypot(e.clientX - pointer.ox, e.clientY - pointer.oy) > 5) {
    pointer.drag = true;
    canvas.classList.add("dragging");
  }
  if (!pointer.drag) return;
  camX -= (e.clientX - pointer.x) / scale;
  camY -= (e.clientY - pointer.y) / scale;
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  draw();
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0012);
  const next = Math.max(fitScale * 0.98, Math.min(fitScale * 18, scale * factor));
  const box = viewBox();
  const wx = (e.clientX - box.cx) / scale + camX;
  const wy = (e.clientY - box.cy) / scale + camY;
  scale = next;
  camX = wx - (e.clientX - box.cx) / scale;
  camY = wy - (e.clientY - box.cy) / scale;
  draw();
}, { passive: false });

const panKeys = { w: false, a: false, s: false, d: false };
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (!(k in panKeys)) return;
  panKeys[k] = true;
  e.preventDefault();
});
window.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (k in panKeys) panKeys[k] = false;
});

let panStamp = performance.now();
function applyPan() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - panStamp) / 1000);
  panStamp = now;
  if (!panKeys.w && !panKeys.a && !panKeys.s && !panKeys.d) return false;
  const step = 680 * dt / Math.max(scale, 0.15);
  if (panKeys.a) camX -= step;
  if (panKeys.d) camX += step;
  if (panKeys.w) camY -= step;
  if (panKeys.s) camY += step;
  clampCam();
  return true;
}
function watchPan() {
  if (applyPan() || growHeldOrder() || shrinkHeldOrder()) draw();
  requestAnimationFrame(watchPan);
}

function centerOnCapital(realm) {
  if (!realm) return;
  let cap = realm.capital;
  if (!cap && realm.cities) {
    for (let i = 0; i < realm.cities.length; i++) {
      if (!cap || realm.cities[i].pop > cap.pop) cap = realm.cities[i];
    }
  }
  if (!cap) return;
  const [x, y] = cellWorld(cap.sx, cap.sy);
  if (scale < fitScale * 3.2) scale = fitScale * 4;
  camX = x;
  camY = y;
  clampCam();
  draw();
}
function centerCapital() {
  centerOnCapital(realms[0]);
}
function applyPullLife(raw) {
  const n = Number(raw);
  if (!(n >= 5 && n <= 600)) return;
  config.pullSeconds = n;
  orderLife = n;
  if (!realms) return;
  for (let r = 0; r < realms.length; r++) {
    const lists = [realms[r].soldierOrders, realms[r].civilOrders];
    for (let p = 0; p < lists.length; p++) {
      const list = lists[p];
      for (let i = 0; i < list.length; i++) {
        if (list[i].life > orderLife) list[i].life = orderLife;
      }
    }
  }
}

function syncChrome() {
  const fitted = Math.abs(scale - fitScale) < Math.max(0.01, fitScale * 0.04);
  resize();
  if (fitted) fitWorld();
}

document.getElementById("settings").addEventListener("submit", (e) => e.preventDefault());
document.getElementById("pull-life").addEventListener("change", (e) => {
  applyPullLife(e.target.value);
  e.target.value = String(config.pullSeconds);
});
document.getElementById("move-pace").addEventListener("change", (e) => {
  const n = Number(e.target.value);
  if (!(n > 0)) return;
  config.movePace = n;
  movePace = n;
});
document.getElementById("fight-pace").addEventListener("change", (e) => {
  const n = Number(e.target.value);
  if (!(n > 0)) return;
  config.fightPace = n;
  fightPace = n;
});
document.getElementById("ship-size").addEventListener("change", (e) => {
  const n = Number(e.target.value);
  if (!(n > 0)) return;
  config.shipScale = n;
  shipScale = n;
  draw();
});
document.getElementById("city-tip").addEventListener("change", (e) => {
  config.cityTip = e.target.checked;
  cityTip = config.cityTip;
  refreshCityTip();
});
document.getElementById("militia-pace").addEventListener("change", (e) => {
  const n = Number(e.target.value);
  if (!(n > 0)) return;
  config.militiaPace = n;
  militiaPace = n;
});
document.getElementById("near-list").addEventListener("click", (e) => {
  const row = e.target.closest(".near-row");
  if (!row) return;
  e.preventDefault();
  e.stopPropagation();
  const id = Number(row.dataset.realm);
  if (!(id > 1) || !realms[id - 1]) return;
  centerOnCapital(realms[id - 1]);
});
document.getElementById("near-list").addEventListener("mousemove", (e) => {
  aggroX = e.clientX;
  aggroY = e.clientY;
  const line = e.target.closest(".near-aggro");
  if (!line) {
    if (aggroHold || overAggroTip(document.elementFromPoint(aggroX, aggroY))) return;
    aggroRealm = 0;
    hideAggroTip();
    return;
  }
  aggroRealm = Number(line.closest(".near-row").dataset.realm) || 0;
  showAggroTip(line, aggroX, aggroY, true);
});
document.getElementById("near-list").addEventListener("mouseleave", (e) => {
  if (aggroHold) return;
  const next = e.relatedTarget;
  if (overAggroTip(next) || overAggroTip(document.elementFromPoint(e.clientX, e.clientY))) return;
  aggroRealm = 0;
  hideAggroTip();
});
document.getElementById("aggro-tip").addEventListener("mousemove", (e) => {
  aggroX = e.clientX;
  aggroY = e.clientY;
});
document.getElementById("aggro-tip").addEventListener("mouseleave", (e) => {
  if (aggroHold) return;
  const next = e.relatedTarget;
  if (next && next.closest && next.closest(".near-aggro")) return;
  if (overAggroTip(next)) return;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  if (hit && hit.closest && (hit.closest(".near-aggro") || hit.closest("#aggro-tip"))) return;
  aggroRealm = 0;
  hideAggroTip();
});
document.getElementById("settings-btn").addEventListener("click", () => {
  const form = document.getElementById("settings");
  const opening = form.hasAttribute("hidden");
  form.toggleAttribute("hidden", !opening);
  document.getElementById("settings-btn").classList.toggle("active", opening);
  syncChrome();
});
document.getElementById("reseed").addEventListener("click", () => {
  SEED = (Math.random() * 0x7fffffff) | 0;
  buildWorld();
  cacheSea();
  setupPlay();
  fitWorld();
  centerCapital();
});

function startLoop() {
  if (simTimer) return;
  simTimer = setInterval(() => {
    simStep();
    draw();
  }, 140);
}

function cacheSea() {
  seaCache = new Uint8Array(GW * GH);
  const src = tone.getContext("2d").getImageData(0, 0, GW, GH).data;
  for (let i = 0; i < GW * GH; i++) {
    seaCache[i] = src[i * 4] < 236 ? 0 : 1;
  }
}

window.addEventListener("resize", () => {
  const keep = scale / fitScale;
  resize();
  scale = fitScale * keep;
  clampCam();
  draw();
});

buildWorld();
cacheSea();
setupPlay();
resize();
fitWorld();
centerCapital();
startLoop();
watchPan();

if (params.has("x")) camX = Number(params.get("x")) * WORLD_W;
if (params.has("y")) camY = Number(params.get("y")) * WORLD_H;
if (params.has("zoom")) scale = fitScale * Number(params.get("zoom"));
if (params.has("zoom") || params.has("x")) {
  clampCam();
  draw();
}
</script>
</body>
</html>
